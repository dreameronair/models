<script>
/* 游戏主体: Canvas 渲染 / 触控输入 / 消除流程编排 */
(function (global) {
  'use strict';

  var MK = global.MK;
  var CONFIG = MK.CONFIG;
  var CHARACTERS = MK.CHARACTERS;
  var LEVELS = MK.LEVELS;
  var Ease = MK.Ease;
  var Anim = MK.Anim;
  var Util = MK.Util;
  var Board = MK.Board;
  var Assets = MK.Assets;
  var Sound = MK.Sound;

  function cellKey(r, c) { return r * 100 + c; }

  function rgba(hex, alpha) {
    var v = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((v >> 16) & 255) + ',' + ((v >> 8) & 255) + ',' + (v & 255) + ',' + alpha + ')';
  }

  function Game(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.dpr = 1;
    this.size = 0;
    this.tile = 0;

    this.board = null;
    this.gen = 0;              // 每次重开局自增, 用来废弃过期的异步流程
    this.state = 'idle';       // idle | busy | over
    this.paused = false;
    this.running = false;

    this.levelIndex = 0;
    this.score = 0;
    this.moves = 0;
    this.collected = [];
    this.props = { hammer: 0, shuffle: 0 };
    this.propMode = null;

    this.selected = null;
    this.hint = null;
    this.idleTime = 0;
    this.time = 0;

    this.particles = [];
    this.floaters = [];
    this.effects = [];
    this.specialBuffer = [];   // 复用, 避免每帧分配数组

    this.lastSwap = null;
    this.handlers = {};

    this.bindInput();
  }

  Game.prototype.on = function (name, fn) {
    this.handlers[name] = fn;
    return this;
  };

  Game.prototype.emit = function (name, payload) {
    if (this.handlers[name]) this.handlers[name](payload);
  };

  /* ---------------- 尺寸与坐标 ---------------- */

  Game.prototype.resize = function () {
    var css = this.canvas.clientWidth;
    if (!css) return;
    this.dpr = Math.min(global.devicePixelRatio || 1, 2.5);
    this.size = css;
    this.tile = css / CONFIG.cols;
    this.canvas.width = Math.round(css * this.dpr);
    this.canvas.height = Math.round(css * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (this.board) this.snapTiles();
  };

  Game.prototype.cellX = function (c) { return c * this.tile + this.tile / 2; };
  Game.prototype.cellY = function (r) { return r * this.tile + this.tile / 2; };

  Game.prototype.snapTiles = function () {
    var self = this;
    this.board.forEach(function (tile, r, c) {
      tile.x = self.cellX(c);
      tile.y = self.cellY(r);
    });
  };

  Game.prototype.pointToCell = function (x, y) {
    var c = Math.floor(x / this.tile);
    var r = Math.floor(y / this.tile);
    if (!this.board || !this.board.inside(r, c)) return null;
    return { r: r, c: c };
  };

  /* ---------------- 输入 ---------------- */

  Game.prototype.bindInput = function () {
    var self = this;
    var el = this.canvas;
    var dragging = false;
    var origin = null;
    var startX = 0;
    var startY = 0;

    function local(e) {
      var rect = el.getBoundingClientRect();
      var t = e.touches && e.touches.length ? e.touches[0] : (e.changedTouches && e.changedTouches.length ? e.changedTouches[0] : e);
      return { x: t.clientX - rect.left, y: t.clientY - rect.top };
    }

    function down(e) {
      if (e.cancelable) e.preventDefault();
      if (!self.interactive()) return;
      var p = local(e);
      origin = self.pointToCell(p.x, p.y);
      if (!origin) return;
      startX = p.x;
      startY = p.y;
      dragging = true;
      self.idleTime = 0;
      self.hint = null;

      if (self.propMode === 'hammer') {
        var target = origin;
        dragging = false;
        origin = null;
        self.useHammer(target);
      }
    }

    function move(e) {
      if (!dragging || !origin) return;
      if (e.cancelable) e.preventDefault();
      var p = local(e);
      var dx = p.x - startX;
      var dy = p.y - startY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < self.tile * 0.38) return;

      var target;
      if (Math.abs(dx) > Math.abs(dy)) {
        target = { r: origin.r, c: origin.c + (dx > 0 ? 1 : -1) };
      } else {
        target = { r: origin.r + (dy > 0 ? 1 : -1), c: origin.c };
      }
      var from = origin;
      dragging = false;
      origin = null;
      if (self.board.inside(target.r, target.c)) self.trySwap(from, target);
    }

    function up(e) {
      if (!dragging || !origin) { dragging = false; origin = null; return; }
      if (e.cancelable) e.preventDefault();
      dragging = false;
      var cell = origin;
      origin = null;
      self.tapCell(cell);
    }

    el.addEventListener('touchstart', down, { passive: false });
    el.addEventListener('touchmove', move, { passive: false });
    el.addEventListener('touchend', up, { passive: false });
    el.addEventListener('touchcancel', function () { dragging = false; origin = null; });
    el.addEventListener('mousedown', down);
    el.addEventListener('mousemove', function (e) { if (dragging) move(e); });
    el.addEventListener('mouseup', up);
  };

  Game.prototype.interactive = function () {
    return this.state === 'idle' && !this.paused && !!this.board;
  };

  Game.prototype.tapCell = function (cell) {
    if (!this.interactive()) return;
    var prev = this.selected;

    if (!prev) {
      this.select(cell);
      return;
    }
    if (prev.r === cell.r && prev.c === cell.c) {
      this.select(null);
      return;
    }
    var adjacent = Math.abs(prev.r - cell.r) + Math.abs(prev.c - cell.c) === 1;
    if (adjacent) {
      this.select(null);
      this.trySwap(prev, cell);
    } else {
      this.select(cell);
    }
  };

  Game.prototype.select = function (cell) {
    var old = this.selected;
    if (old) {
      var oldTile = this.board.get(old.r, old.c);
      if (oldTile) Anim.to(oldTile, { scale: 1 }, 110, Ease.quadOut);
    }
    this.selected = cell;
    if (cell) {
      var tile = this.board.get(cell.r, cell.c);
      if (tile) Anim.to(tile, { scale: 1.1 }, 130, Ease.backOut);
      Sound.select();
    }
  };

  /* ---------------- 开局 ---------------- */

  Game.prototype.start = function (levelIndex) {
    this.gen++;
    Anim.cancelAll();

    this.levelIndex = levelIndex;
    var def = LEVELS[levelIndex];

    this.board = new Board(CONFIG.rows, CONFIG.cols, def.types);
    this.board.generate();

    this.score = 0;
    this.moves = def.moves;
    this.collected = def.collect.map(function (goal) {
      return { type: goal.type, need: goal.count, have: 0 };
    });
    this.props = { hammer: CONFIG.props.hammer, shuffle: CONFIG.props.shuffle };
    this.propMode = null;
    this.selected = null;
    this.hint = null;
    this.idleTime = 0;
    this.particles = [];
    this.floaters = [];
    this.effects = [];
    this.paused = false;
    this.state = 'busy';

    this.resize();
    this.pushHud();
    if (!this.running) this.loop();
    this.playIntro(this.gen);
  };

  Game.prototype.playIntro = function (gen) {
    var self = this;
    var promises = [];
    this.board.forEach(function (tile, r, c) {
      tile.x = self.cellX(c);
      tile.y = self.cellY(r) - self.size * 1.15;
      tile.alpha = 1;
      var delay = c * 26 + r * 12;
      promises.push(
        Anim.wait(delay).then(function () {
          if (gen !== self.gen) return null;
          return Anim.to(tile, { y: self.cellY(r) }, 420, Ease.drop);
        })
      );
    });
    Promise.all(promises).then(function () {
      if (gen !== self.gen) return;
      self.state = 'idle';
      self.idleTime = 0;
    });
  };

  /* ---------------- 交换与消除 ---------------- */

  Game.prototype.animateSwap = function (ta, tb) {
    var ax = ta.x, ay = ta.y, bx = tb.x, by = tb.y;
    return Promise.all([
      Anim.to(ta, { x: bx, y: by }, CONFIG.swapTime, Ease.quadOut),
      Anim.to(tb, { x: ax, y: ay }, CONFIG.swapTime, Ease.quadOut)
    ]);
  };

  Game.prototype.trySwap = function (a, b) {
    if (!this.interactive()) return;
    var self = this;
    var gen = this.gen;
    var ta = this.board.get(a.r, a.c);
    var tb = this.board.get(b.r, b.c);
    if (!ta || !tb) return;

    this.state = 'busy';
    this.select(null);
    this.idleTime = 0;
    this.hint = null;

    var valid = this.board.isValidSwap(a, b);
    Sound.swap();

    this.animateSwap(ta, tb).then(function () {
      if (gen !== self.gen) return null;
      if (!valid) {
        Sound.invalid();
        return self.animateSwap(ta, tb).then(function () {
          if (gen !== self.gen) return;
          self.state = 'idle';
          self.idleTime = 0;
        });
      }

      self.board.swapTiles(a, b);
      self.lastSwap = { a: { r: a.r, c: a.c }, b: { r: b.r, c: b.c } };
      self.moves--;
      self.vibrate(12);
      self.pushHud();

      var trigger = self.buildSwapTrigger(a, b);
      return self.runCascade(gen, trigger);
    });
  };

  /** 交换涉及特殊棋子时, 组装首轮要引爆的种子格与彩虹目标色。 */
  Game.prototype.buildSwapTrigger = function (a, b) {
    var ta = this.board.get(a.r, a.c);
    var tb = this.board.get(b.r, b.c);
    var trigger = { seeds: [], partnerType: null, extra: [] };
    if (!ta || !tb) return trigger;

    var sa = ta.special;
    var sb = tb.special;
    if (!sa && !sb) return trigger;

    if (sa) trigger.seeds.push({ r: a.r, c: a.c });
    if (sb) trigger.seeds.push({ r: b.r, c: b.c });

    if (sa === 'rainbow' && !sb) trigger.partnerType = tb.type;
    if (sb === 'rainbow' && !sa) trigger.partnerType = ta.type;

    if (sa && sb) {
      // 双特殊组合技
      if (sa === 'rainbow' && sb === 'rainbow') {
        for (var r = 0; r < this.board.rows; r++) {
          for (var c = 0; c < this.board.cols; c++) trigger.extra.push({ r: r, c: c });
        }
      } else if ((sa === 'bomb' && (sb === 'row' || sb === 'col')) ||
                 (sb === 'bomb' && (sa === 'row' || sa === 'col'))) {
        // 十字大范围: 以交换点为中心的三行三列
        for (var d = -1; d <= 1; d++) {
          for (var i = 0; i < this.board.cols; i++) trigger.extra.push({ r: b.r + d, c: i });
          for (var j = 0; j < this.board.rows; j++) trigger.extra.push({ r: j, c: b.c + d });
        }
      }
    }
    return trigger;
  };

  /** 选择特殊棋子的生成位置: 优先玩家刚交换的格子, 其次十字交点, 最后取最长段中点。 */
  Game.prototype.pickCreationCell = function (group) {
    var swap = this.lastSwap;
    var i;
    if (swap) {
      for (i = 0; i < group.cells.length; i++) {
        var cell = group.cells[i];
        if ((cell.r === swap.a.r && cell.c === swap.a.c) ||
            (cell.r === swap.b.r && cell.c === swap.b.c)) {
          return cell;
        }
      }
    }

    var hRuns = [], vRuns = [];
    for (i = 0; i < group.runs.length; i++) {
      (group.runs[i].dir === 'h' ? hRuns : vRuns).push(group.runs[i]);
    }
    for (i = 0; i < hRuns.length; i++) {
      for (var j = 0; j < vRuns.length; j++) {
        var h = hRuns[i], v = vRuns[j];
        if (h.r >= v.r && h.r < v.r + v.len && v.c >= h.c && v.c < h.c + h.len) {
          return { r: h.r, c: v.c };
        }
      }
    }

    var longest = group.longest;
    var mid = Math.floor(longest.len / 2);
    return longest.dir === 'h'
      ? { r: longest.r, c: longest.c + mid }
      : { r: longest.r + mid, c: longest.c };
  };

  Game.prototype.runCascade = function (gen, trigger) {
    var self = this;
    var cascade = 0;
    var pending = trigger || { seeds: [], partnerType: null, extra: [] };

    function stepOnce() {
      if (gen !== self.gen) return Promise.resolve();

      var groups = self.board.findMatches();
      var hasTrigger = pending.seeds.length > 0 || pending.extra.length > 0;
      if (!groups.length && !hasTrigger) return Promise.resolve();

      cascade++;

      var creations = [];
      var reserved = {};
      var seeds = [];
      var gi, ci;

      for (gi = 0; gi < groups.length; gi++) {
        var group = groups[gi];
        for (ci = 0; ci < group.cells.length; ci++) seeds.push(group.cells[ci]);
        if (group.special) {
          var pos = self.pickCreationCell(group);
          reserved[cellKey(pos.r, pos.c)] = true;
          creations.push({ r: pos.r, c: pos.c, special: group.special, type: group.type });
        }
      }
      for (ci = 0; ci < pending.seeds.length; ci++) seeds.push(pending.seeds[ci]);
      for (ci = 0; ci < pending.extra.length; ci++) seeds.push(pending.extra[ci]);

      var partnerType = pending.partnerType;
      pending = { seeds: [], partnerType: null, extra: [] };

      var result = self.board.expandClears(seeds, partnerType);
      var cleared = [];
      for (ci = 0; ci < result.cleared.length; ci++) {
        if (!reserved[cellKey(result.cleared[ci].r, result.cleared[ci].c)]) {
          cleared.push(result.cleared[ci]);
        }
      }
      if (!cleared.length && !creations.length) return Promise.resolve();

      return self.applyClears(gen, cleared, result.effects, creations, cascade)
        .then(function () {
          if (gen !== self.gen) return null;
          return self.applyCollapse(gen);
        })
        .then(function () {
          if (gen !== self.gen) return null;
          self.lastSwap = null;
          return stepOnce();
        });
    }

    return stepOnce().then(function () {
      if (gen !== self.gen) return null;
      return self.afterCascade(gen, cascade);
    });
  };

  Game.prototype.applyClears = function (gen, cleared, effects, creations, cascade) {
    var self = this;
    var multiplier = 1 + CONFIG.comboStep * (cascade - 1);
    var gained = Math.round(cleared.length * CONFIG.scorePerTile * multiplier) +
                 effects.length * CONFIG.specialBonus;
    this.score += gained;

    var i;
    // 记录收集目标进度
    for (i = 0; i < cleared.length; i++) {
      var type = cleared[i].tile.type;
      for (var g = 0; g < this.collected.length; g++) {
        if (this.collected[g].type === type && this.collected[g].have < this.collected[g].need) {
          this.collected[g].have++;
        }
      }
    }

    // 特殊棋子的视觉特效
    for (i = 0; i < effects.length; i++) {
      var fx = effects[i];
      this.effects.push({
        kind: fx.special,
        x: this.cellX(fx.c),
        y: this.cellY(fx.r),
        row: fx.r,
        col: fx.c,
        color: CHARACTERS[fx.type].color,
        life: 0,
        maxLife: fx.special === 'rainbow' ? 520 : 380
      });
      Sound.special(fx.special);
    }
    if (effects.length) this.vibrate(28);

    Sound.pop(cascade);

    // 飘分
    var cx = 0, cy = 0;
    for (i = 0; i < cleared.length; i++) {
      cx += cleared[i].tile.x;
      cy += cleared[i].tile.y;
    }
    if (cleared.length) {
      this.floaters.push({
        x: Util.clamp(cx / cleared.length, this.tile * 1.2, this.size - this.tile * 1.2),
        y: cy / cleared.length,
        text: '+' + gained,
        sub: cascade > 1 ? ('连锁 x' + cascade) : '',
        life: 0,
        maxLife: 900
      });
    }

    var promises = [];
    for (i = 0; i < cleared.length; i++) {
      promises.push(this.popTile(cleared[i], Math.min(160, i * 9), gen));
    }
    for (i = 0; i < creations.length; i++) {
      promises.push(this.promoteTile(creations[i], gen));
    }

    this.pushHud();
    return Promise.all(promises).then(function () {
      if (gen !== self.gen) return;
      for (var k = 0; k < cleared.length; k++) {
        self.board.remove(cleared[k].r, cleared[k].c);
      }
    });
  };

  Game.prototype.popTile = function (entry, delay, gen) {
    var self = this;
    var tile = entry.tile;
    return Anim.wait(delay).then(function () {
      if (gen !== self.gen) return null;
      self.spawnParticles(tile.x, tile.y, CHARACTERS[tile.type].color);
      return Anim.to(tile, { scale: 1.28 }, CONFIG.popTime * 0.35, Ease.quadOut)
        .then(function () {
          if (gen !== self.gen) return null;
          return Anim.to(tile, { scale: 0, alpha: 0 }, CONFIG.popTime * 0.65, Ease.quadIn);
        });
    });
  };

  Game.prototype.promoteTile = function (creation, gen) {
    var self = this;
    var tile = this.board.get(creation.r, creation.c);
    if (!tile) return Promise.resolve();
    tile.special = creation.special;
    tile.type = creation.type;
    Sound.create();
    // 抬高一格, 避免和同时出现的飘分文字叠在一起
    this.floaters.push({
      x: Util.clamp(tile.x, this.tile * 1.4, this.size - this.tile * 1.4),
      y: tile.y - this.tile * 1.15,
      text: MK.SPECIAL_LABEL[creation.special],
      sub: '',
      life: 0,
      maxLife: 1000,
      small: true
    });
    return Anim.to(tile, { scale: 1.35 }, 150, Ease.backOut).then(function () {
      if (gen !== self.gen) return null;
      return Anim.to(tile, { scale: 1 }, 180, Ease.quadOut);
    });
  };

  Game.prototype.applyCollapse = function (gen) {
    var self = this;
    var res = this.board.collapse();
    var promises = [];
    var i;

    for (i = 0; i < res.moves.length; i++) {
      var mv = res.moves[i];
      var dur = Math.max(CONFIG.fallTimeMin, mv.distance * CONFIG.fallTimePerCell);
      promises.push(Anim.to(mv.tile, { y: this.cellY(mv.toRow) }, dur, Ease.drop));
    }
    for (i = 0; i < res.spawns.length; i++) {
      var sp = res.spawns[i];
      sp.tile.x = this.cellX(sp.col);
      sp.tile.y = this.cellY(-sp.offset);
      sp.tile.scale = 1;
      sp.tile.alpha = 1;
      var d2 = Math.max(CONFIG.fallTimeMin, (sp.row + sp.offset) * CONFIG.fallTimePerCell);
      promises.push(Anim.to(sp.tile, { y: this.cellY(sp.row) }, d2, Ease.drop));
    }

    return Promise.all(promises).then(function () {
      if (gen !== self.gen) return;
      self.snapTiles();
    });
  };

  Game.prototype.afterCascade = function (gen, cascade) {
    var self = this;
    this.pushHud();

    if (this.isCleared()) {
      this.finish(true);
      return Promise.resolve();
    }
    if (this.moves <= 0) {
      this.finish(false);
      return Promise.resolve();
    }
    if (!this.board.findMove()) {
      this.emit('toast', '没有可以消除的组合啦，自动洗牌～');
      return this.doShuffle(gen).then(function () {
        if (gen !== self.gen) return;
        self.state = 'idle';
        self.idleTime = 0;
      });
    }

    this.state = 'idle';
    this.idleTime = 0;
    return Promise.resolve();
  };

  Game.prototype.isCleared = function () {
    for (var i = 0; i < this.collected.length; i++) {
      if (this.collected[i].have < this.collected[i].need) return false;
    }
    return true;
  };

  Game.prototype.finish = function (won) {
    var def = LEVELS[this.levelIndex];
    this.state = 'over';
    this.selected = null;
    this.hint = null;

    var stars = 0;
    if (won) {
      var ratio = this.score / def.target;
      stars = ratio >= 1.5 ? 3 : (ratio >= 1 ? 2 : 1);
      Sound.win();
    } else {
      Sound.lose();
    }

    if (won) {
      var progress = MK.Storage.get('progress', {});
      var record = progress[this.levelIndex] || { stars: 0, best: 0 };
      record.stars = Math.max(record.stars, stars);
      record.best = Math.max(record.best, this.score);
      progress[this.levelIndex] = record;
      MK.Storage.set('progress', progress);

      var unlocked = MK.Storage.get('unlocked', 0);
      if (this.levelIndex >= unlocked && this.levelIndex + 1 < LEVELS.length) {
        MK.Storage.set('unlocked', this.levelIndex + 1);
      }
    }

    this.emit('finish', {
      won: won,
      stars: stars,
      score: this.score,
      target: def.target,
      level: this.levelIndex,
      gen: this.gen
    });
  };

  /* ---------------- 道具 ---------------- */

  Game.prototype.setPropMode = function (mode) {
    this.propMode = this.propMode === mode ? null : mode;
    this.select(null);
    this.emit('propmode', this.propMode);
  };

  Game.prototype.useHammer = function (cell) {
    if (!cell || !this.interactive() || this.props.hammer <= 0) return;
    var gen = this.gen;
    this.props.hammer--;
    this.propMode = null;
    this.emit('propmode', null);
    this.state = 'busy';
    this.vibrate(20);
    this.pushHud();
    this.runCascade(gen, { seeds: [{ r: cell.r, c: cell.c }], partnerType: null, extra: [] });
  };

  Game.prototype.useShuffle = function () {
    if (!this.interactive() || this.props.shuffle <= 0) return;
    var gen = this.gen;
    var self = this;
    this.props.shuffle--;
    this.propMode = null;
    this.emit('propmode', null);
    this.state = 'busy';
    this.pushHud();
    this.doShuffle(gen).then(function () {
      if (gen !== self.gen) return null;
      return self.runCascade(gen, null);
    });
  };

  Game.prototype.doShuffle = function (gen) {
    var self = this;
    var tiles = [];
    this.board.forEach(function (tile) { tiles.push(tile); });

    var out = tiles.map(function (tile) {
      return Anim.to(tile, { scale: 0.15, spin: 0.6 }, 200, Ease.quadIn);
    });

    return Promise.all(out).then(function () {
      if (gen !== self.gen) return null;
      self.board.shuffleBoard();
      self.snapTiles();
      var back = [];
      self.board.forEach(function (tile) {
        back.push(Anim.to(tile, { scale: 1, spin: 0 }, 260, Ease.backOut));
      });
      Sound.create();
      return Promise.all(back);
    });
  };

  /* ---------------- 提示 / 粒子 ---------------- */

  Game.prototype.pause = function () {
    this.paused = true;
  };

  Game.prototype.resume = function () {
    this.paused = false;
    this.idleTime = 0;
  };

  Game.prototype.showHint = function () {
    if (!this.interactive()) return;
    var move = this.board.findMove();
    if (move) this.hint = move;
  };

  Game.prototype.spawnParticles = function (x, y, color) {
    var count = 5;
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = (0.06 + Math.random() * 0.13) * this.tile;
      this.particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - this.tile * 0.05,
        size: this.tile * (0.05 + Math.random() * 0.08),
        color: color,
        star: Math.random() < 0.45,
        life: 0,
        maxLife: 420 + Math.random() * 260
      });
    }
  };

  Game.prototype.vibrate = function (ms) {
    if (global.navigator && global.navigator.vibrate) {
      try { global.navigator.vibrate(ms); } catch (e) { /* 忽略 */ }
    }
  };

  Game.prototype.pushHud = function () {
    var def = LEVELS[this.levelIndex];
    this.emit('hud', {
      level: this.levelIndex,
      score: this.score,
      target: def.target,
      moves: Math.max(0, this.moves),
      collected: this.collected,
      props: this.props
    });
  };

  /* ---------------- 主循环与渲染 ---------------- */

  Game.prototype.loop = function () {
    var self = this;
    var last = 0;
    this.running = true;

    function frame(now) {
      if (!last) last = now;
      var dt = Math.min(48, now - last);
      last = now;

      if (!self.paused) {
        self.time += dt;
        Anim.update(dt);
        self.updateEffects(dt);
        if (self.state === 'idle') {
          self.idleTime += dt;
          if (self.idleTime > CONFIG.hintDelay && !self.hint) self.showHint();
        }
      }
      self.render();
      global.requestAnimationFrame(frame);
    }
    global.requestAnimationFrame(frame);
  };

  Game.prototype.updateEffects = function (dt) {
    var i, p;
    for (i = this.particles.length - 1; i >= 0; i--) {
      p = this.particles[i];
      p.life += dt;
      if (p.life >= p.maxLife) { this.particles.splice(i, 1); continue; }
      p.x += p.vx * dt * 0.06;
      p.y += p.vy * dt * 0.06;
      p.vy += this.tile * 0.0085 * dt * 0.06;
    }
    for (i = this.floaters.length - 1; i >= 0; i--) {
      p = this.floaters[i];
      p.life += dt;
      if (p.life >= p.maxLife) this.floaters.splice(i, 1);
    }
    for (i = this.effects.length - 1; i >= 0; i--) {
      p = this.effects[i];
      p.life += dt;
      if (p.life >= p.maxLife) this.effects.splice(i, 1);
    }
  };

  Game.prototype.render = function () {
    var ctx = this.ctx;
    var size = this.size;
    if (!size) return;

    ctx.clearRect(0, 0, size, size);
    if (!this.board) return;

    var radius = this.tile * 0.34;

    // 棋盘底
    ctx.save();
    Util.roundRect(ctx, 0, 0, size, size, radius);
    ctx.fillStyle = 'rgba(255,255,255,0.26)';
    ctx.fill();
    ctx.clip();

    // 格子底纹
    for (var r = 0; r < CONFIG.rows; r++) {
      for (var c = 0; c < CONFIG.cols; c++) {
        ctx.fillStyle = (r + c) % 2 === 0 ? 'rgba(255,255,255,0.16)' : 'rgba(255,255,255,0.06)';
        ctx.fillRect(c * this.tile, r * this.tile, this.tile, this.tile);
      }
    }

    this.drawHint(ctx);
    this.drawSelection(ctx);

    var self = this;
    var specials = this.specialBuffer;
    specials.length = 0;
    this.board.forEach(function (tile) {
      if (tile.special) specials.push(tile);
      else self.drawTile(tile);
    });
    // 特殊棋子最后画, 保证光环不被相邻棋子盖住
    for (var s = 0; s < specials.length; s++) this.drawTile(specials[s]);

    this.drawEffects(ctx);
    this.drawParticles(ctx);
    ctx.restore();

    this.drawFloaters(ctx);
  };

  Game.prototype.drawSelection = function (ctx) {
    if (!this.selected) return;
    var pulse = 0.5 + 0.5 * Math.sin(this.time * 0.012);
    var x = this.selected.c * this.tile;
    var y = this.selected.r * this.tile;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.6 + pulse * 0.4) + ')';
    ctx.lineWidth = this.tile * 0.07;
    Util.roundRect(ctx, x + 2, y + 2, this.tile - 4, this.tile - 4, this.tile * 0.26);
    ctx.stroke();
    ctx.restore();
  };

  Game.prototype.drawHint = function (ctx) {
    if (!this.hint) return;
    var pulse = 0.5 + 0.5 * Math.sin(this.time * 0.008);
    var cells = [this.hint.a, this.hint.b];
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,' + (0.12 + pulse * 0.3) + ')';
    for (var i = 0; i < cells.length; i++) {
      Util.roundRect(ctx, cells[i].c * this.tile + 2, cells[i].r * this.tile + 2,
        this.tile - 4, this.tile - 4, this.tile * 0.26);
      ctx.fill();
    }
    ctx.restore();
  };

  Game.prototype.drawTile = function (tile) {
    var ctx = this.ctx;
    var ch = CHARACTERS[tile.type];
    var s = this.tile * 0.92 * tile.scale;
    if (s <= 0.5 || tile.alpha <= 0.01) return;

    ctx.save();
    ctx.translate(tile.x, tile.y);
    if (tile.spin) ctx.rotate(tile.spin);
    ctx.globalAlpha = tile.alpha;

    var half = s / 2;
    var corner = s * 0.3;

    // 特殊棋子在底板后面加一层呼吸的金色光环
    if (tile.special) {
      var pulse = 0.72 + 0.28 * Math.sin(this.time * 0.006);
      var glow = ctx.createRadialGradient(0, 0, s * 0.26, 0, 0, s * 0.78);
      glow.addColorStop(0, 'rgba(255,231,120,' + (0.6 * pulse).toFixed(3) + ')');
      glow.addColorStop(1, 'rgba(255,196,50,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(0, 0, s * 0.78, 0, Math.PI * 2);
      ctx.fill();
    }

    // 底板
    var grad = ctx.createLinearGradient(0, -half, 0, half);
    grad.addColorStop(0, 'rgba(255,255,255,0.96)');
    grad.addColorStop(0.55, rgba(ch.light, 0.95));
    grad.addColorStop(1, rgba(ch.color, 0.78));
    Util.roundRect(ctx, -half, -half, s, s, corner);
    ctx.fillStyle = grad;
    ctx.fill();

    // 方向闪电的能量条纹垫在角色下面
    if (tile.special === 'row' || tile.special === 'col') {
      ctx.save();
      Util.roundRect(ctx, -half, -half, s, s, corner);
      ctx.clip();
      ctx.fillStyle = 'rgba(255,246,176,0.95)';
      for (var k = -1; k <= 1; k += 2) {
        if (tile.special === 'row') ctx.fillRect(-half, k * s * 0.3 - s * 0.05, s, s * 0.1);
        else ctx.fillRect(k * s * 0.3 - s * 0.05, -half, s * 0.1, s);
      }
      ctx.restore();
    }

    ctx.lineWidth = Math.max(1.2, s * (tile.special ? 0.06 : 0.045));
    ctx.strokeStyle = tile.special ? '#ffce34' : 'rgba(255,255,255,0.92)';
    Util.roundRect(ctx, -half, -half, s, s, corner);
    ctx.stroke();

    var img = Assets.sprite(tile.type);
    if (img) {
      var sp = s * 0.95;
      ctx.drawImage(img, -sp / 2, -sp / 2, sp, sp);
    }

    if (tile.special) this.drawSpecialBadge(ctx, tile, s);
    ctx.restore();
  };

  /** 特殊棋子的标识画在角色之上, 保证一眼能认出来。 */
  Game.prototype.drawSpecialBadge = function (ctx, tile, s) {
    var half = s / 2;

    if (tile.special === 'row' || tile.special === 'col') {
      // 指向消除方向的双箭头
      ctx.fillStyle = '#ffb300';
      ctx.strokeStyle = '#fffbe6';
      ctx.lineWidth = s * 0.03;
      for (var side = -1; side <= 1; side += 2) {
        ctx.save();
        if (tile.special === 'row') ctx.translate(side * half * 0.82, 0);
        else { ctx.translate(0, side * half * 0.82); ctx.rotate(Math.PI / 2); }
        ctx.scale(side, 1);
        ctx.beginPath();
        ctx.moveTo(-s * 0.09, -s * 0.13);
        ctx.lineTo(s * 0.07, 0);
        ctx.lineTo(-s * 0.09, s * 0.13);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    } else if (tile.special === 'bomb') {
      ctx.fillStyle = 'rgba(46,28,72,0.92)';
      ctx.beginPath();
      ctx.arc(half * 0.55, half * 0.55, s * 0.19, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffce34';
      ctx.lineWidth = Math.max(1, s * 0.035);
      ctx.stroke();
      // 中间的星形火花
      ctx.fillStyle = '#ffe94d';
      ctx.save();
      ctx.translate(half * 0.55, half * 0.55);
      ctx.beginPath();
      for (var i = 0; i < 8; i++) {
        var rad = i % 2 === 0 ? s * 0.11 : s * 0.045;
        var ang = Math.PI / 4 * i - Math.PI / 2;
        if (i === 0) ctx.moveTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
        else ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else if (tile.special === 'rainbow') {
      var colors = ['#ff5f8f', '#ffb43d', '#ffe94d', '#6fdd8a', '#4fb6ff', '#b184ff'];
      ctx.lineWidth = s * 0.085;
      var spin = this.time * 0.002;
      for (var c = 0; c < colors.length; c++) {
        ctx.strokeStyle = colors[c];
        ctx.beginPath();
        ctx.arc(0, 0, half * 0.94, spin + c * Math.PI / 3, spin + (c + 1) * Math.PI / 3);
        ctx.stroke();
      }
    }
  };

  Game.prototype.drawEffects = function (ctx) {
    for (var i = 0; i < this.effects.length; i++) {
      var fx = this.effects[i];
      var p = fx.life / fx.maxLife;
      var fade = 1 - p;
      ctx.save();
      ctx.globalAlpha = fade;

      if (fx.kind === 'row' || fx.kind === 'col') {
        var thickness = this.tile * (0.35 + p * 0.55);
        var grad = fx.kind === 'row'
          ? ctx.createLinearGradient(0, fx.y - thickness, 0, fx.y + thickness)
          : ctx.createLinearGradient(fx.x - thickness, 0, fx.x + thickness, 0);
        grad.addColorStop(0, 'rgba(255,255,255,0)');
        grad.addColorStop(0.5, 'rgba(255,255,190,0.95)');
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        if (fx.kind === 'row') ctx.fillRect(0, fx.y - thickness, this.size, thickness * 2);
        else ctx.fillRect(fx.x - thickness, 0, thickness * 2, this.size);
      } else if (fx.kind === 'bomb') {
        var radius = this.tile * (0.6 + p * 1.9);
        var ring = ctx.createRadialGradient(fx.x, fx.y, radius * 0.45, fx.x, fx.y, radius);
        ring.addColorStop(0, 'rgba(255,220,120,0)');
        ring.addColorStop(0.7, 'rgba(255,180,80,0.75)');
        ring.addColorStop(1, 'rgba(255,120,60,0)');
        ctx.fillStyle = ring;
        ctx.beginPath();
        ctx.arc(fx.x, fx.y, radius, 0, Math.PI * 2);
        ctx.fill();
      } else {
        var rr = this.size * (0.15 + p * 1.05);
        ctx.lineWidth = this.tile * 0.3 * fade;
        var colors = ['#ff5f8f', '#ffe94d', '#6fdd8a', '#4fb6ff', '#b184ff'];
        for (var k = 0; k < colors.length; k++) {
          ctx.strokeStyle = colors[k];
          ctx.beginPath();
          ctx.arc(fx.x, fx.y, rr - k * this.tile * 0.16, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      ctx.restore();
    }
  };

  Game.prototype.drawParticles = function (ctx) {
    for (var i = 0; i < this.particles.length; i++) {
      var p = this.particles[i];
      var fade = 1 - p.life / p.maxLife;
      ctx.save();
      ctx.globalAlpha = Math.max(0, fade);
      ctx.fillStyle = p.color;
      if (p.star) {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.life * 0.006);
        ctx.beginPath();
        for (var s = 0; s < 10; s++) {
          var rad = s % 2 === 0 ? p.size : p.size * 0.45;
          var ang = Math.PI / 5 * s - Math.PI / 2;
          if (s === 0) ctx.moveTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
          else ctx.lineTo(Math.cos(ang) * rad, Math.sin(ang) * rad);
        }
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * fade, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  };

  Game.prototype.drawFloaters = function (ctx) {
    for (var i = 0; i < this.floaters.length; i++) {
      var f = this.floaters[i];
      var p = f.life / f.maxLife;
      var fontSize = this.tile * (f.small ? 0.3 : 0.42);
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - Math.pow(p, 2.2));
      ctx.translate(f.x, f.y - this.tile * 0.9 * p);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '800 ' + fontSize + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.lineWidth = fontSize * 0.24;
      ctx.strokeStyle = 'rgba(90,40,110,0.85)';
      ctx.fillStyle = '#fff6b0';
      ctx.strokeText(f.text, 0, 0);
      ctx.fillText(f.text, 0, 0);
      if (f.sub) {
        ctx.font = '800 ' + fontSize * 0.7 + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.lineWidth = fontSize * 0.18;
        ctx.fillStyle = '#ffd0ea';
        ctx.strokeText(f.sub, 0, fontSize * 0.95);
        ctx.fillText(f.sub, 0, fontSize * 0.95);
      }
      ctx.restore();
    }
  };

  MK.Game = Game;
})(window);

</script>
<script>
/* 微信内置浏览器适配: 音频解锁时机、分享信息、返回键处理 */
(function (global) {
  'use strict';

  var MK = global.MK;
  var ua = global.navigator.userAgent || '';

  var Wechat = {
    isWechat: /micromessenger/i.test(ua),
    isIOS: /iphone|ipad|ipod/i.test(ua),
    isAndroid: /android/i.test(ua)
  };

  /** 微信里 WebAudio 需要等 JSBridge 就绪或用户手势, 两条路都挂上。 */
  Wechat.onBridgeReady = function (callback) {
    if (typeof global.WeixinJSBridge !== 'undefined') {
      callback();
      return;
    }
    global.document.addEventListener('WeixinJSBridgeReady', callback, false);
  };

  /**
   * 配置微信分享卡片。需要后端提供 JSSDK 签名, 在页面里提前注入:
   *   window.WX_JSSDK_CONFIG = { appId, timestamp, nonceStr, signature };
   * 未注入时静默跳过, 玩家仍可用右上角菜单手动分享(标题与 og 标签已就绪)。
   */
  Wechat.setupShare = function (info) {
    var config = global.WX_JSSDK_CONFIG;
    if (!config || typeof global.wx === 'undefined') return false;

    var wx = global.wx;
    try {
      wx.config({
        debug: false,
        appId: config.appId,
        timestamp: config.timestamp,
        nonceStr: config.nonceStr,
        signature: config.signature,
        jsApiList: ['updateAppMessageShareData', 'updateTimelineShareData']
      });
      wx.ready(function () {
        var payload = {
          title: info.title,
          desc: info.desc,
          link: info.link,
          imgUrl: info.imgUrl
        };
        if (wx.updateAppMessageShareData) wx.updateAppMessageShareData(payload);
        if (wx.updateTimelineShareData) {
          wx.updateTimelineShareData({ title: info.title, link: info.link, imgUrl: info.imgUrl });
        }
      });
      return true;
    } catch (e) {
      return false;
    }
  };

  Wechat.shareInfo = function (extraTitle) {
    var base = global.location.href.split('#')[0];
    return {
      title: extraTitle || '奇妙萌可消消乐',
      desc: '六只魔法萌宠三消闯关，快来挑战三星通关！',
      link: base,
      imgUrl: base.replace(/[^/]*$/, '') + 'assets/ui/share.png'
    };
  };

  MK.Wechat = Wechat;
})(window);

</script>
<script>
/* 界面层: 页面切换、HUD、弹层、道具栏 */
(function (global) {
  'use strict';

  var MK = global.MK;
  var LEVELS = MK.LEVELS;
  var CHARACTERS = MK.CHARACTERS;
  var Util = MK.Util;
  var Sound = MK.Sound;
  var Storage = MK.Storage;

  var doc = global.document;

  function el(id) { return doc.getElementById(id); }

  var UI = {
    game: null,
    current: 'loading',
    goalNodes: null,
    goalLevel: -1,
    toastTimer: null
  };

  // <img> 用的地址。当前形象是在线图时把画布转成 dataURL, 转换结果缓存起来复用。
  var srcCache = {};

  function spritePath(typeIndex) {
    var character = CHARACTERS[typeIndex];
    var local = MK.assetUrl('assets/characters/' + character.sprite + '.png');
    var sprite = MK.Assets.spriteById(character.id);
    if (!sprite) return local;
    if (sprite.tagName === 'IMG') return sprite.src || local;

    var key = MK.Assets.skin + '-' + character.id;
    if (!srcCache[key]) {
      try {
        srcCache[key] = sprite.toDataURL('image/png');
      } catch (e) {
        return local;
      }
    }
    return srcCache[key];
  }

  UI.forgetSpriteCache = function () { srcCache = {}; };

  /* ---------------- 页面切换 ---------------- */

  UI.show = function (name) {
    var screens = doc.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++) {
      screens[i].classList.toggle('is-active', screens[i].id === 'screen-' + name);
    }
    UI.current = name;
    if (name === 'game') UI.sizeBoard();
    if (name === 'levels') UI.renderLevels();
    if (name === 'home') UI.renderHomeProgress();
  };

  UI.sizeBoard = function () {
    var wrap = el('boardWrap');
    var canvas = el('board');
    if (!wrap || !canvas) return;
    var size = Math.floor(Math.min(wrap.clientWidth, wrap.clientHeight));
    if (size <= 0) return;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    if (UI.game) UI.game.resize();
  };

  /* ---------------- 提示条 ---------------- */

  UI.toast = function (message, duration) {
    var node = el('toast');
    node.textContent = message;
    node.classList.add('is-show');
    if (UI.toastTimer) global.clearTimeout(UI.toastTimer);
    UI.toastTimer = global.setTimeout(function () {
      node.classList.remove('is-show');
    }, duration || 1800);
  };

  /* ---------------- 弹层 ---------------- */

  UI.openCard = function (html) {
    el('overlayCard').innerHTML = html;
    el('overlay').classList.add('is-active');
  };

  UI.closeCard = function () {
    el('overlay').classList.remove('is-active');
    el('overlayCard').innerHTML = '';
  };

  UI.isCardOpen = function () {
    return el('overlay').classList.contains('is-active');
  };

  function actionButton(action, label, kind) {
    return '<button class="btn ' + (kind || '') + '" data-action="' + action + '">' + label + '</button>';
  }

  UI.openPause = function () {
    UI.openCard(
      '<h3>休息一下</h3>' +
      '<p class="card-sub">萌宠们在等你回来哦～</p>' +
      '<div class="card-actions">' +
      actionButton('resume', '继续游戏', 'btn-primary') +
      actionButton('restart', '重玩本关') +
      actionButton('home', '返回主页', 'btn-ghost') +
      '</div>'
    );
  };

  UI.openResult = function (info) {
    var def = LEVELS[info.level];
    var stars = '';
    for (var i = 0; i < 3; i++) {
      stars += i < info.stars ? '<i>★</i>' : '☆';
    }
    var isLast = info.level + 1 >= LEVELS.length;

    if (info.won) {
      UI.openCard(
        '<h3>魔法成功！</h3>' +
        '<div class="card-stars">' + stars + '</div>' +
        '<p class="card-sub">本关得分</p>' +
        '<div class="card-score">' + Util.formatNumber(info.score) + '</div>' +
        '<p class="card-sub">三星目标 ' + Util.formatNumber(Math.round(def.target * 1.5)) + '</p>' +
        '<div class="card-actions">' +
        (isLast ? '' : actionButton('next', '下一关', 'btn-primary')) +
        actionButton('restart', isLast ? '再玩一次' : '重玩本关', isLast ? 'btn-primary' : '') +
        actionButton('share', '分享给好友', 'btn-ghost') +
        actionButton('home', '返回主页', 'btn-ghost') +
        '</div>'
      );
    } else {
      UI.openCard(
        '<h3>步数用完啦</h3>' +
        '<p class="card-sub">再试一次一定可以的！</p>' +
        '<div class="card-score">' + Util.formatNumber(info.score) + '</div>' +
        '<div class="card-actions">' +
        actionButton('restart', '再试一次', 'btn-primary') +
        actionButton('home', '返回主页', 'btn-ghost') +
        '</div>'
      );
    }
  };

  UI.openHelp = function () {
    var legend = '';
    for (var i = 0; i < 3; i++) {
      legend += '<img src="' + spritePath(i) + '" alt="">';
    }
    UI.openCard(
      '<h3>玩法说明</h3>' +
      '<div class="card-help">' +
      '<div class="legend">' + legend + '<span>三只相同即可消除</span></div>' +
      '<h4>基本操作</h4>' +
      '<ul>' +
      '<li>滑动或点击相邻的两只萌宠交换位置</li>' +
      '<li>横向或纵向连成 3 只以上即可消除</li>' +
      '<li>消除后上方萌宠掉落，可能触发连锁加倍得分</li>' +
      '</ul>' +
      '<h4>魔法道具（消除时自动生成）</h4>' +
      '<ul>' +
      '<li><b>横向闪电</b>：四只横向连线生成，消除一整行</li>' +
      '<li><b>纵向闪电</b>：四只纵向连线生成，消除一整列</li>' +
      '<li><b>魔法炸弹</b>：拼出 L 形或 T 形生成，炸掉周围九格</li>' +
      '<li><b>彩虹魔杖</b>：五只连线生成，清除同种萌宠</li>' +
      '<li>两个魔法棋子互换会触发更大范围的合体技</li>' +
      '</ul>' +
      '<h4>通关条件</h4>' +
      '<ul>' +
      '<li>在限定步数内完成上方的收集目标即可通关</li>' +
      '<li>得分越高星级越高，最高三星</li>' +
      '<li>没有可消除组合时会自动洗牌</li>' +
      '</ul>' +
      '</div>' +
      '<div class="card-actions">' + actionButton('close', '知道啦', 'btn-primary') + '</div>'
    );
  };

  UI.openShare = function () {
    UI.openCard(
      '<h3>分享给好友</h3>' +
      '<p class="card-sub">点击微信右上角的「···」<br>选择「发送给朋友」或「分享到朋友圈」，<br>就能邀请好友一起来消萌宠啦！</p>' +
      '<div class="card-actions">' + actionButton('close', '好的', 'btn-primary') + '</div>'
    );
  };

  /* ---------------- 首页 ---------------- */

  UI.renderHomePets = function () {
    var html = '';
    for (var i = 0; i < CHARACTERS.length; i++) {
      html += '<img src="' + spritePath(i) + '" alt="' + MK.Assets.displayName(CHARACTERS[i]) + '">';
    }
    el('homePets').innerHTML = html;
  };

  UI.renderHomeProgress = function () {
    var progress = Storage.get('progress', {});
    var stars = 0;
    var cleared = 0;
    for (var key in progress) {
      if (Object.prototype.hasOwnProperty.call(progress, key)) {
        stars += progress[key].stars || 0;
        cleared++;
      }
    }
    el('homeProgress').textContent =
      '已通关 ' + cleared + '/' + LEVELS.length + ' 关　　收集 ★ ' + stars + '/' + LEVELS.length * 3;
  };

  UI.updateSoundChips = function () {
    el('btnSfx').classList.toggle('is-off', !Sound.sfxOn);
    el('btnBgm').classList.toggle('is-off', !Sound.bgmOn);
    el('btnSfx').textContent = Sound.sfxOn ? '音效 开' : '音效 关';
    el('btnBgm').textContent = Sound.bgmOn ? '音乐 开' : '音乐 关';
  };

  UI.updateSkinChip = function (loading) {
    var chip = el('btnSkin');
    if (!chip) return;
    chip.classList.toggle('is-busy', !!loading);
    if (loading) {
      chip.textContent = '形象 加载中';
      return;
    }
    var official = MK.Assets.skin === 'official';
    chip.classList.toggle('is-off', !official);
    chip.textContent = official ? '形象 官方' : '形象 原创';
  };

  /* ---------------- 关卡选择 ---------------- */

  UI.renderLevels = function () {
    var unlocked = Storage.get('unlocked', 0);
    var progress = Storage.get('progress', {});
    var size = MK.CHAPTER_SIZE;
    var html = '';

    for (var i = 0; i < LEVELS.length; i++) {
      if (i % size === 0) {
        var chapter = i / size;
        // 本章已拿到的星星, 让小孩知道哪一章还有的捡
        var got = 0;
        for (var n = i; n < i + size && n < LEVELS.length; n++) {
          got += (progress[n] || { stars: 0 }).stars;
        }
        html += '<div class="chapter-head' + (i > unlocked ? ' is-locked' : '') + '">' +
          '<b>第 ' + (chapter + 1) + ' 章 · ' + MK.CHAPTER_NAMES[chapter] + '</b>' +
          '<span>★ ' + got + '/' + size * 3 + '</span></div>';
      }

      var locked = i > unlocked;
      var record = progress[i] || { stars: 0, best: 0 };
      var stars = '';
      for (var s = 0; s < 3; s++) {
        stars += s < record.stars ? '<i>★</i>' : '★';
      }
      html += '<button class="level-card' + (locked ? ' is-locked' : '') +
        (i === unlocked ? ' is-current' : '') + '"' +
        (locked ? ' disabled' : ' data-level="' + i + '"') + '>' +
        '<b>' + (locked ? '🔒' : i + 1) + '</b>' +
        '<small>' + (locked ? '未解锁' : LEVELS[i].moves + ' 步') + '</small>' +
        '<div class="stars">' + stars + '</div>' +
        '</button>';
    }

    var grid = el('levelGrid');
    grid.innerHTML = html;

    // 100 关滚起来很长, 打开时直接停在该打的那一关上
    var current = grid.querySelector('.level-card.is-current');
    if (current) {
      grid.scrollTop = Math.max(0, current.offsetTop - grid.clientHeight / 2);
    }
  };

  /* ---------------- 游戏内 HUD ---------------- */

  UI.buildGoals = function (state) {
    var html = '';
    for (var i = 0; i < state.collected.length; i++) {
      var goal = state.collected[i];
      html += '<div class="goal" data-goal="' + i + '">' +
        '<img src="' + spritePath(goal.type) + '" alt="">' +
        '<span>0/' + goal.need + '</span></div>';
    }
    var container = el('hudGoals');
    container.innerHTML = html;
    UI.goalNodes = container.querySelectorAll('.goal');
    UI.goalLevel = state.level;
  };

  UI.renderHud = function (state) {
    el('hudLevel').textContent = state.level + 1;
    el('hudScore').textContent = Util.formatNumber(state.score);
    el('hudMoves').textContent = state.moves;
    el('hudMoves').parentNode.classList.toggle('is-low', state.moves <= 5);

    var threeStar = state.target * 1.5;
    var ratio = Util.clamp(state.score / threeStar, 0, 1);
    el('starFill').style.width = (ratio * 100) + '%';

    var thresholds = [state.target * 0.6, state.target, threeStar];
    var nodes = doc.querySelectorAll('.star-node');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].classList.toggle('is-on', state.score >= thresholds[i]);
    }

    if (UI.goalLevel !== state.level || !UI.goalNodes ||
        UI.goalNodes.length !== state.collected.length) {
      UI.buildGoals(state);
    }
    for (var g = 0; g < state.collected.length; g++) {
      var goal = state.collected[g];
      var node = UI.goalNodes[g];
      if (!node) continue;
      node.querySelector('span').textContent = goal.have + '/' + goal.need;
      node.classList.toggle('is-done', goal.have >= goal.need);
    }

    el('countHammer').textContent = state.props.hammer;
    el('countShuffle').textContent = state.props.shuffle;
    el('propHammer').classList.toggle('is-empty', state.props.hammer <= 0);
    el('propShuffle').classList.toggle('is-empty', state.props.shuffle <= 0);
  };

  UI.setPropMode = function (mode) {
    el('propHammer').classList.toggle('is-active', mode === 'hammer');
  };

  MK.UI = UI;
})(window);

</script>
<script>
/* 启动入口: 加载素材、装配 UI 与游戏、绑定交互 */
(function (global) {
  'use strict';

  var MK = global.MK;
  var UI = MK.UI;
  var Sound = MK.Sound;
  var Assets = MK.Assets;
  var Storage = MK.Storage;
  var LEVELS = MK.LEVELS;
  var Wechat = MK.Wechat;

  var doc = global.document;
  var game = null;

  function el(id) { return doc.getElementById(id); }

  /* ---------- 微信里禁止页面拖动/回弹, 但保留弹层与关卡列表的滚动 ---------- */
  function lockPageScroll() {
    doc.addEventListener('touchmove', function (e) {
      var node = e.target;
      while (node && node !== doc.body) {
        if (node.classList &&
            (node.classList.contains('scrollable') || node.classList.contains('card'))) {
          return;
        }
        node = node.parentNode;
      }
      if (e.cancelable) e.preventDefault();
    }, { passive: false });

    doc.addEventListener('gesturestart', function (e) {
      if (e.cancelable) e.preventDefault();
    });
    doc.addEventListener('contextmenu', function (e) {
      if (e.cancelable) e.preventDefault();
    });
  }

  /* ---------- 音频解锁: 微信/iOS 必须由用户手势触发 ---------- */
  function setupAudioUnlock() {
    var unlocked = false;
    function unlock() {
      if (unlocked) return;
      unlocked = true;
      Sound.unlock();
      doc.removeEventListener('touchend', unlock);
      doc.removeEventListener('mousedown', unlock);
    }
    doc.addEventListener('touchend', unlock, false);
    doc.addEventListener('mousedown', unlock, false);
    Wechat.onBridgeReady(function () { Sound.unlock(); });
  }

  /* ---------- 关卡进入 ---------- */
  function startLevel(index) {
    UI.closeCard();
    UI.show('game');
    game.start(index);
  }

  function nextLevel() {
    var next = game.levelIndex + 1;
    if (next >= LEVELS.length) {
      UI.show('home');
      UI.toast('全部关卡都通关啦，太厉害了！', 2400);
      return;
    }
    startLevel(next);
  }

  function continueLevel() {
    var unlocked = Storage.get('unlocked', 0);
    startLevel(Math.min(unlocked, LEVELS.length - 1));
  }

  /* ---------- 事件绑定 ---------- */
  function bindEvents() {
    el('btnPlay').addEventListener('click', function () {
      Sound.click();
      continueLevel();
    });
    el('btnLevels').addEventListener('click', function () {
      Sound.click();
      UI.show('levels');
    });
    el('btnHowTo').addEventListener('click', function () {
      Sound.click();
      UI.openHelp();
    });
    el('btnShare').addEventListener('click', function () {
      Sound.click();
      UI.openShare();
    });

    el('btnSfx').addEventListener('click', function () {
      Sound.setSfx(!Sound.sfxOn);
      UI.updateSoundChips();
      Sound.click();
    });
    el('btnBgm').addEventListener('click', function () {
      Sound.setBgm(!Sound.bgmOn);
      UI.updateSoundChips();
    });

    var skinBusy = false;
    el('btnSkin').addEventListener('click', function () {
      if (skinBusy) return;
      Sound.click();
      var next = Assets.skin === 'official' ? 'original' : 'official';
      skinBusy = true;
      UI.updateSkinChip(true);
      Assets.setSkin(next).then(function () {
        skinBusy = false;
        UI.forgetSpriteCache();
        UI.renderHomePets();
        UI.updateSkinChip(false);
        if (next === 'official') {
          UI.toast(Assets.remoteFailed.length ? '部分官方形象没下来，先用原创的' : '换成官方萌可啦');
        } else {
          UI.toast('换成原创萌宠啦');
        }
      });
    });

    var navButtons = doc.querySelectorAll('[data-nav]');
    for (var i = 0; i < navButtons.length; i++) {
      navButtons[i].addEventListener('click', function () {
        Sound.click();
        UI.show(this.getAttribute('data-nav'));
      });
    }

    el('levelGrid').addEventListener('click', function (e) {
      var node = e.target;
      while (node && node !== this && !node.getAttribute('data-level')) node = node.parentNode;
      if (!node || node === this) return;
      Sound.click();
      startLevel(parseInt(node.getAttribute('data-level'), 10));
    });

    el('btnPause').addEventListener('click', function () {
      Sound.click();
      game.pause();
      UI.openPause();
    });

    el('propHammer').addEventListener('click', function () {
      if (game.props.hammer <= 0) {
        UI.toast('魔法锤用完了～');
        return;
      }
      Sound.click();
      game.setPropMode('hammer');
      UI.toast(game.propMode ? '点一下想敲掉的萌宠' : '已取消魔法锤');
    });

    el('propShuffle').addEventListener('click', function () {
      if (game.props.shuffle <= 0) {
        UI.toast('洗牌次数用完了～');
        return;
      }
      Sound.click();
      game.useShuffle();
    });

    el('propHint').addEventListener('click', function () {
      Sound.click();
      game.showHint();
      if (!game.hint) UI.toast('现在没有可消除的组合哦');
    });

    // 弹层按钮统一走 data-action
    el('overlayCard').addEventListener('click', function (e) {
      var node = e.target;
      while (node && node !== this && !node.getAttribute('data-action')) node = node.parentNode;
      if (!node || node === this) return;

      var action = node.getAttribute('data-action');
      Sound.click();

      if (action === 'resume') {
        UI.closeCard();
        game.resume();
      } else if (action === 'restart') {
        startLevel(game.levelIndex);
      } else if (action === 'next') {
        nextLevel();
      } else if (action === 'home') {
        UI.closeCard();
        game.resume();
        UI.show('home');
      } else if (action === 'share') {
        UI.openShare();
      } else if (action === 'close') {
        UI.closeCard();
      }
    });

    var resizeTimer = null;
    function onResize() {
      if (resizeTimer) global.clearTimeout(resizeTimer);
      resizeTimer = global.setTimeout(function () {
        if (UI.current === 'game') UI.sizeBoard();
      }, 120);
    }
    global.addEventListener('resize', onResize);
    global.addEventListener('orientationchange', onResize);
  }

  /* ---------- 启动 ---------- */
  function boot() {
    lockPageScroll();
    setupAudioUnlock();

    var fill = el('loadingFill');
    var tip = el('loadingTip');

    // 先加载内置素材(占进度条前 60%), 再按设置补上在线形象(后 40%)。
    // 在线图失败也照样进游戏, 只是继续用内置形象。
    Assets.load(function (done, total) {
      fill.style.width = Math.round(done / total * 60) + '%';
    }).then(function () {
      if (Assets.skin === 'original') return;
      tip.textContent = '正在加载官方萌可形象…';
      return Assets.loadSkin(Assets.skin, function (done, total) {
        fill.style.width = Math.round(60 + done / total * 40) + '%';
      });
    }).then(function () {
      fill.style.width = '100%';
      if (Assets.images.background) doc.getElementById('app').classList.add('has-bg');
      if (Assets.missing.length) {
        tip.textContent = '部分素材缺失，已使用备用形象';
      } else if (Assets.skin !== 'original' && Assets.remoteFailed.length) {
        tip.textContent = '官方形象没下全，已用原创形象补上';
      }

      game = new MK.Game(el('board'));
      UI.game = game;

      game.on('hud', function (state) { UI.renderHud(state); });
      game.on('toast', function (message) { UI.toast(message); });
      game.on('propmode', function (mode) { UI.setPropMode(mode); });
      game.on('finish', function (info) {
        // 留一点时间让最后一次消除演完; 期间若已重开关卡就不再弹结算
        global.setTimeout(function () {
          if (info.gen !== game.gen) return;
          UI.openResult(info);
        }, 620);
      });

      UI.renderHomePets();
      UI.updateSoundChips();
      UI.updateSkinChip(false);
      bindEvents();
      Wechat.setupShare(Wechat.shareInfo());

      global.setTimeout(function () {
        UI.show('home');
      }, 260);

      global.__MK_GAME = game;
    });
  }

  if (doc.readyState === 'loading') {
    doc.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window);

</script>
</body>
</html>
