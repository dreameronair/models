<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>铁骑狂飙(单文件版)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#161a22">
<meta name="description" content="摩托格斗竞速：一边跑圈一边把对手打下车。纯网页，无需安装。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<!-- 微信/QQ 内置浏览器: 全屏、竖屏解锁、禁止 X5 自作主张缩放 -->
<meta name="x5-fullscreen" content="true">
<meta name="full-screen" content="yes">
<meta name="x5-orientation" content="landscape">
<meta name="screen-orientation" content="landscape">
<style>
/* 《铁骑狂飙》样式。横屏优先，同时兼顾竖屏和刘海屏安全区。 */

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  overflow: hidden;
  background: #11141b;
  color: #e9edf5;
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  /* 禁掉长按菜单和双击缩放，游戏里全是快速点按 */
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  overscroll-behavior: none;
}

#app {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right)
           env(safe-area-inset-bottom) env(safe-area-inset-left);
}

.screen.is-active { display: flex; }

/* ---------- 通用控件 ---------- */

.btn {
  display: block;
  width: 100%;
  padding: 14px 18px;
  margin-bottom: 10px;
  border: 0;
  border-radius: 12px;
  font: inherit;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #e9edf5;
  background: linear-gradient(180deg, #2c3240, #232833);
  box-shadow: 0 3px 0 #171b24;
  cursor: pointer;
}

.btn:active { transform: translateY(2px); box-shadow: none; }

.btn-primary {
  background: linear-gradient(180deg, #e8663a, #cf4a26);
  box-shadow: 0 3px 0 #8f3016;
  color: #fff;
}

.btn-ghost { background: rgba(255, 255, 255, 0.08); box-shadow: none; }

.btn[disabled] { opacity: 0.45; }

.icon-btn {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.1);
  color: #e9edf5;
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
}

.chips { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }

.chip {
  padding: 7px 14px;
  border: 0;
  border-radius: 999px;
  font: inherit;
  font-size: 13px;
  color: #cfd6e2;
  background: rgba(255, 255, 255, 0.1);
  cursor: pointer;
}

.chip.is-off { color: #7b8496; text-decoration: line-through; }

.scrollable { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }

/* ---------- 加载 / 主菜单 ---------- */

.logo {
  font-size: 44px;
  font-weight: 900;
  letter-spacing: 6px;
  text-align: center;
  color: #f2f5fa;
  text-shadow: 0 3px 0 #b8371a, 0 6px 18px rgba(0, 0, 0, 0.6);
}

.logo span { color: #f2a33c; }

.loading-box, .home-inner {
  margin: auto;
  width: min(420px, 82vw);
  text-align: center;
}

.bar {
  height: 8px;
  margin: 22px 0 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
}

.bar i { display: block; height: 100%; width: 0; background: #f2a33c; transition: width 0.2s; }

.tip { font-size: 13px; color: #97a1b3; }

.slogan { margin: 8px 0 22px; font-size: 14px; color: #9aa4b6; letter-spacing: 3px; }

.menu { margin-bottom: 14px; }

.wallet { font-size: 13px; color: #97a1b3; }
.wallet b { color: #f2a33c; }

/* ---------- 列表页 ---------- */

.page-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
}

.page-head h2 { flex: 1; font-size: 18px; letter-spacing: 3px; }

.head-cash { font-size: 13px; color: #97a1b3; }
.head-cash b { color: #f2a33c; }

.track-list, .bike-list { flex: 1; min-height: 0; padding: 0 14px 18px; }

.card {
  position: relative;
  display: flex;
  gap: 12px;
  align-items: center;
  width: 100%;
  padding: 14px;
  margin-bottom: 10px;
  border: 0;
  border-radius: 14px;
  font: inherit;
  text-align: left;
  color: #e9edf5;
  background: linear-gradient(180deg, #262c38, #1e232d);
  box-shadow: 0 3px 0 #161a22;
  cursor: pointer;
}

.card:active { transform: translateY(2px); box-shadow: none; }

.card.is-locked { opacity: 0.5; cursor: default; }
.card.is-owned { outline: 2px solid #f2a33c; }

.card-thumb {
  flex: 0 0 auto;
  width: 64px;
  height: 46px;
  border-radius: 8px;
  background: #11141b;
}

.card-body { flex: 1; min-width: 0; }
.card-title { font-size: 16px; font-weight: 700; }
.card-desc { margin-top: 3px; font-size: 12px; color: #97a1b3; line-height: 1.45; }
.card-meta { margin-top: 5px; font-size: 12px; color: #7f8a9c; }
.card-meta b { color: #f2a33c; }

.card-badge {
  flex: 0 0 auto;
  font-size: 12px;
  font-weight: 700;
  color: #f2a33c;
  text-align: right;
}

.stat-row { display: flex; gap: 10px; margin-top: 6px; }
.stat { flex: 1; font-size: 11px; color: #7f8a9c; }
.stat i { display: block; height: 4px; margin-top: 3px; border-radius: 2px; background: rgba(255,255,255,0.12); }
.stat i b { display: block; height: 100%; border-radius: 2px; background: #4fa3e0; }

/* ---------- 比赛 ---------- */

#screen-race { padding: 0; }

#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 14px 0;
  pointer-events: none;
}

.hud-left, .hud-right { display: flex; align-items: center; gap: 10px; }
.hud-right { margin-left: auto; }
.hud-mid { flex: 1; max-width: 46%; }

.hud-rank {
  padding: 4px 10px;
  border-radius: 10px;
  background: rgba(10, 13, 19, 0.6);
  font-weight: 900;
}
.hud-rank b { font-size: 24px; color: #f2a33c; }
.hud-rank small { font-size: 12px; color: #97a1b3; }

.hud-time, .hud-speed {
  padding: 5px 10px;
  border-radius: 10px;
  background: rgba(10, 13, 19, 0.6);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}
.hud-speed b { font-size: 22px; }
.hud-speed small { margin-left: 3px; font-size: 11px; color: #97a1b3; }

.progress, .health {
  height: 7px;
  margin-bottom: 5px;
  border-radius: 999px;
  background: rgba(10, 13, 19, 0.6);
  overflow: hidden;
}
.progress i { display: block; height: 100%; width: 0; background: #4fa3e0; }
.health i { display: block; height: 100%; width: 100%; background: #5cd16b; transition: width 0.15s; }
.health i.is-low { background: #e8c53a; }
.health i.is-crit { background: #e8503a; }

/* [hidden] 默认的 display:none 会被下面的 display 覆盖掉，得显式压回去 */
.weapon[hidden] { display: none; }

.weapon {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 8px;
  background: rgba(242, 163, 60, 0.9);
  color: #221a0c;
  font-size: 11px;
  font-weight: 700;
}

.hud .icon-btn { pointer-events: auto; background: rgba(10, 13, 19, 0.6); }

.center-msg {
  position: absolute;
  top: 38%;
  left: 0; right: 0;
  text-align: center;
  font-size: 52px;
  font-weight: 900;
  letter-spacing: 6px;
  color: #fff;
  text-shadow: 0 4px 0 #b8371a, 0 8px 24px rgba(0, 0, 0, 0.7);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
}

.center-msg.is-on { opacity: 1; }

/* ---------- 触屏操作 ---------- */

.touch {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 calc(14px + env(safe-area-inset-left))
           calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-right));
  pointer-events: none;
}

.pad-left, .pad-right { display: flex; gap: 10px; pointer-events: auto; }

.pad-btn {
  width: 62px;
  height: 62px;
  border: 0;
  border-radius: 50%;
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  color: #e9edf5;
  background: rgba(30, 36, 47, 0.72);
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.14);
  cursor: pointer;
}

.pad-btn.is-down { background: rgba(242, 163, 60, 0.85); color: #221a0c; }
.pad-hit { background: rgba(207, 74, 38, 0.72); }
.pad-kick { background: rgba(160, 60, 150, 0.72); }
.pad-brake { background: rgba(50, 60, 78, 0.72); font-size: 13px; }

/* 有真键盘的设备(能 hover)就不显示触屏按钮 */
@media (hover: hover) and (pointer: fine) {
  .touch { display: none; }
}

/* ---------- 弹层 ---------- */

.overlay {
  position: fixed;
  inset: 0;
  display: none;
  background: rgba(8, 10, 15, 0.78);
  z-index: 20;
}

.overlay.is-active { display: flex; }

.overlay-card {
  margin: auto;
  width: min(440px, 86vw);
  max-height: 86vh;
  overflow-y: auto;
  padding: 22px;
  border-radius: 16px;
  background: linear-gradient(180deg, #252b37, #1b2029);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
  text-align: center;
}

.overlay-card h3 { font-size: 24px; letter-spacing: 4px; margin-bottom: 6px; }
.overlay-card .sub { font-size: 13px; color: #97a1b3; margin-bottom: 14px; }

.result-rank { font-size: 46px; font-weight: 900; color: #f2a33c; margin: 6px 0; }

.result-rows { margin: 12px 0 16px; font-size: 14px; }
.result-rows div {
  display: flex;
  justify-content: space-between;
  padding: 7px 2px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
}
.result-rows span { color: #97a1b3; }
.result-rows b { font-variant-numeric: tabular-nums; }

.help-list { text-align: left; font-size: 14px; line-height: 1.9; color: #cfd6e2; }
.help-list b { color: #f2a33c; }
.help-list kbd {
  display: inline-block;
  min-width: 22px;
  padding: 1px 6px;
  border-radius: 5px;
  background: rgba(255, 255, 255, 0.14);
  font-family: inherit;
  font-size: 12px;
  text-align: center;
}

.standings { text-align: left; font-size: 13px; margin: 10px 0 16px; }
.standings div {
  display: flex;
  gap: 8px;
  padding: 5px 2px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.standings .pos { width: 28px; color: #f2a33c; font-weight: 700; }
.standings .who { flex: 1; }
.standings .dot { width: 10px; height: 10px; border-radius: 50%; align-self: center; }
.standings .me { color: #f2a33c; font-weight: 700; }

/* ---------- 提示条 ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: 18%;
  transform: translateX(-50%) translateY(10px);
  padding: 9px 18px;
  border-radius: 999px;
  background: rgba(10, 13, 19, 0.88);
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 30;
}

.toast.is-on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- 竖屏提醒 ---------- */

.rotate-hint {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: #11141b;
  font-size: 16px;
  color: #97a1b3;
  z-index: 40;
}

@media (orientation: portrait) and (max-width: 820px) {
  .rotate-hint.is-armed { display: flex; }
}

</style>
</head>
<body>

<div id="app">

  <!-- 加载 -->
  <section class="screen is-active" id="screen-loading">
    <div class="loading-box">
      <h1 class="logo">铁骑<span>狂飙</span></h1>
      <div class="bar"><i id="loadFill"></i></div>
      <p class="tip" id="loadTip">正在热车…</p>
    </div>
  </section>

  <!-- 主菜单 -->
  <section class="screen" id="screen-home">
    <div class="home-inner">
      <h1 class="logo">铁骑<span>狂飙</span></h1>
      <p class="slogan">油门到底，拳头说话</p>

      <div class="menu">
        <button class="btn btn-primary" id="btnRace">开始比赛</button>
        <button class="btn" id="btnGarage">车　　库</button>
        <button class="btn" id="btnHelp">操作说明</button>
      </div>

      <div class="wallet">现金 <b id="homeCash">0</b> ·
        已通过 <b id="homeDone">0</b>/<b id="homeTotal">5</b> 条赛道</div>

      <div class="chips">
        <button class="chip" id="btnSfx">音效</button>
        <button class="chip" id="btnEngine">引擎声</button>
      </div>
    </div>
  </section>

  <!-- 选赛道 -->
  <section class="screen" id="screen-tracks">
    <header class="page-head">
      <button class="icon-btn" data-nav="home">‹</button>
      <h2>选择赛道</h2>
      <span class="head-cash">现金 <b id="trackCash">0</b></span>
    </header>
    <div class="track-list scrollable" id="trackList"></div>
  </section>

  <!-- 车库 -->
  <section class="screen" id="screen-garage">
    <header class="page-head">
      <button class="icon-btn" data-nav="home">‹</button>
      <h2>车库</h2>
      <span class="head-cash">现金 <b id="garageCash">0</b></span>
    </header>
    <div class="bike-list scrollable" id="bikeList"></div>
  </section>

  <!-- 比赛 -->
  <section class="screen" id="screen-race">
    <canvas id="view"></canvas>

    <div class="hud">
      <div class="hud-left">
        <div class="hud-rank"><b id="hudRank">1</b><small id="hudRankTotal">/6</small></div>
        <div class="hud-time" id="hudTime">0:00.00</div>
      </div>

      <div class="hud-mid">
        <div class="progress"><i id="hudProgress"></i></div>
        <div class="health"><i id="hudHealth"></i></div>
        <div class="weapon" id="hudWeapon" hidden>钢管 ×<b id="hudWeaponN">0</b></div>
      </div>

      <div class="hud-right">
        <div class="hud-speed"><b id="hudSpeed">0</b><small>km/h</small></div>
        <button class="icon-btn" id="btnPause">‖</button>
      </div>
    </div>

    <div class="center-msg" id="centerMsg"></div>

    <!-- 触屏操作。桌面上用 CSS 藏起来 -->
    <div class="touch" id="touchPad">
      <div class="pad-left">
        <button class="pad-btn" data-act="left">◀</button>
        <button class="pad-btn" data-act="right">▶</button>
      </div>
      <div class="pad-right">
        <button class="pad-btn pad-brake" data-act="brake">刹车</button>
        <button class="pad-btn pad-hit" data-act="punchLeft">左拳</button>
        <button class="pad-btn pad-hit" data-act="punchRight">右拳</button>
        <button class="pad-btn pad-kick" data-act="kickRight">飞踢</button>
      </div>
    </div>
  </section>

</div>

<!-- 通用弹层 -->
<div class="overlay" id="overlay">
  <div class="overlay-card" id="overlayCard"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/*
 * 《铁骑狂飙》全局配置、数学工具与本地存档。
 *
 * 这是一款原创的摩托格斗竞速游戏: 一边跑圈一边把对手打下车。
 * 玩法类型参考经典街机摩托格斗游戏, 但赛道、车手、涂装、音效全部是
 * 本仓库自己生成的, 没有使用任何第三方美术或音频资源。
 */
(function (global) {
  'use strict';

  var CONFIG = {
    /* ---- 赛道几何 ---- */
    segmentLength: 200,      // 一段赛道的世界长度
    rumbleLength: 3,         // 几段拼成一条路肩条纹
    roadWidth: 2000,         // 路面半宽
    lanes: 3,
    drawDistance: 300,       // 往前画多少段
    fieldOfView: 100,        // 视角(度)
    cameraHeight: 1000,
    fogDensity: 4,

    /* ---- 车辆性能 ---- */
    maxSpeed: 12000,         // 世界单位/秒
    accel: 3800,
    braking: -11000,
    decel: -1700,            // 松油门自然减速
    offRoadDecel: -3600,
    offRoadLimit: 4200,      // 草地上的极速
    // 离心力与转向力必须是可比的: 转向每帧给 dx, 离心力给 dx*pct*curve*centrifugal,
    // 两者之比就是 pct*curve*centrifugal。配上下面的 maxCurve(6.5), 满速过最急的
    // 弯时比值是 0.975 —— 方向打满刚好压得住(留了点余量), 松一点油门就轻松,
    // 这才叫「难」。比值一旦过 1, 长弯里再怎么打方向都会被慢慢推出赛道。
    // 之前 centrifugal 是 0.32, 比值 2.6, 等于无论如何都会被甩出赛道。
    centrifugal: 0.15,       // 过弯被甩出去的力度
    steerSpeed: 2.6,         // 每秒能横移几个路宽
    maxCurve: 6.5,           // 单段弯道的上限, 再急就不讲道理了

    /* ---- 战斗 ---- */
    reach: 520,              // 出手够得着的纵向距离
    reachLateral: 0.42,      // 够得着的横向距离(路宽的比例)
    punchDamage: 12,
    kickDamage: 19,
    punchCooldown: 0.34,
    kickCooldown: 0.62,
    weaponBonus: 14,         // 捡到钢管后的额外伤害
    weaponUses: 12,
    maxHealth: 100,
    hitShove: 0.16,          // 挨打时被推开多少
    knockdownTime: 2.6,      // 摔车后爬起来要多久

    /* ---- 其它 ---- */
    trafficSpeed: 3200,
    rivalCount: 5
  };

  // 十二位对手车手。名字、涂装、脾气都是原创的。
  // aggression 越高越爱动手, skill 越高跑得越快, bulk 越高越抗揍。
  var RIDERS = [
    { name: '铁猴子', color: '#e8503a', skill: 0.72, aggression: 0.55, bulk: 0.9 },
    { name: '夜猫子', color: '#3aa0e8', skill: 0.76, aggression: 0.40, bulk: 0.8 },
    { name: '大扳手', color: '#f0a92b', skill: 0.70, aggression: 0.80, bulk: 1.3 },
    { name: '闪电婆', color: '#c86ae8', skill: 0.84, aggression: 0.45, bulk: 0.7 },
    { name: '老烟枪', color: '#7d8a99', skill: 0.66, aggression: 0.70, bulk: 1.2 },
    { name: '花衬衫', color: '#2fc08a', skill: 0.74, aggression: 0.50, bulk: 0.9 },
    { name: '钉子户', color: '#b5502f', skill: 0.80, aggression: 0.85, bulk: 1.4 },
    { name: '小旋风', color: '#e8d84a', skill: 0.88, aggression: 0.35, bulk: 0.6 },
    { name: '黑手套', color: '#5a5f75', skill: 0.82, aggression: 0.75, bulk: 1.1 },
    { name: '断头台', color: '#d4374f', skill: 0.86, aggression: 0.90, bulk: 1.5 },
    { name: '风筝哥', color: '#49c7d6', skill: 0.90, aggression: 0.55, bulk: 0.8 },
    { name: '疯婆子', color: '#ef7fb0', skill: 0.92, aggression: 0.95, bulk: 1.0 }
  ];

  /*
   * 五条赛道。seed 决定路形(同一个 seed 永远生成同一条路, 方便复现和测试),
   * length 是段数, reward 是冠军奖金。
   *
   * rivalSkill 是这条赛道的整体节奏, 直接乘在对手极速上。数值不是拍脑袋,
   * 是照着「这条赛道预期骑哪台车」反推的 —— 前两条用起步车, 中间两条换
   * 重机车, 最后一条上刀锋, 让对手速度相对当前座驾逐条走高。第三条跳一下
   * 是因为刚换车, 正好让买车立刻有获得感。跑 npm run balance 复核。
   * rivalRage 是他们多爱动手。
   */
  var TRACKS = [
    {
      id: 'coast', name: '海岸公路', scene: 'coast',
      seed: 10704, length: 2600, laps: 1,
      curviness: 0.6, hilliness: 0.5, traffic: 0.35,
      rivalSkill: 0.90, rivalRage: 0.5, reward: 1000,
      desc: '路宽弯缓，适合先摸清油门和拳头。'
    },
    {
      id: 'desert', name: '戈壁国道', scene: 'desert',
      seed: 31337, length: 3200, laps: 1,
      curviness: 0.85, hilliness: 1.0, traffic: 0.5,
      rivalSkill: 0.96, rivalRage: 0.65, reward: 1600,
      desc: '起伏大，冲坡时看不见前面有没有车。'
    },
    {
      id: 'forest', name: '盘山林道', scene: 'forest',
      seed: 52011, length: 3600, laps: 1,
      curviness: 1.35, hilliness: 0.8, traffic: 0.55,
      rivalSkill: 1.12, rivalRage: 0.75, reward: 2400,
      desc: '连续急弯，甩出去就是一头栽进树里。'
    },
    {
      id: 'city', name: '午夜城区', scene: 'city',
      seed: 74203, length: 4000, laps: 1,
      curviness: 1.0, hilliness: 0.45, traffic: 0.95,
      rivalSkill: 1.12, rivalRage: 0.85, reward: 3400,
      desc: '车流密得像下饺子，对手还专挑这种地方动手。'
    },
    {
      id: 'storm', name: '暴雨山口', scene: 'storm',
      seed: 90617, length: 4600, laps: 1,
      curviness: 1.5, hilliness: 1.2, traffic: 0.7,
      rivalSkill: 1.52, rivalRage: 1.0, reward: 5000,
      desc: '又湿又滑又黑，最后一条路，谁都不让谁。'
    }
  ];

  /*
   * 三台可买的车。加速、极速、抗揍各有取舍, 不存在全面碾压的一台。
   */
  var BIKES = [
    {
      id: 'scrap', name: '拼装车', price: 0, color: '#8b8f98',
      topSpeed: 0.86, accel: 1.0, grip: 1.0, armor: 1.0,
      desc: '东拼西凑的起步车，胜在轻快好拐。'
    },
    {
      id: 'cruiser', name: '重机车', price: 2600, color: '#2f6fd0',
      topSpeed: 1.0, accel: 0.88, grip: 0.92, armor: 1.35,
      desc: '又沉又快，撞人吃亏的是对方。'
    },
    {
      id: 'blade', name: '刀锋', price: 5800, color: '#d63a52',
      topSpeed: 1.12, accel: 1.18, grip: 1.1, armor: 0.85,
      desc: '快得离谱，但摔一下就够你喝一壶。'
    }
  ];

  /* ------------------------------------------------------------------ *
   * 数学与随机
   * ------------------------------------------------------------------ */

  var Util = {
    clamp: function (v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); },

    lerp: function (a, b, t) { return a + (b - a) * t; },

    // 缓入缓出, 用来做弯道和坡道的过渡段
    easeIn: function (a, b, p) { return a + (b - a) * Math.pow(p, 2); },
    easeOut: function (a, b, p) { return a + (b - a) * (1 - Math.pow(1 - p, 2)); },
    easeInOut: function (a, b, p) {
      return a + (b - a) * (-Math.cos(p * Math.PI) / 2 + 0.5);
    },

    // 把百分比映射到区间, 常用于「速度越快抖得越厉害」这类
    interpolate: function (lo, hi, p) { return lo + (hi - lo) * p; },

    percent: function (v, max) { return max ? v / max : 0; },

    formatTime: function (seconds) {
      if (!isFinite(seconds) || seconds < 0) seconds = 0;
      var m = Math.floor(seconds / 60);
      var s = Math.floor(seconds % 60);
      var cs = Math.floor((seconds * 100) % 100);
      return m + ':' + (s < 10 ? '0' : '') + s + '.' + (cs < 10 ? '0' : '') + cs;
    },

    ordinal: function (n) { return ['第一', '第二', '第三', '第四', '第五', '第六',
      '第七', '第八', '第九', '第十'][n - 1] || ('第' + n); }
  };

  /*
   * 可复现的伪随机数(mulberry32)。赛道、路边景物、交通车全都走这个,
   * 所以同一条赛道每次生成的路形完全一样 —— 玩家能背路, 测试也能断言。
   */
  function Rng(seed) {
    this.state = (seed >>> 0) || 1;
  }

  Rng.prototype.next = function () {
    this.state = (this.state + 0x6D2B79F5) >>> 0;
    var t = Math.imul(this.state ^ (this.state >>> 15), 1 | this.state);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  Rng.prototype.range = function (lo, hi) { return lo + this.next() * (hi - lo); };

  Rng.prototype.int = function (lo, hi) { return Math.floor(this.range(lo, hi + 1)); };

  Rng.prototype.pick = function (arr) { return arr[this.int(0, arr.length - 1)]; };

  Rng.prototype.chance = function (p) { return this.next() < p; };

  /* ------------------------------------------------------------------ *
   * 存档
   * ------------------------------------------------------------------ */

  var Storage = {
    key: 'moto-brawl-v1',

    read: function () {
      try {
        var raw = global.localStorage.getItem(Storage.key);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    },

    write: function (data) {
      try {
        global.localStorage.setItem(Storage.key, JSON.stringify(data));
      } catch (e) { /* 无痕模式下忽略 */ }
    },

    get: function (name, fallback) {
      var data = Storage.read();
      return Object.prototype.hasOwnProperty.call(data, name) ? data[name] : fallback;
    },

    set: function (name, value) {
      var data = Storage.read();
      data[name] = value;
      Storage.write(data);
    }
  };

  global.MB = {
    CONFIG: CONFIG,
    RIDERS: RIDERS,
    TRACKS: TRACKS,
    BIKES: BIKES,
    Util: Util,
    Rng: Rng,
    Storage: Storage
  };
})(typeof window !== 'undefined' ? window : this);

<script>
/*
 * 赛道: 分段生成 + 伪 3D 投影。
 *
 * 赛道被切成一段段等长的路面(segment), 每段记录自己的世界坐标、弯曲度、
 * 路肩颜色和挂在上面的景物。渲染时把每段的两个端点投影到屏幕, 画成一个
 * 梯形, 从远往近盖过去 —— 这样上坡时远处的路自然会被近处的挡住。
 *
 * 本文件是纯逻辑, 不碰 DOM 和 Canvas, 可以直接在 Node 里跑测试。
 */
(function (global) {
  'use strict';

  var MB = global.MB;
  var CONFIG = MB.CONFIG;
  var Util = MB.Util;
  var Rng = MB.Rng;

  /* 弯道与坡道的强度档位 */
  var CURVE = { none: 0, easy: 2, medium: 4, hard: 6 };
  var HILL = { none: 0, low: 20, medium: 40, high: 60 };
  var LEN = { short: 25, medium: 50, long: 100 };

  function Track(def) {
    this.def = def;
    this.segments = [];
    this.props = [];       // 路边景物, 挂在 segment 上
    this.build();
  }

  Track.prototype.segmentCount = function () { return this.segments.length; };

  Track.prototype.totalLength = function () {
    return this.segments.length * CONFIG.segmentLength;
  };

  /** 取某个世界 z 所在的那一段。z 会自动绕回起点, 支持多圈。 */
  Track.prototype.segmentAt = function (z) {
    var total = this.totalLength();
    var wrapped = ((z % total) + total) % total;
    var index = Math.floor(wrapped / CONFIG.segmentLength) % this.segments.length;
    return this.segments[index];
  };

  Track.prototype.lastY = function () {
    return this.segments.length ? this.segments[this.segments.length - 1].p2.world.y : 0;
  };

  /**
   * 铺一段路。enter/hold/leave 是进弯、持弯、出弯的段数,
   * curve 是弯曲度(正右负左), y 是这一段结束时的高度。
   */
  Track.prototype.addRoad = function (enter, hold, leave, curve, y) {
    var startY = this.lastY();
    var endY = startY + y;
    var total = enter + hold + leave;
    var i;

    for (i = 0; i < enter; i++) {
      this.addSegment(Util.easeIn(0, curve, i / enter),
        Util.easeInOut(startY, endY, i / total));
    }
    for (i = 0; i < hold; i++) {
      this.addSegment(curve, Util.easeInOut(startY, endY, (enter + i) / total));
    }
    for (i = 0; i < leave; i++) {
      this.addSegment(Util.easeInOut(curve, 0, i / leave),
        Util.easeInOut(startY, endY, (enter + hold + i) / total));
    }
  };

  Track.prototype.addSegment = function (curve, y) {
    var n = this.segments.length;
    this.segments.push({
      index: n,
      p1: { world: { x: 0, y: this.lastY(), z: n * CONFIG.segmentLength },
            camera: {}, screen: {} },
      p2: { world: { x: 0, y: y, z: (n + 1) * CONFIG.segmentLength },
            camera: {}, screen: {} },
      curve: curve,
      // 每 rumbleLength 段换一次深浅, 跑起来才有速度感
      dark: Math.floor(n / CONFIG.rumbleLength) % 2 === 1,
      props: [],
      cars: [],
      // 起点/终点线
      marker: 0,
      clip: 0
    });
  };

  /** 按赛道定义随机铺出整条路。同一个 seed 结果完全一致。 */
  Track.prototype.build = function () {
    var def = this.def;
    var rng = new Rng(def.seed);
    this.segments = [];

    // 开头留一段直路, 让玩家有时间起步
    this.addRoad(LEN.short, LEN.short, LEN.short, 0, 0);

    var curviness = def.curviness === undefined ? 1 : def.curviness;
    var hilliness = def.hilliness === undefined ? 1 : def.hilliness;

    while (this.segments.length < def.length) {
      var roll = rng.next();
      var enter = rng.pick([LEN.short, LEN.medium, LEN.long]);
      var hold = rng.pick([LEN.short, LEN.medium]);
      var leave = rng.pick([LEN.short, LEN.medium]);
      var curve = 0;
      var hill = 0;

      if (roll < 0.28) {
        // 直路
      } else if (roll < 0.72) {
        curve = rng.pick([CURVE.easy, CURVE.medium, CURVE.hard]) * curviness;
        if (rng.chance(0.5)) curve = -curve;
      } else {
        curve = rng.pick([CURVE.easy, CURVE.medium]) * curviness;
        if (rng.chance(0.5)) curve = -curve;
      }
      // 夹住弯道上限。curviness 大于 1 的赛道原本会造出转向根本压不住的弯,
      // 那不是难度, 是必然被甩出赛道。夹完之后 curviness 的作用变成
      // 「急弯更密」而不是「急弯更离谱」。
      curve = Util.clamp(curve, -CONFIG.maxCurve, CONFIG.maxCurve);

      if (rng.chance(0.55)) {
        hill = rng.pick([HILL.low, HILL.medium, HILL.high]) * hilliness;
        if (rng.chance(0.5)) hill = -hill;
      }

      this.addRoad(enter, hold, leave, curve, hill);
    }

    // 结尾拉平, 免得冲线时镜头在半空
    this.addRoad(LEN.medium, LEN.medium, LEN.medium, 0, -this.lastY());

    this.markLines();
    this.scatterProps(rng);
  };

  /** 起点线和终点线。marker: 1 起点, 2 终点。 */
  Track.prototype.markLines = function () {
    var i;
    for (i = 0; i < 4 && i < this.segments.length; i++) {
      this.segments[i].marker = 1;
    }
    for (i = this.segments.length - 6; i < this.segments.length; i++) {
      if (i >= 0) this.segments[i].marker = 2;
    }
  };

  /**
   * 撒路边景物。offset 是横向位置(1 就是路边缘, 大于 1 在路外),
   * kind 交给渲染层去画成树、路灯、仙人掌还是楼。
   */
  Track.prototype.scatterProps = function (rng) {
    var kinds = SCENE_PROPS[this.def.scene] || SCENE_PROPS.coast;
    var n = this.segments.length;

    for (var i = 20; i < n - 20; i++) {
      var seg = this.segments[i];
      // 疏密交替, 全程等间距会很假
      if (!rng.chance(0.16)) continue;

      var side = rng.chance(0.5) ? -1 : 1;
      var offset = side * rng.range(1.25, 3.4);
      seg.props.push({
        kind: rng.pick(kinds),
        offset: offset,
        scale: rng.range(0.8, 1.45)
      });
    }

    // 弯道外侧立几块提示牌, 提前告诉玩家往哪拐。
    // 间隔要够大: 每 5 段一块的话, 一个长弯会立出几十块, 缩到近处就是
    // 一堵黄牌墙, 把路都糊住了。
    for (i = 20; i < n - 20; i++) {
      var s = this.segments[i];
      if (Math.abs(s.curve) < 2.5) continue;
      if (i % 24 !== 0) continue;
      s.props.push({
        kind: 'sign',
        offset: s.curve > 0 ? -1.35 : 1.35,
        scale: 0.7,
        dir: s.curve > 0 ? 1 : -1
      });
    }
  };

  var SCENE_PROPS = {
    coast: ['palm', 'palm', 'rock', 'lamp'],
    desert: ['cactus', 'cactus', 'rock', 'rock'],
    forest: ['pine', 'pine', 'pine', 'bush'],
    city: ['building', 'building', 'lamp', 'lamp'],
    storm: ['pine', 'rock', 'lamp', 'bush']
  };

  /* ------------------------------------------------------------------ *
   * 投影
   * ------------------------------------------------------------------ */

  /**
   * 把一个世界坐标点投到屏幕。
   * cameraDepth 由视角算出, 越大看着越"长焦"。
   */
  function project(p, cameraX, cameraY, cameraZ, cameraDepth, width, height, roadWidth) {
    p.camera.x = (p.world.x || 0) - cameraX;
    p.camera.y = (p.world.y || 0) - cameraY;
    p.camera.z = (p.world.z || 0) - cameraZ;
    // z 落到相机后面时投影会翻转, 夹一个很小的正数挡住
    var cz = p.camera.z <= 0.1 ? 0.1 : p.camera.z;
    p.screen.scale = cameraDepth / cz;
    p.screen.x = Math.round((width / 2) + (p.screen.scale * p.camera.x * width / 2));
    p.screen.y = Math.round((height / 2) - (p.screen.scale * p.camera.y * height / 2));
    p.screen.w = Math.round(p.screen.scale * roadWidth * width / 2);
    return p;
  }

  function cameraDepthFor(fieldOfView) {
    return 1 / Math.tan((fieldOfView / 2) * Math.PI / 180);
  }

  MB.Track = Track;
  MB.project = project;
  MB.cameraDepthFor = cameraDepthFor;
  MB.CURVE = CURVE;
  MB.HILL = HILL;
  MB.SEG_LEN = LEN;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/*
 * 一场比赛的完整模拟: 骑手物理、近身格斗、对手 AI、交通车辆、名次。
 *
 * 这里只有数字, 不碰 Canvas 也不碰 DOM —— 渲染层每帧读这里的状态去画。
 * 好处是整场比赛能在 Node 里无头跑完, 用来做回归测试和难度配平。
 */
(function (global) {
  'use strict';

  var MB = global.MB;
  var CONFIG = MB.CONFIG;
  var Util = MB.Util;
  var Rng = MB.Rng;

  /* ------------------------------------------------------------------ *
   * 骑手
   * ------------------------------------------------------------------ */

  function Rider(opts) {
    this.id = opts.id;
    this.name = opts.name;
    this.color = opts.color;
    this.isPlayer = !!opts.isPlayer;

    // 车辆性能系数
    this.topSpeed = opts.topSpeed || 1;
    this.accel = opts.accel || 1;
    this.grip = opts.grip || 1;
    this.armor = opts.armor || 1;

    // AI 性格
    this.skill = opts.skill || 0.8;
    this.aggression = opts.aggression || 0.5;

    this.z = opts.z || 0;          // 沿赛道走过的世界距离(不绕回)
    this.x = opts.x || 0;          // 横向, ±1 是路边缘
    this.speed = 0;
    this.health = CONFIG.maxHealth;
    this.weapon = 0;

    this.state = 'ride';           // ride | hit | down
    this.stateTime = 0;
    this.lean = 0;                 // 视觉倾斜, 渲染用
    this.attackCd = 0;
    this.attack = null;            // { side, kind, t } 出手动画
    this.flash = 0;                // 挨打时的闪白
    this.grazeCd = 0;              // 蹭车的冷却, 免得贴着一辆车连扣好几次
    this.swingCd = 0;              // AI 两次寻衅之间的间隔

    this.finished = false;
    this.finishTime = 0;
    this.rank = 0;
    this.knockdowns = 0;           // 被打趴下几次
    this.takedowns = 0;            // 打趴下几个人
  }

  Rider.prototype.maxSpeed = function () {
    return CONFIG.maxSpeed * this.topSpeed;
  };

  Rider.prototype.speedPercent = function () {
    return Util.clamp(this.speed / this.maxSpeed(), 0, 1);
  };

  Rider.prototype.isDown = function () { return this.state === 'down'; };

  /** 挨一下。伤害按护甲打折, 同时被横向推开。 */
  Rider.prototype.takeHit = function (damage, fromSide) {
    if (this.isDown()) return false;
    this.health -= damage / this.armor;
    this.flash = 0.18;
    this.x += (fromSide > 0 ? -1 : 1) * CONFIG.hitShove;
    this.speed *= 0.93;

    if (this.health <= 0) {
      this.health = 0;
      this.knockDown();
      return true;
    }
    this.state = 'hit';
    this.stateTime = 0.22;
    return false;
  };

  /** 摔车。躺一会儿, 爬起来血回一半, 速度从零开始。 */
  Rider.prototype.knockDown = function () {
    this.state = 'down';
    this.stateTime = CONFIG.knockdownTime;
    this.speed = 0;
    this.knockdowns++;
    this.attack = null;
  };

  Rider.prototype.getUp = function () {
    this.state = 'ride';
    this.stateTime = 0;
    this.health = CONFIG.maxHealth * 0.55;
    this.x = Util.clamp(this.x, -0.7, 0.7);
  };

  /* ------------------------------------------------------------------ *
   * 比赛
   * ------------------------------------------------------------------ */

  /**
   * options: { track, bike, riders: [车手定义], seed, rivalSkill, rivalRage }
   */
  function Race(options) {
    this.track = options.track;
    this.rng = new Rng(options.seed || 12345);
    this.time = 0;
    this.countdown = options.countdown === undefined ? 3.2 : options.countdown;
    this.state = this.countdown > 0 ? 'countdown' : 'racing';
    this.finishZ = this.track.totalLength() * (this.track.def.laps || 1);
    this.events = [];              // 本帧发生的事, 渲染/音效层来消费

    var bike = options.bike;
    this.player = new Rider({
      id: 'player', name: options.playerName || '你', color: bike.color,
      isPlayer: true,
      topSpeed: bike.topSpeed, accel: bike.accel, grip: bike.grip, armor: bike.armor,
      z: 0, x: 0
    });

    this.riders = [this.player];
    var defs = options.riders || [];
    for (var i = 0; i < defs.length; i++) {
      var d = defs[i];
      // 对手极速 = 车手底子 x 本赛道的整体节奏。
      // 节奏值(track.rivalSkill)是照着三台车的极速定的: 第一条赛道略低于
      // 起步车, 最后一条要骑上最快的车才追得上 —— 换车才有意义。
      // 对手起步位置错开, 免得开局就叠在一起
      this.riders.push(new Rider({
        id: 'ai' + i, name: d.name, color: d.color,
        topSpeed: (0.74 + d.skill * 0.20) * (options.rivalSkill || 1),
        accel: 0.9 + d.skill * 0.2,
        grip: 1, armor: d.bulk,
        skill: d.skill * (options.rivalSkill || 1),
        aggression: d.aggression * (options.rivalRage || 1),
        z: this.rng.range(-600, 900),
        x: this.rng.range(-0.62, 0.62)
      }));
    }

    // 不能写 `|| 0.4`: 密度 0 是假值, 会被默认值顶掉, 想关车流反而关不掉
    this.traffic = this.spawnTraffic(
      options.trafficDensity === undefined ? 0.4 : options.trafficDensity);
    this.pickups = this.spawnPickups();
    this.updateRanks();
  }

  /** 交通车辆。沿路撒一批, 匀速往前开, 撞上就是一跤。 */
  Race.prototype.spawnTraffic = function (density) {
    var cars = [];
    // 密度 0 就是真的一辆车都没有。以前这里只是把车距拉到最大, 结果
    // 想关掉车流的调用方(比如物理测试)照样会撞车。
    if (!(density > 0)) return cars;
    var total = this.track.totalLength();
    // 极速下一秒要跑一万多个单位, 车距太小就成了「必撞」而不是「要躲」。
    // 最密的城区也留出约半秒反应时间。
    var gap = Util.interpolate(16000, 6000, Util.clamp(density, 0, 1));
    for (var z = 4000; z < total - 4000; z += gap * this.rng.range(0.6, 1.5)) {
      cars.push({
        z: z,
        x: this.rng.range(-0.72, 0.72),
        speed: CONFIG.trafficSpeed * this.rng.range(0.6, 1.25),
        kind: this.rng.int(0, 3),
        alive: true
      });
    }
    return cars;
  };

  /** 路边的钢管。捡到之后几下攻击伤害更高。 */
  Race.prototype.spawnPickups = function () {
    var items = [];
    var total = this.track.totalLength();
    for (var z = 12000; z < total - 8000; z += this.rng.range(16000, 30000)) {
      items.push({ z: z, x: this.rng.range(-0.85, 0.85), taken: false });
    }
    return items;
  };

  /* ---------------- 主循环 ---------------- */

  /**
   * input: { throttle, brake, steer(-1~1), punchLeft, punchRight, kickLeft, kickRight }
   * dt 建议夹在 1/30 以内, 否则高速下会穿过交通车。
   */
  Race.prototype.update = function (dt, input) {
    this.events.length = 0;

    if (this.state === 'countdown') {
      this.countdown -= dt;
      if (this.countdown <= 0) {
        this.state = 'racing';
        this.events.push({ type: 'go' });
      }
      // 读秒期间不能动, 但要允许轰油门(纯表现)
      return;
    }

    if (this.state === 'finished') return;

    this.time += dt;

    this.updateTraffic(dt);
    this.updatePlayer(dt, input || {});

    for (var i = 1; i < this.riders.length; i++) {
      this.updateAi(this.riders[i], dt);
    }

    for (i = 0; i < this.riders.length; i++) {
      this.resolveCollisions(this.riders[i], dt);
      this.checkFinish(this.riders[i]);
    }

    this.updateRanks();

    if (this.player.finished) {
      this.state = 'finished';
      this.events.push({ type: 'finish', rank: this.player.rank });
    }
  };

  Race.prototype.updateTraffic = function (dt) {
    var total = this.track.totalLength();
    for (var i = 0; i < this.traffic.length; i++) {
      var car = this.traffic[i];
      car.z += car.speed * dt;
      // 开出赛道尾部就绕回开头, 保证全程都有车
      if (car.z > total) car.z -= total;
    }
  };

  /** 公共的运动学: 油门/刹车/转向/离心力/离地减速。 */
  Race.prototype.driveRider = function (rider, dt, throttle, brake, steer) {
    if (rider.isDown()) {
      rider.stateTime -= dt;
      rider.speed = Math.max(0, rider.speed - 9000 * dt);
      rider.z += rider.speed * dt;
      if (rider.stateTime <= 0) rider.getUp();
      return;
    }

    if (rider.state === 'hit') {
      rider.stateTime -= dt;
      if (rider.stateTime <= 0) rider.state = 'ride';
    }

    var max = rider.maxSpeed();
    if (brake) {
      rider.speed += CONFIG.braking * dt;
    } else if (throttle) {
      rider.speed += CONFIG.accel * rider.accel * dt;
    } else {
      rider.speed += CONFIG.decel * dt;
    }

    var offRoad = Math.abs(rider.x) > 1;
    if (offRoad) {
      rider.speed += CONFIG.offRoadDecel * dt;
      if (rider.speed > CONFIG.offRoadLimit) rider.speed = CONFIG.offRoadLimit;
    }

    rider.speed = Util.clamp(rider.speed, 0, max);

    var pct = rider.speedPercent();
    var dx = dt * CONFIG.steerSpeed * pct;
    if (steer) rider.x += steer * dx * rider.grip;

    // 过弯被甩向外侧, 速度越快甩得越狠
    var seg = this.track.segmentAt(rider.z);
    rider.x -= dx * pct * seg.curve * CONFIG.centrifugal;

    // 冲出路肩也不让他飞太远, 免得镜头里彻底找不着人
    rider.x = Util.clamp(rider.x, -2.2, 2.2);
    rider.z += rider.speed * dt;

    // 视觉倾斜: 转向 + 弯道
    var wantLean = Util.clamp((steer || 0) * 0.7 + seg.curve * 0.12 * pct, -1, 1);
    rider.lean += (wantLean - rider.lean) * Math.min(1, dt * 8);

    if (rider.flash > 0) rider.flash -= dt;
    if (rider.grazeCd > 0) rider.grazeCd -= dt;
    if (rider.swingCd > 0) rider.swingCd -= dt;
    if (rider.attackCd > 0) rider.attackCd -= dt;
    if (rider.attack) {
      rider.attack.t += dt;
      if (rider.attack.t > 0.26) rider.attack = null;
    }
  };

  Race.prototype.updatePlayer = function (dt, input) {
    var p = this.player;
    if (p.finished) return;

    this.driveRider(p, dt, input.throttle, input.brake, input.steer || 0);

    if (p.isDown()) return;

    if (input.punchLeft) this.tryAttack(p, -1, 'punch');
    if (input.punchRight) this.tryAttack(p, 1, 'punch');
    if (input.kickLeft) this.tryAttack(p, -1, 'kick');
    if (input.kickRight) this.tryAttack(p, 1, 'kick');

    this.checkPickups(p);
  };

  Race.prototype.checkPickups = function (rider) {
    for (var i = 0; i < this.pickups.length; i++) {
      var item = this.pickups[i];
      if (item.taken) continue;
      if (Math.abs(item.z - rider.z) < 400 && Math.abs(item.x - rider.x) < 0.3) {
        item.taken = true;
        rider.weapon = CONFIG.weaponUses;
        this.events.push({ type: 'pickup', rider: rider });
      }
    }
  };

  /* ---------------- 格斗 ---------------- */

  /**
   * 朝某一侧出手。够得着才算数, 空挥也要吃冷却 —— 不然可以无脑狂按。
   * side: -1 左, 1 右。kind: 'punch' | 'kick'。
   */
  Race.prototype.tryAttack = function (rider, side, kind) {
    if (rider.attackCd > 0 || rider.isDown()) return null;

    var cd = kind === 'kick' ? CONFIG.kickCooldown : CONFIG.punchCooldown;
    rider.attackCd = cd;
    rider.attack = { side: side, kind: kind, t: 0, hit: false };

    var target = this.findTarget(rider, side);
    if (!target) {
      this.events.push({ type: 'whiff', rider: rider });
      return null;
    }

    var damage = kind === 'kick' ? CONFIG.kickDamage : CONFIG.punchDamage;
    if (rider.weapon > 0) {
      damage += CONFIG.weaponBonus;
      rider.weapon--;
    }

    rider.attack.hit = true;
    var downed = target.takeHit(damage, side);
    if (downed) rider.takedowns++;

    this.events.push({
      type: downed ? 'takedown' : 'hit',
      rider: rider, target: target, kind: kind
    });
    return target;
  };

  /** 找同侧、够得着、还没趴下的最近一个人。 */
  Race.prototype.findTarget = function (rider, side) {
    var best = null;
    var bestDist = Infinity;

    for (var i = 0; i < this.riders.length; i++) {
      var other = this.riders[i];
      if (other === rider || other.isDown() || other.finished) continue;

      var dz = other.z - rider.z;
      if (Math.abs(dz) > CONFIG.reach) continue;

      var dx = other.x - rider.x;
      // 必须在出手的那一侧
      if (side > 0 ? dx < 0.02 : dx > -0.02) continue;
      if (Math.abs(dx) > CONFIG.reachLateral) continue;

      var dist = Math.abs(dz) + Math.abs(dx) * 800;
      if (dist < bestDist) { bestDist = dist; best = other; }
    }
    return best;
  };

  /* ---------------- 对手 AI ---------------- */

  Race.prototype.updateAi = function (ai, dt) {
    if (ai.finished) {
      ai.z += ai.speed * dt;
      return;
    }

    if (ai.isDown()) {
      this.driveRider(ai, dt, false, false, 0);
      return;
    }

    var seg = this.track.segmentAt(ai.z);
    var steer = 0;

    // 走内线: 弯道里往里侧靠, 技术越好靠得越准
    var line = Util.clamp(-seg.curve * 0.11, -0.65, 0.65) * ai.skill;
    steer += Util.clamp((line - ai.x) * 2.2, -1, 1);

    // 躲车: 前方同侧有交通车就往旁边让
    var threat = this.nearestCarAhead(ai);
    if (threat) {
      steer += (ai.x > threat.x ? 1 : -1) * 1.3;
    }

    // 离地了先回到路上
    if (Math.abs(ai.x) > 0.95) steer += (ai.x > 0 ? -1 : 1) * 1.6;

    steer = Util.clamp(steer, -1, 1);

    // 弯太急就松一点油门, 技术差的更早松
    var brake = Math.abs(seg.curve) > 4.2 && ai.speedPercent() > 0.86 - ai.skill * 0.2;

    this.driveRider(ai, dt, !brake, brake, steer);

    // 找人打。出手频率不能高: 五个对手同时够得着玩家时, 单个看着还算克制的
    // 频率乘以五就成了围殴, 玩家全程在地上爬。
    if (ai.attackCd <= 0 && ai.swingCd <= 0 &&
        this.rng.next() < ai.aggression * dt * 0.55) {
      var side = this.player.x > ai.x ? 1 : -1;
      // 优先打玩家 —— AI 互殴的话玩家就成看客了; 够不着再随便找一个
      var victim = this.findTarget(ai, side);
      if (victim !== this.player) {
        side = this.rng.chance(0.5) ? -1 : 1;
        victim = this.findTarget(ai, side);
      }
      if (victim) {
        this.tryAttack(ai, side, this.rng.chance(0.3) ? 'kick' : 'punch');
        // 打完歇一会儿再找下一个目标, 给玩家反打和拉开距离的机会
        ai.swingCd = this.rng.range(1.1, 2.4);
      }
    }
  };

  /**
   * 前方同一条线上最近的一辆车。
   * 视距按当前速度算成「大约一秒后会撞上的距离」—— 写死一个固定值的话,
   * 极速下 3000 个单位只有 0.3 秒反应时间, 等看见了已经撞上了。
   */
  Race.prototype.nearestCarAhead = function (rider) {
    var total = this.track.totalLength();
    var wrapped = ((rider.z % total) + total) % total;
    var lookAhead = Math.max(3000, rider.speed * 1.15);
    var best = null;
    var bestDz = Infinity;

    for (var i = 0; i < this.traffic.length; i++) {
      var car = this.traffic[i];
      var dz = car.z - wrapped;
      if (dz < -total / 2) dz += total;       // 对面刚绕回起点的车
      if (dz <= 0 || dz > lookAhead) continue;
      if (Math.abs(car.x - rider.x) > 0.42) continue;
      if (dz < bestDz) { bestDz = dz; best = car; }
    }
    return best;
  };

  /* ---------------- 碰撞 ---------------- */

  Race.prototype.resolveCollisions = function (rider, dt) {
    if (rider.isDown() || rider.finished) return;

    // 撞交通车。正面撞上才摔车; 蹭一下只掉速掉血 ——
    // 一碰就躺的话, 车流密的赛道基本没法玩。
    var wrapped = ((rider.z % this.track.totalLength()) + this.track.totalLength())
      % this.track.totalLength();
    for (var i = 0; i < this.traffic.length; i++) {
      var car = this.traffic[i];
      if (Math.abs(car.z - wrapped) > 300) continue;
      var gap = Math.abs(car.x - rider.x);
      if (gap > 0.3) continue;

      if (gap < 0.15) {
        rider.knockDown();
        this.events.push({ type: 'crash', rider: rider, cause: 'traffic' });
      } else {
        // 擦身而过: 弹开、掉速、掉点血, 但还骑在车上
        if (rider.grazeCd > 0) continue;
        rider.grazeCd = 0.6;
        rider.x += (rider.x > car.x ? 1 : -1) * 0.22;
        rider.speed *= 0.62;
        rider.health = Math.max(1, rider.health - 6);
        rider.flash = 0.18;
        this.events.push({ type: 'graze', rider: rider });
      }
      return;
    }

    // 骑手之间互相挤开, 不叠在一起
    for (i = 0; i < this.riders.length; i++) {
      var other = this.riders[i];
      if (other === rider || other.isDown()) continue;
      if (Math.abs(other.z - rider.z) > 300) continue;
      var dx = rider.x - other.x;
      if (Math.abs(dx) > 0.26) continue;
      var push = (dx >= 0 ? 1 : -1) * 0.9 * dt;
      rider.x += push;
      other.x -= push;
    }

    // 冲太远的草地上会栽跟头
    if (Math.abs(rider.x) > 1.9 && rider.speed > CONFIG.offRoadLimit * 0.85) {
      rider.knockDown();
      this.events.push({ type: 'crash', rider: rider, cause: 'offroad' });
    }
  };

  Race.prototype.checkFinish = function (rider) {
    if (rider.finished) return;
    if (rider.z >= this.finishZ) {
      rider.finished = true;
      rider.finishTime = this.time;
    }
  };

  /** 已冲线的按用时排, 没冲线的按跑了多远排。 */
  Race.prototype.updateRanks = function () {
    var sorted = this.riders.slice().sort(function (a, b) {
      if (a.finished && b.finished) return a.finishTime - b.finishTime;
      if (a.finished) return -1;
      if (b.finished) return 1;
      return b.z - a.z;
    });
    for (var i = 0; i < sorted.length; i++) sorted[i].rank = i + 1;
    this.ranking = sorted;
    return sorted;
  };

  Race.prototype.progress = function () {
    return Util.clamp(this.player.z / this.finishZ, 0, 1);
  };

  MB.Rider = Rider;
  MB.Race = Race;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/*
 * 程序化美术。整个游戏一张图片素材都不用, 车手、摩托、汽车、路边景物
 * 全是这里用 Canvas 路径当场画出来的原创造型。
 *
 * 好处有两个: 一是随便缩放都不糊(伪 3D 里同一辆车从远到近要放大十几倍),
 * 二是颜色能按车手换, 十二个对手不用各画一张图。
 *
 * 约定: 每个 draw* 函数都在「以 (0,0) 为脚下中心、向上为负 y」的局部坐标里
 * 画一个高度约 100 单位的东西, 由调用方 translate + scale 到屏幕上。
 */
(function (global) {
  'use strict';

  var MB = global.MB;

  function shade(hex, amount) {
    var n = parseInt(hex.slice(1), 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    if (amount >= 0) {
      r += (255 - r) * amount; g += (255 - g) * amount; b += (255 - b) * amount;
    } else {
      r *= (1 + amount); g *= (1 + amount); b *= (1 + amount);
    }
    return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ------------------------------------------------------------------ *
   * 车手 + 摩托(背面视角)
   * ------------------------------------------------------------------ */

  /**
   * opts:
   *   color   车身/骑手服颜色
   *   lean    -1~1 倾斜
   *   attack  null 或 { side:-1|1, kind:'punch'|'kick', t }
   *   down    true 表示摔在地上
   *   flash   >0 时闪白(刚挨打)
   *   weapon  >0 时手里有钢管
   *   shadow  是否画地面投影
   */
  function drawRider(ctx, opts) {
    var color = opts.color || '#e8503a';
    var lean = Math.max(-1, Math.min(1, opts.lean || 0));

    ctx.save();

    if (opts.shadow !== false) {
      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(0, 2, 30, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    if (opts.down) {
      drawWipeout(ctx, color);
      ctx.restore();
      return;
    }

    // 整体随倾斜歪一点, 转向时看得出在压弯
    ctx.rotate(lean * 0.16);
    ctx.translate(lean * 5, 0);

    var dark = shade(color, -0.4);
    var light = shade(color, 0.25);

    /* --- 后轮 --- */
    ctx.fillStyle = '#1d1f26';
    roundRect(ctx, -9, -30, 18, 30, 7);
    ctx.fill();
    ctx.fillStyle = '#3b3f4a';
    roundRect(ctx, -5, -24, 10, 14, 4);
    ctx.fill();

    /* --- 排气管 --- */
    ctx.fillStyle = '#9aa3b0';
    roundRect(ctx, -22, -26, 9, 7, 3);
    ctx.fill();
    roundRect(ctx, 13, -26, 9, 7, 3);
    ctx.fill();

    /* --- 车身 --- */
    ctx.fillStyle = dark;
    roundRect(ctx, -16, -52, 32, 26, 8);
    ctx.fill();
    ctx.fillStyle = color;
    roundRect(ctx, -13, -50, 26, 20, 7);
    ctx.fill();

    // 尾灯。刹车时整块亮起来, 跟在后面的人看得见
    ctx.fillStyle = opts.brake ? '#ff4b4b' : '#8c2b2b';
    roundRect(ctx, -7, -46, 14, 5, 2);
    ctx.fill();
    if (opts.brake) {
      ctx.fillStyle = 'rgba(255,90,80,0.35)';
      roundRect(ctx, -13, -49, 26, 11, 4);
      ctx.fill();
    }

    /* --- 车把与后视镜: 从背后看就是两端翘出去的横杆 --- */
    ctx.strokeStyle = '#6f7683';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-26, -66);
    ctx.lineTo(26, -66);
    ctx.stroke();
    ctx.fillStyle = '#3b3f4a';
    roundRect(ctx, -32, -78, 9, 7, 3);
    ctx.fill();
    roundRect(ctx, 23, -78, 9, 7, 3);
    ctx.fill();

    /* --- 腿 --- */
    var kickSide = (opts.attack && opts.attack.kind === 'kick') ? opts.attack.side : 0;
    ctx.fillStyle = shade(color, -0.55);
    for (var s = -1; s <= 1; s += 2) {
      ctx.save();
      if (s === kickSide) {
        // 踢腿: 整条腿横着伸出去
        ctx.translate(s * 14, -44);
        ctx.rotate(s * 1.15);
        roundRect(ctx, -5, -4, 30, 9, 4);
        ctx.fill();
        ctx.fillStyle = '#23262e';
        roundRect(ctx, 24, -5, 10, 11, 4);   // 靴子
        ctx.fill();
        ctx.fillStyle = shade(color, -0.55);
      } else {
        roundRect(ctx, s * 9 - 5, -50, 10, 22, 4);
        ctx.fill();
      }
      ctx.restore();
    }

    /* --- 躯干 --- */
    ctx.fillStyle = shade(color, -0.15);
    roundRect(ctx, -13, -78, 26, 30, 9);
    ctx.fill();
    // 背后的号码布。压暗一点, 不然缩小之后像块白斑
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = light;
    roundRect(ctx, -6, -73, 12, 13, 4);
    ctx.fill();
    ctx.globalAlpha = 1;

    /* --- 手臂 --- */
    var punchSide = (opts.attack && opts.attack.kind === 'punch') ? opts.attack.side : 0;
    ctx.fillStyle = shade(color, -0.3);
    for (s = -1; s <= 1; s += 2) {
      ctx.save();
      if (s === punchSide) {
        // 出拳: 手臂横向打直
        ctx.translate(s * 11, -70);
        ctx.rotate(s * 1.4);
        roundRect(ctx, -4, -4, 26, 8, 4);
        ctx.fill();
        ctx.fillStyle = '#f0c9a4';
        ctx.beginPath();
        ctx.arc(24, 0, 6, 0, Math.PI * 2);   // 拳头
        ctx.fill();
        if (opts.weapon > 0) {
          ctx.fillStyle = '#b9c0cc';         // 钢管
          roundRect(ctx, 20, -3, 22, 6, 3);
          ctx.fill();
        }
        ctx.fillStyle = shade(color, -0.3);
      } else {
        ctx.translate(s * 11, -72);
        ctx.rotate(s * 0.45);
        roundRect(ctx, -4, -2, 8, 22, 4);
        ctx.fill();
      }
      ctx.restore();
    }

    /* --- 头盔 --- */
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(0, -86, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = shade(color, -0.45);
    roundRect(ctx, -11, -88, 22, 7, 3);       // 帽檐
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.arc(-4, -90, 4, 0, Math.PI * 2);      // 高光
    ctx.fill();

    // 刚挨打: 整体闪一下白
    if (opts.flash > 0) {
      ctx.globalAlpha = Math.min(0.75, opts.flash * 4);
      ctx.fillStyle = '#fff';
      roundRect(ctx, -18, -98, 36, 98, 12);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  /** 摔车: 人车分离躺一地。 */
  function drawWipeout(ctx, color) {
    ctx.save();
    ctx.translate(0, -14);
    ctx.rotate(-0.5);

    ctx.fillStyle = '#1d1f26';
    roundRect(ctx, -30, -8, 26, 16, 7);
    ctx.fill();
    ctx.fillStyle = color;
    roundRect(ctx, -12, -10, 30, 18, 7);
    ctx.fill();
    ctx.fillStyle = shade(color, -0.3);
    roundRect(ctx, 14, -6, 20, 11, 5);
    ctx.fill();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(34, -2, 9, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // 扬起的尘土
    ctx.fillStyle = 'rgba(210,200,185,0.5)';
    for (var i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(-26 + i * 16, -6 - (i % 2) * 8, 8 + i * 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ------------------------------------------------------------------ *
   * 交通车辆(背面视角)
   * ------------------------------------------------------------------ */

  var CAR_COLORS = ['#d9d3c4', '#4a6fa5', '#b8553f', '#6d7a54'];

  function drawCar(ctx, kind) {
    var color = CAR_COLORS[kind % CAR_COLORS.length];
    var isTruck = kind === 3;

    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, 2, isTruck ? 52 : 40, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    var w = isTruck ? 92 : 70;
    var h = isTruck ? 86 : 56;

    // 车轮
    ctx.fillStyle = '#16181d';
    roundRect(ctx, -w / 2 + 2, -16, 14, 16, 4);
    ctx.fill();
    roundRect(ctx, w / 2 - 16, -16, 14, 16, 4);
    ctx.fill();

    // 车身
    ctx.fillStyle = shade(color, -0.3);
    roundRect(ctx, -w / 2, -h, w, h - 4, 8);
    ctx.fill();
    ctx.fillStyle = color;
    roundRect(ctx, -w / 2 + 4, -h + 4, w - 8, h - 12, 6);
    ctx.fill();

    // 后窗
    ctx.fillStyle = 'rgba(40,52,66,0.85)';
    roundRect(ctx, -w / 2 + 11, -h + 10, w - 22, isTruck ? 30 : 20, 5);
    ctx.fill();

    // 尾灯
    ctx.fillStyle = '#e8453c';
    roundRect(ctx, -w / 2 + 7, -20, 12, 7, 3);
    ctx.fill();
    roundRect(ctx, w / 2 - 19, -20, 12, 7, 3);
    ctx.fill();

    // 车牌
    ctx.fillStyle = '#e9e4d6';
    roundRect(ctx, -11, -18, 22, 8, 2);
    ctx.fill();

    ctx.restore();
  }

  /* ------------------------------------------------------------------ *
   * 路边景物
   * ------------------------------------------------------------------ */

  function drawProp(ctx, kind, dir) {
    switch (kind) {
      case 'palm':     return drawPalm(ctx);
      case 'pine':     return drawPine(ctx);
      case 'cactus':   return drawCactus(ctx);
      case 'rock':     return drawRock(ctx);
      case 'bush':     return drawBush(ctx);
      case 'lamp':     return drawLamp(ctx);
      case 'building': return drawBuilding(ctx);
      case 'sign':     return drawSign(ctx, dir || 1);
      default:         return drawBush(ctx);
    }
  }

  function drawPalm(ctx) {
    ctx.fillStyle = '#7a6144';
    ctx.beginPath();
    ctx.moveTo(-5, 0); ctx.lineTo(-3, -78); ctx.lineTo(4, -78); ctx.lineTo(5, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2f8f52';
    for (var i = 0; i < 6; i++) {
      var a = -Math.PI / 2 + (i - 2.5) * 0.55;
      ctx.save();
      ctx.translate(0, -78);
      ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(28, 0, 30, 9, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawPine(ctx) {
    ctx.fillStyle = '#5c4630';
    ctx.fillRect(-4, -20, 8, 20);
    ctx.fillStyle = '#25623c';
    for (var i = 0; i < 3; i++) {
      var y = -20 - i * 22;
      var w = 34 - i * 8;
      ctx.beginPath();
      ctx.moveTo(0, y - 34);
      ctx.lineTo(-w, y);
      ctx.lineTo(w, y);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawCactus(ctx) {
    ctx.fillStyle = '#3f7d49';
    roundRect(ctx, -9, -72, 18, 72, 9); ctx.fill();
    roundRect(ctx, -26, -54, 17, 10, 5); ctx.fill();
    roundRect(ctx, -26, -54, 10, 30, 5); ctx.fill();
    roundRect(ctx, 9, -44, 17, 10, 5); ctx.fill();
    roundRect(ctx, 16, -60, 10, 26, 5); ctx.fill();
  }

  function drawRock(ctx) {
    ctx.fillStyle = '#8d8a82';
    ctx.beginPath();
    ctx.moveTo(-26, 0); ctx.lineTo(-16, -22); ctx.lineTo(2, -30);
    ctx.lineTo(20, -18); ctx.lineTo(26, 0);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a5a29a';
    ctx.beginPath();
    ctx.moveTo(-16, -22); ctx.lineTo(2, -30); ctx.lineTo(6, -14);
    ctx.closePath(); ctx.fill();
  }

  function drawBush(ctx) {
    ctx.fillStyle = '#356b3a';
    ctx.beginPath();
    ctx.arc(-12, -10, 13, 0, Math.PI * 2);
    ctx.arc(2, -16, 16, 0, Math.PI * 2);
    ctx.arc(15, -9, 12, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawLamp(ctx) {
    ctx.fillStyle = '#6b7079';
    ctx.fillRect(-3, -96, 6, 96);
    ctx.beginPath();
    ctx.moveTo(0, -96);
    ctx.quadraticCurveTo(0, -108, 20, -108);
    ctx.lineTo(20, -102);
    ctx.quadraticCurveTo(6, -102, 6, -96);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ffe9a8';
    roundRect(ctx, 14, -104, 14, 7, 3);
    ctx.fill();
  }

  function drawBuilding(ctx) {
    ctx.fillStyle = '#3b4250';
    ctx.fillRect(-38, -150, 76, 150);
    ctx.fillStyle = '#2c313c';
    ctx.fillRect(-38, -150, 76, 8);
    ctx.fillStyle = '#ffd98a';
    for (var r = 0; r < 6; r++) {
      for (var c = 0; c < 4; c++) {
        // 固定的明暗图案, 不用随机, 免得每帧闪
        if ((r * 7 + c * 3) % 5 < 2) continue;
        ctx.fillRect(-30 + c * 17, -136 + r * 22, 10, 13);
      }
    }
  }

  function drawSign(ctx, dir) {
    ctx.fillStyle = '#6b7079';
    ctx.fillRect(-3, -46, 6, 46);
    ctx.fillStyle = '#f2c230';
    roundRect(ctx, -22, -74, 44, 30, 6);
    ctx.fill();
    // 箭头指出弯向
    ctx.fillStyle = '#2b2b2b';
    ctx.save();
    ctx.translate(0, -59);
    ctx.scale(dir, 1);
    ctx.beginPath();
    ctx.moveTo(-12, -6); ctx.lineTo(2, -6); ctx.lineTo(2, -12);
    ctx.lineTo(14, 0); ctx.lineTo(2, 12); ctx.lineTo(2, 6); ctx.lineTo(-12, 6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /** 路边的钢管拾取物。 */
  function drawPickup(ctx, bob) {
    ctx.save();
    ctx.translate(0, -26 + Math.sin(bob * 4) * 5);
    ctx.fillStyle = 'rgba(255,225,120,0.28)';
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.rotate(-0.5);
    ctx.fillStyle = '#c8cfdb';
    roundRect(ctx, -22, -4, 44, 9, 4);
    ctx.fill();
    ctx.fillStyle = '#8b93a2';
    roundRect(ctx, -22, -4, 12, 9, 4);
    ctx.fill();
    ctx.restore();
  }

  MB.Sprites = {
    shade: shade,
    roundRect: roundRect,
    drawRider: drawRider,
    drawCar: drawCar,
    drawProp: drawProp,
    drawPickup: drawPickup,
    CAR_COLORS: CAR_COLORS
  };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/*
 * 伪 3D 渲染。
 *
 * 路面: 从最远的一段往回画, 每段是一个梯形。画的时候记住当前画到的最高
 * 屏幕 y(maxy), 比它还低的段直接跳过 —— 这样翻过坡顶时, 坡后面的路会被
 * 坡自然挡住, 不需要任何深度缓冲。
 *
 * 精灵: 反过来从近往远画不行(会盖住路), 所以先画完路, 再由远及近画精灵,
 * 并且用所在路段记下的 clip 值裁掉陷进山坡里的部分。
 */
(function (global) {
  'use strict';

  var MB = global.MB;
  var CONFIG = MB.CONFIG;
  var Util = MB.Util;
  var Sprites = MB.Sprites;
  var project = MB.project;

  /* 各场景的配色。road/grass 有深浅两档, 交替出现形成速度条纹。 */
  var PALETTES = {
    coast: {
      sky: ['#5fc6f0', '#bde9fb'], sun: '#fff3bd', sunPos: 0.7,
      hill: '#7fae86', hillFar: '#a9c9ad',
      grass: ['#6fae5c', '#66a355'], road: ['#4a4e57', '#474b54'],
      rumble: ['#e8e4dc', '#c8453f'], lane: '#e8e4dc', fog: '#bde9fb'
    },
    desert: {
      sky: ['#f0a95f', '#ffe2b0'], sun: '#fff0c0', sunPos: 0.45,
      hill: '#c0925e', hillFar: '#d9b489',
      grass: ['#d8b273', '#d0a869'], road: ['#5a5147', '#564e45'],
      rumble: ['#f3ece0', '#b8562f'], lane: '#f3ece0', fog: '#ffe2b0'
    },
    forest: {
      sky: ['#7fb8d8', '#cfe6ef'], sun: '#fdf6d8', sunPos: 0.25,
      hill: '#3f6f4c', hillFar: '#6b9370',
      grass: ['#3e7a48', '#397043'], road: ['#484c54', '#454951'],
      rumble: ['#e4e0d6', '#9c6b3c'], lane: '#e4e0d6', fog: '#cfe6ef'
    },
    city: {
      sky: ['#1b2140', '#3b3560'], sun: '#f7f0c8', sunPos: 0.8,
      hill: '#252a44', hillFar: '#333a58',
      grass: ['#2b3048', '#282d43'], road: ['#33363f', '#30333c'],
      rumble: ['#d8d4c8', '#c9a13a'], lane: '#d8d4c8', fog: '#3b3560'
    },
    storm: {
      sky: ['#39424f', '#6b7480'], sun: '#c9d2da', sunPos: 0.35,
      hill: '#3c4550', hillFar: '#525c68',
      grass: ['#46534b', '#424e47'], road: ['#3c4046', '#393d43'],
      rumble: ['#cfd4d8', '#7d5a8c'], lane: '#cfd4d8', fog: '#6b7480'
    }
  };

  function Renderer(canvas, track) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.track = track;
    this.palette = PALETTES[track.def.scene] || PALETTES.coast;
    this.cameraDepth = MB.cameraDepthFor(CONFIG.fieldOfView);
    this.playerZ = CONFIG.cameraHeight * this.cameraDepth;
    this.skyOffset = 0;
    this.hillOffset = 0;
    this.shake = 0;
    this.resize();
  }

  Renderer.prototype.resize = function () {
    var dpr = Math.min(global.devicePixelRatio || 1, 2);
    var rect = this.canvas.getBoundingClientRect();
    this.width = Math.max(1, Math.round(rect.width));
    this.height = Math.max(1, Math.round(rect.height));
    this.canvas.width = Math.round(this.width * dpr);
    this.canvas.height = Math.round(this.height * dpr);
    this.dpr = dpr;
  };

  /** 天空随弯道缓慢横移, 制造「在转弯」的错觉。 */
  Renderer.prototype.updateParallax = function (dt, curve, speedPercent) {
    this.skyOffset += curve * speedPercent * dt * 0.6;
    this.hillOffset += curve * speedPercent * dt * 2.4;
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 3);
  };

  Renderer.prototype.addShake = function (amount) {
    this.shake = Math.min(1, this.shake + amount);
  };

  /* ------------------------------------------------------------------ */

  Renderer.prototype.render = function (race, time) {
    var ctx = this.ctx;
    var width = this.width;
    var height = this.height;
    var track = this.track;
    var segments = track.segments;
    var pal = this.palette;

    ctx.save();
    ctx.scale(this.dpr, this.dpr);

    if (this.shake > 0) {
      ctx.translate((Math.random() - 0.5) * 14 * this.shake,
                    (Math.random() - 0.5) * 10 * this.shake);
    }

    var player = race.player;
    var position = player.z;
    var playerX = player.x;

    var baseSegment = track.segmentAt(position);
    var basePercent = (position % CONFIG.segmentLength) / CONFIG.segmentLength;
    var playerSegment = track.segmentAt(position + this.playerZ);
    var playerPercent = ((position + this.playerZ) % CONFIG.segmentLength)
      / CONFIG.segmentLength;
    var playerY = Util.interpolate(playerSegment.p1.world.y,
      playerSegment.p2.world.y, playerPercent);

    this.drawSky(ctx, width, height, pal);
    this.drawHills(ctx, width, height, pal, playerY);

    var maxy = height;
    var x = 0;
    var dx = -(baseSegment.curve * basePercent);
    var n, segment;
    var trackLength = track.totalLength();

    /* ---- 路面: 由远及近 ---- */
    for (n = 0; n < CONFIG.drawDistance; n++) {
      segment = segments[(baseSegment.index + n) % segments.length];
      segment.looped = segment.index < baseSegment.index;
      // 越远越淡, 平方衰减比线性看着自然
      var t = n / CONFIG.drawDistance;
      segment.fog = 1 / Math.exp(CONFIG.fogDensity * t * t);
      segment.clip = maxy;

      project(segment.p1, (playerX * CONFIG.roadWidth) - x,
        playerY + CONFIG.cameraHeight,
        position - (segment.looped ? trackLength : 0),
        this.cameraDepth, width, height, CONFIG.roadWidth);
      project(segment.p2, (playerX * CONFIG.roadWidth) - x - dx,
        playerY + CONFIG.cameraHeight,
        position - (segment.looped ? trackLength : 0),
        this.cameraDepth, width, height, CONFIG.roadWidth);

      x += dx;
      dx += segment.curve;

      if (segment.p1.camera.z <= this.cameraDepth) continue;
      if (segment.p2.screen.y >= segment.p1.screen.y) continue;
      if (segment.p2.screen.y >= maxy) continue;

      this.drawSegment(ctx, width, segment, pal);
      maxy = segment.p2.screen.y;
    }

    /* ---- 精灵: 由远及近盖上去 ---- */
    for (n = CONFIG.drawDistance - 1; n > 0; n--) {
      segment = segments[(baseSegment.index + n) % segments.length];
      this.drawSegmentSprites(ctx, segment, race, time);
    }

    this.drawPlayer(ctx, width, height, race, playerSegment, time);

    ctx.restore();
  };

  /* ---------------- 背景 ---------------- */

  Renderer.prototype.drawSky = function (ctx, width, height, pal) {
    var grad = ctx.createLinearGradient(0, 0, 0, height * 0.62);
    grad.addColorStop(0, pal.sky[0]);
    grad.addColorStop(1, pal.sky[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, height);

    // 太阳/月亮。横向随弯道飘, 但不出屏幕
    var sx = (((this.skyOffset * 0.02 + pal.sunPos) % 1) + 1) % 1;
    ctx.fillStyle = pal.sun;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.arc(sx * width, height * 0.2, Math.min(width, height) * 0.075, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  };

  Renderer.prototype.drawHills = function (ctx, width, height, pal, playerY) {
    // 远山跟着高度上下浮动, 冲坡时地平线才会跟着动
    var horizon = height * 0.58 - playerY * 0.00018 * height;
    var off = this.hillOffset * 0.6;

    ctx.fillStyle = pal.hillFar;
    ctx.beginPath();
    ctx.moveTo(0, horizon);
    for (var i = 0; i <= 12; i++) {
      var px = (i / 12) * width;
      var h = 34 + Math.sin(i * 1.7 + off * 0.01) * 22 + Math.sin(i * 0.6) * 14;
      ctx.lineTo(px, horizon - h);
    }
    ctx.lineTo(width, horizon);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = pal.hill;
    ctx.beginPath();
    ctx.moveTo(0, horizon);
    for (i = 0; i <= 9; i++) {
      px = (i / 9) * width;
      h = 18 + Math.sin(i * 2.3 + off * 0.016 + 1.2) * 16;
      ctx.lineTo(px, horizon - h);
    }
    ctx.lineTo(width, horizon);
    ctx.closePath();
    ctx.fill();
  };

  /* ---------------- 路面 ---------------- */

  Renderer.prototype.drawSegment = function (ctx, width, segment, pal) {
    var p1 = segment.p1.screen;
    var p2 = segment.p2.screen;
    var i = segment.dark ? 1 : 0;

    // 草地铺满整条横带
    ctx.fillStyle = pal.grass[i];
    ctx.fillRect(0, p2.y, width, p1.y - p2.y);

    var rumbleW1 = p1.w / 5;
    var rumbleW2 = p2.w / 5;
    var laneW1 = p1.w / 28;
    var laneW2 = p2.w / 28;

    // 路肩
    poly(ctx, p1.x - p1.w - rumbleW1, p1.y, p1.x - p1.w, p1.y,
      p2.x - p2.w, p2.y, p2.x - p2.w - rumbleW2, p2.y, pal.rumble[i]);
    poly(ctx, p1.x + p1.w + rumbleW1, p1.y, p1.x + p1.w, p1.y,
      p2.x + p2.w, p2.y, p2.x + p2.w + rumbleW2, p2.y, pal.rumble[i]);

    // 路面
    poly(ctx, p1.x - p1.w, p1.y, p1.x + p1.w, p1.y,
      p2.x + p2.w, p2.y, p2.x - p2.w, p2.y, pal.road[i]);

    // 车道线只在浅色段画, 形成虚线
    if (!segment.dark) {
      var lanes = CONFIG.lanes;
      var lw1 = p1.w * 2 / lanes;
      var lw2 = p2.w * 2 / lanes;
      var lx1 = p1.x - p1.w + lw1;
      var lx2 = p2.x - p2.w + lw2;
      for (var l = 1; l < lanes; l++) {
        poly(ctx, lx1 - laneW1, p1.y, lx1 + laneW1, p1.y,
          lx2 + laneW2, p2.y, lx2 - laneW2, p2.y, pal.lane);
        lx1 += lw1;
        lx2 += lw2;
      }
    }

    // 起终点线
    if (segment.marker) {
      ctx.fillStyle = segment.marker === 1 ? '#ffffff' : '#111111';
      poly(ctx, p1.x - p1.w, p1.y, p1.x + p1.w, p1.y,
        p2.x + p2.w, p2.y, p2.x - p2.w, p2.y,
        segment.marker === 1 ? 'rgba(255,255,255,0.75)' : 'rgba(20,20,20,0.75)');
    }

    // 雾: 越远越接近天色
    if (segment.fog < 1) {
      ctx.globalAlpha = 1 - segment.fog;
      ctx.fillStyle = pal.fog;
      ctx.fillRect(0, p2.y, width, p1.y - p2.y);
      ctx.globalAlpha = 1;
    }
  };

  function poly(ctx, x1, y1, x2, y2, x3, y3, x4, y4, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.lineTo(x4, y4);
    ctx.closePath();
    ctx.fill();
  }

  /* ---------------- 精灵 ---------------- */

  /**
   * 把「路面横向比例 offset + 所在路段」换算成屏幕位置和缩放。
   * percent 是在这一段里的进度, 用来在两个端点之间插值。
   */
  Renderer.prototype.locate = function (segment, offset, percent) {
    var p1 = segment.p1.screen;
    var p2 = segment.p2.screen;
    var scale = Util.interpolate(segment.p1.screen.scale, segment.p2.screen.scale, percent);
    var x = Util.interpolate(p1.x, p2.x, percent);
    var y = Util.interpolate(p1.y, p2.y, percent);
    var w = Util.interpolate(p1.w, p2.w, percent);
    return { x: x + w * offset, y: y, scale: scale, w: w };
  };

  Renderer.prototype.drawSegmentSprites = function (ctx, segment, race, time) {
    if (!segment.p1.screen.scale) return;
    var self = this;
    var clip = segment.clip;
    var i;

    // 路边景物
    for (i = 0; i < segment.props.length; i++) {
      var prop = segment.props[i];
      var spot = this.locate(segment, prop.offset, 0.5);
      this.stamp(ctx, spot, clip, segment.fog, prop.scale * 2.1, function (c) {
        Sprites.drawProp(c, prop.kind, prop.dir);
      });
    }

    var segStart = segment.index * CONFIG.segmentLength;
    var trackLength = this.track.totalLength();

    // 钢管
    for (i = 0; i < race.pickups.length; i++) {
      var item = race.pickups[i];
      if (item.taken) continue;
      if (!inSegment(item.z, segStart)) continue;
      var pspot = this.locate(segment, item.x, percentIn(item.z, segStart));
      this.stamp(ctx, pspot, clip, segment.fog, 0.55, function (c) {
        Sprites.drawPickup(c, time);
      });
    }

    // 交通车
    for (i = 0; i < race.traffic.length; i++) {
      var car = race.traffic[i];
      if (!inSegment(car.z, segStart)) continue;
      var cspot = this.locate(segment, car.x, percentIn(car.z, segStart));
      this.stamp(ctx, cspot, clip, segment.fog, 1.0, function (c) {
        Sprites.drawCar(c, car.kind);
      });
    }

    // 对手。用绕回后的 z 去比对, 多圈赛道才不会漏画
    for (i = 1; i < race.riders.length; i++) {
      var rider = race.riders[i];
      var rz = ((rider.z % trackLength) + trackLength) % trackLength;
      if (!inSegment(rz, segStart)) continue;
      var rspot = this.locate(segment, rider.x, percentIn(rz, segStart));
      this.stamp(ctx, rspot, clip, segment.fog, 0.95, function (c) {
        Sprites.drawRider(c, {
          color: rider.color, lean: rider.lean, attack: rider.attack,
          down: rider.isDown(), flash: rider.flash, weapon: rider.weapon
        });
      });
      // 血条: 只在打得到的距离内显示, 免得满屏都是条
      if (!rider.isDown()) {
        this.healthBar(ctx, rspot, rider, clip);
      }
    }
  };

  function inSegment(z, segStart) {
    return z >= segStart && z < segStart + CONFIG.segmentLength;
  }

  function percentIn(z, segStart) {
    return (z - segStart) / CONFIG.segmentLength;
  }

  /**
   * 把一个局部坐标里画好的东西盖到屏幕上。
   *
   * 缩放基准是 spot.w —— 也就是这一段路投影之后的半宽(像素)。用它而不是
   * 原始的 screen.scale, 是因为它已经把视角、距离、画布宽度都算进去了:
   * 同一个东西不管远近, 相对路面的大小始终一致, 换分辨率也不用重新调。
   * 0.0025 是标定出来的系数, 让 sizeScale=1 差不多是一辆小汽车的大小。
   */
  Renderer.prototype.stamp = function (ctx, spot, clip, fog, sizeScale, draw) {
    var scale = spot.w * sizeScale * 0.0025;
    if (scale <= 0.004) return;          // 太小了就别画, 省得白算一堆路径
    if (spot.y > this.height + 200) return;

    ctx.save();
    // 被前面的坡挡住的部分要裁掉, 不然景物会浮在山体上
    if (clip < this.height) {
      ctx.beginPath();
      ctx.rect(0, 0, this.width, clip);
      ctx.clip();
    }
    ctx.translate(spot.x, spot.y);
    ctx.scale(scale, scale);
    if (fog < 1) ctx.globalAlpha = Math.max(0, fog);
    draw(ctx);
    ctx.restore();
  };

  Renderer.prototype.healthBar = function (ctx, spot, rider, clip) {
    var w = spot.w * 0.16;
    if (w < 16) return;                  // 太远了就不显示, 免得满屏小条
    var h = Math.max(4, w * 0.13);
    var y = spot.y - spot.w * 0.28;
    if (y > clip) return;

    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(spot.x - w / 2, y, w, h);
    var pct = Util.clamp(rider.health / CONFIG.maxHealth, 0, 1);
    ctx.fillStyle = pct > 0.5 ? '#5cd16b' : (pct > 0.22 ? '#e8c53a' : '#e8503a');
    ctx.fillRect(spot.x - w / 2 + 1, y + 1, (w - 2) * pct, h - 2);
    ctx.restore();
  };

  /* ---------------- 玩家 ---------------- */

  Renderer.prototype.drawPlayer = function (ctx, width, height, race, playerSegment, time) {
    var player = race.player;
    var pct = player.speedPercent();

    // 车固定画在屏幕下方。速度越快抖得越明显, 摔车时沉下去
    var bounce = Math.sin(time * 22) * 1.6 * pct * (1 - player.speedPercent() * 0.3);
    var baseY = height * 0.88 + bounce;
    var scale = width * 0.5 * 0.0042;

    ctx.save();
    ctx.translate(width / 2 + player.lean * width * 0.02, baseY);
    ctx.scale(scale, scale);
    Sprites.drawRider(ctx, {
      color: player.color,
      lean: player.lean,
      attack: player.attack,
      down: player.isDown(),
      flash: player.flash,
      weapon: player.weapon,
      brake: race.__braking
    });
    ctx.restore();

    // 高速时的速度线。从消失点往外甩, 但只画屏幕边缘那一圈 ——
    // 画到中间会糊住路面, 看着像划痕
    if (pct > 0.62) {
      var amount = (pct - 0.62) / 0.38;
      ctx.save();
      ctx.strokeStyle = '#ffffff';
      ctx.lineCap = 'round';
      var cx = width / 2;
      var cy = height * 0.56;
      for (var i = 0; i < 14; i++) {
        // 每条线有自己的相位, 循环着往外飞
        var a = (i / 14) * Math.PI * 2 + i * 1.7;
        var phase = (time * (1.1 + (i % 3) * 0.25) + i * 0.37) % 1;
        var r0 = width * (0.34 + phase * 0.5);
        var r1 = r0 + width * 0.07 * amount;
        // 越靠外越明显, 靠近中心的直接不画
        ctx.globalAlpha = amount * 0.42 * Math.min(1, phase * 2.2);
        ctx.lineWidth = 1.5 + amount * 1.5;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0 * 0.62);
        ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1 * 0.62);
        ctx.stroke();
      }
      ctx.restore();
    }
  };

  MB.Renderer = Renderer;
  MB.PALETTES = PALETTES;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/*
 * 声音全部用 WebAudio 实时合成, 不带任何音频文件。
 *
 * 引擎是重点: 两个略微失谐的锯齿波 + 一点噪声, 频率跟着车速走, 松油门时
 * 音色变闷。这样加速、拉到红线、撞车熄火都能听出来, 而不是循环播一段。
 */
(function (global) {
  'use strict';

  var MB = global.MB;

  var Sound = {
    ctx: null,
    master: null,
    ready: false,
    sfxOn: true,
    engineOn: true,
    engine: null
  };

  function now() { return Sound.ctx ? Sound.ctx.currentTime : 0; }

  Sound.init = function () {
    if (Sound.ctx) return Sound.ctx;
    var AC = global.AudioContext || global.webkitAudioContext;
    if (!AC) return null;
    try {
      Sound.ctx = new AC();
    } catch (e) {
      return null;
    }
    Sound.master = Sound.ctx.createGain();
    Sound.master.gain.value = 0.5;
    Sound.master.connect(Sound.ctx.destination);
    Sound.ready = true;
    return Sound.ctx;
  };

  /** iOS/微信里必须在用户手势里 resume 一次, 否则一直是 suspended。 */
  Sound.unlock = function () {
    if (!Sound.ctx) Sound.init();
    if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume();
  };

  /* ------------------------------------------------------------------ *
   * 引擎
   * ------------------------------------------------------------------ */

  Sound.startEngine = function () {
    if (!Sound.ctx || Sound.engine) return;
    var ctx = Sound.ctx;

    var gain = ctx.createGain();
    gain.gain.value = 0;

    // 低通让松油门时听着发闷
    var filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 900;
    filter.Q.value = 1.2;

    var osc1 = ctx.createOscillator();
    osc1.type = 'sawtooth';
    osc1.frequency.value = 60;

    // 第二个振荡器故意差几个 Hz, 拍频听起来像单缸抖动
    var osc2 = ctx.createOscillator();
    osc2.type = 'square';
    osc2.frequency.value = 62;

    var oscGain2 = ctx.createGain();
    oscGain2.gain.value = 0.35;

    // 一点白噪声当机械噪音
    var noise = ctx.createBufferSource();
    var buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    noise.buffer = buf;
    noise.loop = true;
    var noiseGain = ctx.createGain();
    noiseGain.gain.value = 0.05;

    osc1.connect(filter);
    osc2.connect(oscGain2);
    oscGain2.connect(filter);
    noise.connect(noiseGain);
    noiseGain.connect(filter);
    filter.connect(gain);
    gain.connect(Sound.master);

    osc1.start();
    osc2.start();
    noise.start();

    Sound.engine = { osc1: osc1, osc2: osc2, gain: gain, filter: filter,
                     noiseGain: noiseGain };
  };

  Sound.stopEngine = function () {
    if (!Sound.engine) return;
    var e = Sound.engine;
    try {
      e.osc1.stop(); e.osc2.stop();
    } catch (err) { /* 已经停过 */ }
    e.gain.disconnect();
    Sound.engine = null;
  };

  /**
   * 每帧喂进来当前转速。
   * rpm 0~1, throttle 表示是否在给油, down 表示摔了(熄火)。
   */
  Sound.engineUpdate = function (rpm, throttle, down) {
    if (!Sound.engine || !Sound.ctx) return;
    var e = Sound.engine;
    var t = now();
    var vol = Sound.engineOn && !down ? 0.16 + rpm * 0.2 : 0;

    // 挂档感: 频率在每个"档位"里爬升, 到顶再掉回来重新爬
    var gearSpan = 0.22;
    var gear = Math.min(4, Math.floor(rpm / gearSpan));
    var within = (rpm - gear * gearSpan) / gearSpan;
    var base = 52 + gear * 14 + within * 70;

    e.osc1.frequency.setTargetAtTime(base, t, 0.06);
    e.osc2.frequency.setTargetAtTime(base * 1.01 + 2, t, 0.06);
    e.filter.frequency.setTargetAtTime(
      throttle ? 700 + rpm * 2600 : 380 + rpm * 900, t, 0.09);
    e.gain.gain.setTargetAtTime(vol, t, 0.08);
    e.noiseGain.gain.setTargetAtTime(0.02 + rpm * 0.07, t, 0.1);
  };

  /* ------------------------------------------------------------------ *
   * 音效
   * ------------------------------------------------------------------ */

  function blip(opts) {
    if (!Sound.ready || !Sound.sfxOn || !Sound.ctx) return;
    var ctx = Sound.ctx;
    var t = now();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = opts.type || 'square';
    osc.frequency.setValueAtTime(opts.from, t);
    if (opts.to) osc.frequency.exponentialRampToValueAtTime(Math.max(1, opts.to), t + opts.dur);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(opts.vol || 0.3, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + opts.dur);
    osc.connect(gain);
    gain.connect(Sound.master);
    osc.start(t);
    osc.stop(t + opts.dur + 0.02);
  }

  function burst(dur, vol, filterFreq) {
    if (!Sound.ready || !Sound.sfxOn || !Sound.ctx) return;
    var ctx = Sound.ctx;
    var t = now();
    var len = Math.ceil(ctx.sampleRate * dur);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    }
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = filterFreq || 1800;
    var gain = ctx.createGain();
    gain.gain.value = vol || 0.4;
    src.connect(filter);
    filter.connect(gain);
    gain.connect(Sound.master);
    src.start(t);
  }

  Sound.punch = function () {
    blip({ type: 'square', from: 220, to: 70, dur: 0.1, vol: 0.28 });
    burst(0.09, 0.32, 1200);
  };

  Sound.kick = function () {
    blip({ type: 'sawtooth', from: 170, to: 45, dur: 0.16, vol: 0.34 });
    burst(0.14, 0.4, 900);
  };

  Sound.whiff = function () {
    burst(0.07, 0.12, 3200);
  };

  Sound.crash = function () {
    burst(0.55, 0.6, 2600);
    blip({ type: 'sawtooth', from: 140, to: 30, dur: 0.45, vol: 0.32 });
  };

  Sound.takedown = function () {
    blip({ type: 'square', from: 320, to: 90, dur: 0.22, vol: 0.34 });
    burst(0.3, 0.45, 1400);
  };

  Sound.pickup = function () {
    blip({ type: 'triangle', from: 640, to: 1180, dur: 0.16, vol: 0.28 });
  };

  Sound.beep = function (high) {
    blip({ type: 'square', from: high ? 880 : 440, to: high ? 880 : 440,
           dur: high ? 0.42 : 0.16, vol: 0.26 });
  };

  Sound.click = function () {
    blip({ type: 'square', from: 520, to: 660, dur: 0.06, vol: 0.18 });
  };

  Sound.finish = function () {
    [523, 659, 784, 1046].forEach(function (f, i) {
      setTimeout(function () {
        blip({ type: 'triangle', from: f, to: f, dur: 0.22, vol: 0.3 });
      }, i * 110);
    });
  };

  MB.Sound = Sound;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/*
 * 输入。桌面用键盘, 手机用屏幕按钮, 两边喂给 race.update 的是同一个结构。
 *
 * 手机上默认自动给油 —— 一只手要同时管方向和拳脚已经够忙了, 再按住油门
 * 基本没法玩; 想减速就按刹车。桌面则是老老实实按住上键加速。
 */
(function (global) {
  'use strict';

  var MB = global.MB;
  var doc = global.document;

  var KEYMAP = {
    ArrowUp: 'throttle', KeyW: 'throttle',
    ArrowDown: 'brake', KeyS: 'brake',
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    KeyZ: 'punchLeft', KeyQ: 'punchLeft',
    KeyX: 'punchRight', KeyE: 'punchRight',
    KeyC: 'kickLeft', KeyV: 'kickRight',
    Space: 'kickRight'
  };

  function Input(opts) {
    this.held = {};
    this.pressed = {};          // 只在按下的那一帧为真, 用于出拳这类单次动作
    this.autoThrottle = !!(opts && opts.autoThrottle);
    this.enabled = false;
    this.onPause = opts && opts.onPause;
    this.bind();
  }

  Input.prototype.bind = function () {
    var self = this;

    this.keyDown = function (e) {
      if (e.code === 'Escape' && self.onPause) { self.onPause(); return; }
      var action = KEYMAP[e.code];
      if (!action) return;
      e.preventDefault();
      if (!self.held[action]) self.pressed[action] = true;
      self.held[action] = true;
    };

    this.keyUp = function (e) {
      var action = KEYMAP[e.code];
      if (!action) return;
      e.preventDefault();
      self.held[action] = false;
    };

    // 切后台时把所有键松开, 免得回来还在一直加速
    this.blur = function () { self.held = {}; };

    doc.addEventListener('keydown', this.keyDown);
    doc.addEventListener('keyup', this.keyUp);
