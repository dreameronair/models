    global.addEventListener('blur', this.blur);
  };

  /** 把屏幕按钮接上。每个按钮用 data-act 标明动作。 */
  Input.prototype.bindTouch = function (root) {
    var self = this;
    var buttons = root.querySelectorAll('[data-act]');

    function set(action, on, e) {
      e.preventDefault();
      if (on && !self.held[action]) self.pressed[action] = true;
      self.held[action] = on;
    }

    for (var i = 0; i < buttons.length; i++) {
      (function (btn) {
        var action = btn.getAttribute('data-act');
        var down = function (e) { btn.classList.add('is-down'); set(action, true, e); };
        var up = function (e) { btn.classList.remove('is-down'); set(action, false, e); };
        btn.addEventListener('touchstart', down, { passive: false });
        btn.addEventListener('touchend', up, { passive: false });
        btn.addEventListener('touchcancel', up, { passive: false });
        // 桌面上用鼠标也能点, 方便调试和没有触屏的设备
        btn.addEventListener('mousedown', down);
        btn.addEventListener('mouseup', up);
        btn.addEventListener('mouseleave', function (e) {
          if (self.held[action]) up(e);
        });
      })(buttons[i]);
    }
  };

  /**
   * 取本帧的输入。读完 pressed 会被清空, 所以一帧只能读一次。
   */
  Input.prototype.read = function () {
    var h = this.held;
    var p = this.pressed;

    var steer = 0;
    if (h.left) steer -= 1;
    if (h.right) steer += 1;

    var out = {
      throttle: this.autoThrottle ? !h.brake : !!h.throttle,
      brake: !!h.brake,
      steer: steer,
      // 攻击是单次触发, 按住不会连发
      punchLeft: !!p.punchLeft,
      punchRight: !!p.punchRight,
      kickLeft: !!p.kickLeft,
      kickRight: !!p.kickRight
    };

    this.pressed = {};
    return out;
  };

  Input.prototype.reset = function () {
    this.held = {};
    this.pressed = {};
  };

  Input.prototype.destroy = function () {
    doc.removeEventListener('keydown', this.keyDown);
    doc.removeEventListener('keyup', this.keyUp);
    global.removeEventListener('blur', this.blur);
  };

  MB.Input = Input;
  MB.KEYMAP = KEYMAP;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/* 界面层: 页面切换、HUD 刷新、赛道/车库列表、结算弹层。 */
(function (global) {
  'use strict';

  var MB = global.MB;
  var CONFIG = MB.CONFIG;
  var TRACKS = MB.TRACKS;
  var BIKES = MB.BIKES;
  var Util = MB.Util;
  var Sprites = MB.Sprites;
  var doc = global.document;

  function el(id) { return doc.getElementById(id); }

  var UI = {
    current: 'loading',
    onAction: null      // main.js 挂上来, 接管弹层按钮
  };

  /* ---------------- 页面切换 ---------------- */

  UI.show = function (name) {
    var screens = doc.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++) {
      screens[i].classList.toggle('is-active', screens[i].id === 'screen-' + name);
    }
    UI.current = name;
    if (name === 'tracks') UI.renderTracks();
    if (name === 'garage') UI.renderGarage();
    if (name === 'home') UI.renderHome();
  };

  /* ---------------- 主菜单 ---------------- */

  UI.renderHome = function () {
    var save = MB.Save;
    el('homeCash').textContent = save.cash();
    el('homeDone').textContent = save.clearedCount();
    el('homeTotal').textContent = TRACKS.length;
  };

  UI.updateSoundChips = function () {
    var Sound = MB.Sound;
    var sfx = el('btnSfx');
    sfx.textContent = Sound.sfxOn ? '音效 开' : '音效 关';
    sfx.classList.toggle('is-off', !Sound.sfxOn);
    var eng = el('btnEngine');
    eng.textContent = Sound.engineOn ? '引擎声 开' : '引擎声 关';
    eng.classList.toggle('is-off', !Sound.engineOn);
  };

  /* ---------------- 赛道列表 ---------------- */

  UI.renderTracks = function () {
    var save = MB.Save;
    var unlocked = save.unlockedTracks();
    var html = '';

    for (var i = 0; i < TRACKS.length; i++) {
      var t = TRACKS[i];
      var locked = i > unlocked;
      var best = save.bestRank(t.id);
      var badge = locked ? '未解锁'
        : (best ? Util.ordinal(best) : '未完赛');

      html += '<button class="card' + (locked ? ' is-locked' : '') + '"' +
        (locked ? ' disabled' : ' data-track="' + t.id + '"') + '>' +
        '<canvas class="card-thumb" data-scene="' + t.scene + '" width="128" height="92"></canvas>' +
        '<div class="card-body">' +
          '<div class="card-title">' + t.name + '</div>' +
          '<div class="card-desc">' + (locked ? '先跑完上一条赛道' : t.desc) + '</div>' +
          '<div class="card-meta">全长 ' + Math.round(t.length * CONFIG.segmentLength / 1000) +
            ' 公里 · 对手 ' + CONFIG.rivalCount + ' 人 · 冠军奖金 <b>' + t.reward + '</b></div>' +
        '</div>' +
        '<div class="card-badge">' + badge + '</div>' +
        '</button>';
    }

    el('trackList').innerHTML = html;
    el('trackCash').textContent = save.cash();
    paintThumbs();
  };

  /** 赛道缩略图: 用各自的配色画一小段路, 比纯色块好认。 */
  function paintThumbs() {
    var canvases = doc.querySelectorAll('.card-thumb[data-scene]');
    for (var i = 0; i < canvases.length; i++) {
      var c = canvases[i];
      var pal = MB.PALETTES[c.getAttribute('data-scene')] || MB.PALETTES.coast;
      var ctx = c.getContext('2d');
      var w = c.width, h = c.height;

      var sky = ctx.createLinearGradient(0, 0, 0, h * 0.6);
      sky.addColorStop(0, pal.sky[0]);
      sky.addColorStop(1, pal.sky[1]);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = pal.hill;
      ctx.beginPath();
      ctx.moveTo(0, h * 0.55);
      ctx.lineTo(w * 0.3, h * 0.38);
      ctx.lineTo(w * 0.55, h * 0.5);
      ctx.lineTo(w * 0.8, h * 0.34);
      ctx.lineTo(w, h * 0.5);
      ctx.lineTo(w, h * 0.6);
      ctx.lineTo(0, h * 0.6);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = pal.grass[0];
      ctx.fillRect(0, h * 0.55, w, h * 0.45);

      // 一条往远处收的路
      ctx.fillStyle = pal.road[0];
      ctx.beginPath();
      ctx.moveTo(w * 0.42, h * 0.55);
      ctx.lineTo(w * 0.58, h * 0.55);
      ctx.lineTo(w * 1.05, h);
      ctx.lineTo(w * -0.05, h);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = pal.rumble[1];
      ctx.fillRect(w * 0.47, h * 0.7, w * 0.06, h * 0.08);
      ctx.fillRect(w * 0.46, h * 0.88, w * 0.08, h * 0.1);
    }
  }

  /* ---------------- 车库 ---------------- */

  UI.renderGarage = function () {
    var save = MB.Save;
    var owned = save.ownedBikes();
    var current = save.currentBike();
    var cash = save.cash();
    var html = '';

    for (var i = 0; i < BIKES.length; i++) {
      var b = BIKES[i];
      var have = owned.indexOf(b.id) >= 0;
      var isCurrent = current === b.id;
      var afford = cash >= b.price;

      var badge = isCurrent ? '使用中'
        : (have ? '选它' : (afford ? ('¥' + b.price) : ('差 ' + (b.price - cash))));

      html += '<button class="card' + (isCurrent ? ' is-owned' : '') +
        (!have && !afford ? ' is-locked' : '') + '"' +
        ' data-bike="' + b.id + '">' +
        '<canvas class="card-thumb" data-bike-color="' + b.color + '" width="128" height="92"></canvas>' +
        '<div class="card-body">' +
          '<div class="card-title">' + b.name + '</div>' +
          '<div class="card-desc">' + b.desc + '</div>' +
          '<div class="stat-row">' +
            statBar('极速', b.topSpeed, 1.2) +
            statBar('加速', b.accel, 1.25) +
            statBar('抗揍', b.armor, 1.5) +
          '</div>' +
        '</div>' +
        '<div class="card-badge">' + badge + '</div>' +
        '</button>';
    }

    el('bikeList').innerHTML = html;
    el('garageCash').textContent = cash;
    paintBikeThumbs();
  };

  function statBar(label, value, max) {
    var pct = Math.round(Util.clamp(value / max, 0, 1) * 100);
    return '<div class="stat">' + label + '<i><b style="width:' + pct + '%"></b></i></div>';
  }

  function paintBikeThumbs() {
    var canvases = doc.querySelectorAll('.card-thumb[data-bike-color]');
    for (var i = 0; i < canvases.length; i++) {
      var c = canvases[i];
      var ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.fillStyle = '#11141b';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.save();
      ctx.translate(c.width / 2, c.height - 8);
      ctx.scale(0.66, 0.66);
      Sprites.drawRider(ctx, {
        color: c.getAttribute('data-bike-color'), lean: 0, shadow: false
      });
      ctx.restore();
    }
  }

  /* ---------------- 比赛 HUD ---------------- */

  var hud = null;

  function hudRefs() {
    if (hud) return hud;
    hud = {
      rank: el('hudRank'), rankTotal: el('hudRankTotal'),
      time: el('hudTime'), speed: el('hudSpeed'),
      progress: el('hudProgress'), health: el('hudHealth'),
      weapon: el('hudWeapon'), weaponN: el('hudWeaponN'),
      msg: el('centerMsg')
    };
    return hud;
  }

  UI.updateHud = function (race) {
    var h = hudRefs();
    var p = race.player;

    h.rank.textContent = p.rank;
    h.rankTotal.textContent = '/' + race.riders.length;
    h.time.textContent = Util.formatTime(race.time);
    // 世界单位换成好看的数字, 纯观感, 不参与物理
    h.speed.textContent = Math.round(p.speed / 40);
    h.progress.style.width = (race.progress() * 100).toFixed(1) + '%';

    var pct = Util.clamp(p.health / CONFIG.maxHealth, 0, 1);
    h.health.style.width = (pct * 100).toFixed(0) + '%';
    h.health.classList.toggle('is-low', pct <= 0.5 && pct > 0.22);
    h.health.classList.toggle('is-crit', pct <= 0.22);

    if (p.weapon > 0) {
      h.weapon.hidden = false;
      h.weaponN.textContent = p.weapon;
    } else {
      h.weapon.hidden = true;
    }
  };

  var msgTimer = null;

  UI.centerMessage = function (text, holdMs) {
    var h = hudRefs();
    h.msg.textContent = text;
    h.msg.classList.add('is-on');
    if (msgTimer) clearTimeout(msgTimer);
    if (holdMs) {
      msgTimer = setTimeout(function () { h.msg.classList.remove('is-on'); }, holdMs);
    }
  };

  UI.hideCenterMessage = function () {
    hudRefs().msg.classList.remove('is-on');
  };

  /* ---------------- 弹层 ---------------- */

  UI.openCard = function (html) {
    el('overlayCard').innerHTML = html;
    el('overlay').classList.add('is-active');
  };

  UI.closeCard = function () {
    el('overlay').classList.remove('is-active');
  };

  UI.isCardOpen = function () {
    return el('overlay').classList.contains('is-active');
  };

  function action(name, label, cls) {
    return '<button class="btn ' + (cls || '') + '" data-action="' + name + '">' +
      label + '</button>';
  }

  UI.openHelp = function () {
    UI.openCard(
      '<h3>怎么玩</h3>' +
      '<p class="sub">跑赢他们，或者把他们全打趴下</p>' +
      '<div class="help-list">' +
        '<b>键盘</b><br>' +
        '<kbd>↑</kbd> 加速　<kbd>↓</kbd> 刹车　<kbd>←</kbd><kbd>→</kbd> 转向<br>' +
        '<kbd>Z</kbd> 左拳　<kbd>X</kbd> 右拳　<kbd>C</kbd><kbd>V</kbd> 左右飞踢<br>' +
        '<kbd>Esc</kbd> 暂停<br><br>' +
        '<b>手机</b><br>' +
        '自动给油，左下角转向，右下角刹车和拳脚。<br><br>' +
        '<b>要点</b><br>' +
        '· 只有跟对手并排时出手才打得中，空挥一样要等冷却。<br>' +
        '· 血被打空就会摔车，爬起来要好几秒，名次基本就没了。<br>' +
        '· 路边偶尔有<b>钢管</b>，捡到后几下攻击伤害翻倍。<br>' +
        '· 撞上社会车辆直接摔，冲进草地会掉速。<br>' +
        '· 拿到名次有奖金，攒钱去<b>车库</b>换车。' +
      '</div>' +
      '<div style="margin-top:16px">' + action('close', '知道了', 'btn-primary') + '</div>'
    );
  };

  UI.openPause = function () {
    UI.openCard(
      '<h3>暂停</h3>' +
      '<p class="sub">松口气，喝口水</p>' +
      action('resume', '继续比赛', 'btn-primary') +
      action('restart', '重跑本赛道') +
      action('quit', '退出到菜单', 'btn-ghost')
    );
  };

  /** 结算。名次、用时、奖金、以及全场排名表。 */
  UI.openResult = function (info) {
    var rows = '';
    for (var i = 0; i < info.standings.length; i++) {
      var r = info.standings[i];
      rows += '<div>' +
        '<span class="pos">' + (i + 1) + '</span>' +
        '<span class="dot" style="background:' + r.color + '"></span>' +
        '<span class="who' + (r.isPlayer ? ' me' : '') + '">' + r.name + '</span>' +
        '<span>' + (r.finished ? Util.formatTime(r.finishTime) : '未完赛') + '</span>' +
        '</div>';
    }

    UI.openCard(
      '<h3>' + (info.rank === 1 ? '第一个冲线' : '比赛结束') + '</h3>' +
      '<div class="result-rank">' + Util.ordinal(info.rank) + '</div>' +
      '<div class="result-rows">' +
        '<div><span>用时</span><b>' + Util.formatTime(info.time) + '</b></div>' +
        '<div><span>打趴对手</span><b>' + info.takedowns + ' 人</b></div>' +
        '<div><span>自己摔车</span><b>' + info.knockdowns + ' 次</b></div>' +
        '<div><span>奖金</span><b>+' + info.reward + '</b></div>' +
      '</div>' +
      '<div class="standings">' + rows + '</div>' +
      (info.unlocked ? '<p class="sub">解锁了新赛道：' + info.unlocked + '</p>' : '') +
      (info.nextTrack ? action('next', '下一条赛道', 'btn-primary') : '') +
      action('restart', '再跑一次', info.nextTrack ? '' : 'btn-primary') +
      action('garage', '去车库', 'btn-ghost') +
      action('quit', '回菜单', 'btn-ghost')
    );
  };

  /* ---------------- 提示条 ---------------- */

  var toastTimer = null;

  UI.toast = function (text, ms) {
    var node = el('toast');
    node.textContent = text;
    node.classList.add('is-on');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      node.classList.remove('is-on');
    }, ms || 1600);
  };

  MB.UI = UI;
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/* 启动入口: 存档、主循环、事件绑定。 */
(function (global) {
  'use strict';

  var MB = global.MB;
  var CONFIG = MB.CONFIG;
  var TRACKS = MB.TRACKS;
  var BIKES = MB.BIKES;
  var RIDERS = MB.RIDERS;
  var Util = MB.Util;
  var Storage = MB.Storage;
  var Sound = MB.Sound;
  var UI = MB.UI;
  var doc = global.document;

  function el(id) { return doc.getElementById(id); }

  /* ------------------------------------------------------------------ *
   * 存档
   * ------------------------------------------------------------------ */

  var Save = {
    cash: function () { return Storage.get('cash', 0); },
    addCash: function (n) { Storage.set('cash', Save.cash() + n); },

    // unlocked 是已解锁赛道的最大下标
    unlockedTracks: function () { return Storage.get('unlocked', 0); },

    unlockUpTo: function (index) {
      if (index > Save.unlockedTracks() && index < TRACKS.length) {
        Storage.set('unlocked', index);
        return true;
      }
      return false;
    },

    results: function () { return Storage.get('results', {}); },

    bestRank: function (trackId) {
      var r = Save.results()[trackId];
      return r ? r.rank : 0;
    },

    recordResult: function (trackId, rank, time) {
      var all = Save.results();
      var prev = all[trackId];
      // 名次优先, 名次相同再比时间
      if (!prev || rank < prev.rank || (rank === prev.rank && time < prev.time)) {
        all[trackId] = { rank: rank, time: time };
        Storage.set('results', all);
      }
    },

    clearedCount: function () {
      var all = Save.results();
      var n = 0;
      for (var k in all) {
        if (Object.prototype.hasOwnProperty.call(all, k)) n++;
      }
      return n;
    },

    ownedBikes: function () { return Storage.get('bikes', ['scrap']); },

    buyBike: function (id) {
      var bike = BIKES.filter(function (b) { return b.id === id; })[0];
      if (!bike) return false;
      var owned = Save.ownedBikes();
      if (owned.indexOf(id) >= 0) return true;
      if (Save.cash() < bike.price) return false;
      Storage.set('cash', Save.cash() - bike.price);
      owned.push(id);
      Storage.set('bikes', owned);
      return true;
    },

    currentBike: function () { return Storage.get('bike', 'scrap'); },
    setBike: function (id) { Storage.set('bike', id); }
  };

  MB.Save = Save;

  /* ------------------------------------------------------------------ *
   * 比赛流程
   * ------------------------------------------------------------------ */

  var state = {
    race: null,
    renderer: null,
    input: null,
    trackIndex: 0,
    running: false,
    paused: false,
    lastTime: 0,
    raf: 0
  };

  function bikeById(id) {
    return BIKES.filter(function (b) { return b.id === id; })[0] || BIKES[0];
  }

  function startRace(trackIndex) {
    var def = TRACKS[trackIndex];
    state.trackIndex = trackIndex;

    var track = new MB.Track(def);
    var bike = bikeById(Save.currentBike());

    state.race = new MB.Race({
      track: track,
      bike: bike,
      riders: RIDERS.slice(0, CONFIG.rivalCount),
      seed: def.seed + 7,
      rivalSkill: def.rivalSkill,
      rivalRage: def.rivalRage,
      trafficDensity: def.traffic,
      countdown: 3.2
    });

    state.renderer = new MB.Renderer(el('view'), track);
    state.input.reset();
    state.paused = false;

    UI.show('race');
    // 切到比赛页之后 canvas 才有尺寸, 这时候量才准
    state.renderer.resize();
    UI.updateHud(state.race);
    UI.centerMessage('3');

    Sound.unlock();
    Sound.startEngine();

    state.lastTime = 0;
    state.running = true;
    if (!state.raf) state.raf = requestAnimationFrame(loop);

    global.__MB_RACE = state.race;   // 测试脚本用
  }

  function quitRace() {
    state.running = false;
    state.race = null;
    Sound.stopEngine();
    UI.hideCenterMessage();
    UI.closeCard();
    UI.show('home');
  }

  /* ---------------- 主循环 ---------------- */

  var lastCountdownShown = -1;

  function loop(now) {
    state.raf = requestAnimationFrame(loop);
    if (!state.running || !state.race) return;

    if (!state.lastTime) state.lastTime = now;
    // 夹住 dt: 切后台回来时一次跳几秒会直接穿过交通车
    var dt = Math.min((now - state.lastTime) / 1000, 1 / 30);
    state.lastTime = now;

    var race = state.race;

    if (!state.paused) {
      var input = state.input.read();
      race.__braking = input.brake;

      if (race.state === 'countdown') {
        var n = Math.ceil(race.countdown);
        if (n !== lastCountdownShown) {
          lastCountdownShown = n;
          if (n > 0) {
            UI.centerMessage(String(n));
            Sound.beep(false);
          }
        }
      }

      race.update(dt, input);
      handleEvents(race);

      if (race.state === 'racing') {
        var seg = race.track.segmentAt(race.player.z);
        state.renderer.updateParallax(dt, seg.curve, race.player.speedPercent());
      }

      UI.updateHud(race);
    }

    state.renderer.render(race, now / 1000);

    Sound.engineUpdate(race.player.speedPercent(),
      !!race.__braking === false, race.player.isDown());
  }

  /** 消费本帧事件: 放音效、抖屏、弹提示。 */
  function handleEvents(race) {
    for (var i = 0; i < race.events.length; i++) {
      var ev = race.events[i];
      switch (ev.type) {
        case 'go':
          UI.centerMessage('冲！', 700);
          Sound.beep(true);
          break;
        case 'hit':
          if (ev.rider.isPlayer) {
            (ev.kind === 'kick' ? Sound.kick : Sound.punch)();
          } else if (ev.target.isPlayer) {
            (ev.kind === 'kick' ? Sound.kick : Sound.punch)();
            state.renderer.addShake(0.5);
          }
          break;
        case 'whiff':
          if (ev.rider.isPlayer) Sound.whiff();
          break;
        case 'takedown':
          Sound.takedown();
          if (ev.rider.isPlayer) {
            UI.toast(ev.target.name + ' 被你打下车了');
          } else if (ev.target.isPlayer) {
            state.renderer.addShake(1);
            UI.centerMessage('摔车！', 1200);
          }
          break;
        case 'crash':
          if (ev.rider.isPlayer) {
            Sound.crash();
            state.renderer.addShake(1);
            UI.centerMessage(ev.cause === 'traffic' ? '撞车！' : '冲出赛道！', 1200);
          }
          break;
        case 'pickup':
          if (ev.rider.isPlayer) {
            Sound.pickup();
            UI.toast('捡到钢管，接下来几下更疼');
          }
          break;
        case 'finish':
          finishRace();
          break;
      }
    }
  }

  function finishRace() {
    state.running = false;
    Sound.stopEngine();
    Sound.finish();
    UI.hideCenterMessage();

    var race = state.race;
    var def = TRACKS[state.trackIndex];
    var rank = race.player.rank;

    // 奖金: 冠军拿全额, 往后递减, 前三名之外只有辛苦费
    var payout = [1, 0.6, 0.35, 0.15, 0.08, 0.05][rank - 1] || 0.05;
    var reward = Math.round(def.reward * payout);
    Save.addCash(reward);
    Save.recordResult(def.id, rank, race.player.finishTime);

    // 拿到前三才解锁下一条
    var unlockedName = null;
    if (rank <= 3 && Save.unlockUpTo(state.trackIndex + 1)) {
      unlockedName = TRACKS[state.trackIndex + 1].name;
    }

    var hasNext = state.trackIndex + 1 < TRACKS.length &&
      Save.unlockedTracks() >= state.trackIndex + 1;

    UI.openResult({
      rank: rank,
      time: race.player.finishTime,
      takedowns: race.player.takedowns,
      knockdowns: race.player.knockdowns,
      reward: reward,
      unlocked: unlockedName,
      nextTrack: hasNext,
      standings: race.updateRanks()
    });
  }

  /* ------------------------------------------------------------------ *
   * 事件绑定
   * ------------------------------------------------------------------ */

  function pauseRace() {
    if (!state.running || state.paused) return;
    state.paused = true;
    UI.openPause();
  }

  function resumeRace() {
    state.paused = false;
    state.lastTime = 0;       // 别把暂停那段时间算进 dt
    UI.closeCard();
  }

  function bindEvents() {
    el('btnRace').addEventListener('click', function () {
      Sound.unlock(); Sound.click();
      UI.show('tracks');
    });
    el('btnGarage').addEventListener('click', function () {
      Sound.unlock(); Sound.click();
      UI.show('garage');
    });
    el('btnHelp').addEventListener('click', function () {
      Sound.unlock(); Sound.click();
      UI.openHelp();
    });

    el('btnSfx').addEventListener('click', function () {
      Sound.sfxOn = !Sound.sfxOn;
      Storage.set('sfx', Sound.sfxOn);
      UI.updateSoundChips();
      Sound.click();
    });
    el('btnEngine').addEventListener('click', function () {
      Sound.engineOn = !Sound.engineOn;
      Storage.set('engine', Sound.engineOn);
      UI.updateSoundChips();
      Sound.click();
    });

    el('btnPause').addEventListener('click', pauseRace);

    // 返回箭头
    var navs = doc.querySelectorAll('[data-nav]');
    for (var i = 0; i < navs.length; i++) {
      navs[i].addEventListener('click', function () {
        Sound.click();
        UI.show(this.getAttribute('data-nav'));
      });
    }

    // 赛道列表
    el('trackList').addEventListener('click', function (e) {
      var node = e.target;
      while (node && node !== this && !node.getAttribute('data-track')) node = node.parentNode;
      if (!node || node === this) return;
      var id = node.getAttribute('data-track');
      var index = 0;
      for (var k = 0; k < TRACKS.length; k++) if (TRACKS[k].id === id) index = k;
      Sound.click();
      startRace(index);
    });

    // 车库
    el('bikeList').addEventListener('click', function (e) {
      var node = e.target;
      while (node && node !== this && !node.getAttribute('data-bike')) node = node.parentNode;
      if (!node || node === this) return;
      var id = node.getAttribute('data-bike');
      var owned = Save.ownedBikes();

      if (owned.indexOf(id) >= 0) {
        Save.setBike(id);
        Sound.click();
        UI.toast('换好了');
      } else if (Save.buyBike(id)) {
        Save.setBike(id);
        Sound.pickup();
        UI.toast('买下了，已经骑上');
      } else {
        Sound.whiff();
        UI.toast('钱还不够');
        return;
      }
      UI.renderGarage();
    });

    // 弹层按钮
    el('overlay').addEventListener('click', function (e) {
      var node = e.target;
      while (node && node !== this && !node.getAttribute('data-action')) node = node.parentNode;
      if (!node || node === this) return;
      var act = node.getAttribute('data-action');
      Sound.click();

      switch (act) {
        case 'close': UI.closeCard(); break;
        case 'resume': resumeRace(); break;
        case 'restart': UI.closeCard(); startRace(state.trackIndex); break;
        case 'next': UI.closeCard(); startRace(state.trackIndex + 1); break;
        case 'garage': UI.closeCard(); state.running = false; UI.show('garage'); break;
        case 'quit': quitRace(); break;
      }
    });

    global.addEventListener('resize', function () {
      if (state.renderer) state.renderer.resize();
    });

    // 切后台自动暂停, 回来不至于已经撞死了
    doc.addEventListener('visibilitychange', function () {
      if (doc.hidden && state.running && !state.paused) pauseRace();
    });
  }

  /* ------------------------------------------------------------------ *
   * 启动
   * ------------------------------------------------------------------ */

  function boot() {
    var fill = el('loadFill');
    var tip = el('loadTip');

    Sound.sfxOn = Storage.get('sfx', true);
    Sound.engineOn = Storage.get('engine', true);
    Sound.init();

    // 触屏设备默认自动给油: 一只手同时管方向和拳脚已经忙不过来了
    var touch = ('ontouchstart' in global) || navigator.maxTouchPoints > 0;
    state.input = new MB.Input({ autoThrottle: touch, onPause: pauseRace });
    state.input.bindTouch(el('touchPad'));

    bindEvents();

    // 预生成第一条赛道。几千段的数组构建要几十毫秒, 提前做掉,
    // 免得点「开始」之后卡一下
    fill.style.width = '40%';
    tip.textContent = '正在铺路…';

    setTimeout(function () {
      try {
        new MB.Track(TRACKS[0]);
      } catch (e) {
        tip.textContent = '赛道生成失败：' + e.message;
        return;
      }
      fill.style.width = '100%';
      tip.textContent = '准备就绪';

      setTimeout(function () {
        UI.updateSoundChips();
        UI.show('home');
        global.__MB_READY = true;
      }, 180);
    }, 60);
  }

  if (doc.readyState === 'loading') {
    doc.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  MB.__state = state;          // 测试脚本用
  MB.startRace = startRace;
})(typeof window !== 'undefined' ? window : this);

</script>
</body>
</html>
