/* ---------- 屏幕切换 ---------- */

.screen {
  position: absolute;
  inset: 0;
  top: 0; right: 0; bottom: 0; left: 0;
  display: none;
  flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px
           calc(env(safe-area-inset-bottom, 0px) + 10px);
}

.screen.is-active {
  display: flex;
}

/* ---------- 加载页 ---------- */

#screen-loading {
  align-items: center;
  justify-content: center;
}

.loading-box {
  width: 100%;
  max-width: 320px;
  text-align: center;
}

.loading-title,
.game-title {
  font-size: 34px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #fff;
  text-shadow: 0 2px 0 #ff86c0, 0 5px 0 #e2569f, 0 9px 18px rgba(180, 60, 130, 0.4);
}

.loading-title em,
.game-title em {
  display: block;
  font-style: normal;
  font-size: 26px;
  margin-top: 4px;
  color: #fffbe6;
  text-shadow: 0 2px 0 #ffb43d, 0 5px 0 #e08a10, 0 9px 16px rgba(180, 110, 20, 0.35);
}

.loading-bar {
  margin: 26px auto 12px;
  width: 100%;
  height: 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.55);
  box-shadow: inset 0 2px 5px rgba(150, 80, 130, 0.25);
  overflow: hidden;
}

.loading-bar i {
  display: block;
  width: 0;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #ffd36e, #ff85bd, #b184ff);
  transition: width 0.25s ease;
}

.loading-tip {
  font-size: 14px;
  color: #7c3f75;
  font-weight: 600;
}

/* ---------- 首页 ---------- */

#screen-home {
  justify-content: space-between;
  align-items: center;
  text-align: center;
}

.home-top { padding-top: 6px; }

.game-sub {
  margin-top: 10px;
  font-size: 14px;
  font-weight: 600;
  color: #7c3f75;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
}

.home-pets {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  justify-items: center;
  gap: 4px 8px;
  width: 100%;
  max-width: 290px;
}

.home-pets img {
  width: 22vw;
  max-width: 88px;
  filter: drop-shadow(0 5px 8px rgba(150, 70, 120, 0.3));
  animation: bob 2.6s ease-in-out infinite;
}

.home-pets img:nth-child(2n) { animation-delay: 0.35s; }
.home-pets img:nth-child(3n) { animation-delay: 0.7s; }

@keyframes bob {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50%      { transform: translateY(-7px) rotate(2deg); }
}

.home-actions {
  width: 100%;
  max-width: 300px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.home-foot {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.home-progress {
  font-size: 13px;
  font-weight: 700;
  color: #7c3f75;
}

.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

.chip {
  border: 0;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  color: #7c3f75;
  padding: 7px 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.72);
  box-shadow: 0 3px 0 rgba(190, 120, 170, 0.35);
}

.chip.is-off {
  color: #b48ea9;
  background: rgba(255, 255, 255, 0.42);
}

.chip.is-busy {
  color: #b48ea9;
  animation: chip-pulse 0.9s ease-in-out infinite;
}

@keyframes chip-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

/* ---------- 按钮 ---------- */

.btn {
  display: block;
  width: 100%;
  border: 0;
  font: inherit;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 1px;
  color: #7a3a72;
  padding: 14px 18px;
  border-radius: 18px;
  background: linear-gradient(180deg, #ffffff, #ffe9f5);
  box-shadow: 0 5px 0 rgba(200, 130, 180, 0.5), 0 10px 18px rgba(160, 80, 140, 0.2);
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}

.btn:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 rgba(200, 130, 180, 0.5);
}

.btn-primary {
  color: #fff;
  background: linear-gradient(180deg, #ff9ecd, #f664a8);
  box-shadow: 0 5px 0 #d43e8b, 0 10px 20px rgba(200, 50, 130, 0.35);
}

.btn-primary:active { box-shadow: 0 1px 0 #d43e8b; }

.btn-ghost {
  font-size: 15px;
  padding: 11px 18px;
  color: #7c3f75;
  background: rgba(255, 255, 255, 0.55);
  box-shadow: 0 4px 0 rgba(190, 120, 170, 0.3);
}

.icon-btn {
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  border: 0;
  font: inherit;
  font-size: 20px;
  font-weight: 900;
  line-height: 1;
  color: #7a3a72;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.8);
  box-shadow: 0 3px 0 rgba(190, 120, 170, 0.4);
}

.icon-btn:active { transform: translateY(2px); box-shadow: none; }
.icon-btn.is-ghost { background: none; box-shadow: none; }

/* ---------- 关卡选择 ---------- */

.page-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.page-head h2 {
  font-size: 20px;
  font-weight: 900;
  color: #fff;
  text-shadow: 0 2px 0 #ff86c0, 0 4px 10px rgba(180, 60, 130, 0.35);
}

.level-grid {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding-bottom: 10px;
}

.chapter-head {
  grid-column: 1 / -1;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 10px 4px 2px;
}

.chapter-head:first-child { padding-top: 0; }

.chapter-head b {
  font-size: 15px;
  font-weight: 900;
  color: #b83f86;
}

.chapter-head span {
  font-size: 12px;
  color: #ffc32e;
  font-weight: 700;
}

.chapter-head.is-locked b { color: #b48ea9; }
.chapter-head.is-locked span { color: #cdb6c7; }

.level-card {
  position: relative;
  border: 0;
  font: inherit;
  padding: 12px 6px 10px;
  border-radius: 18px;
  background: linear-gradient(180deg, #ffffff, #ffeaf6);
  box-shadow: 0 4px 0 rgba(200, 130, 180, 0.45);
  text-align: center;
}

.level-card:active { transform: translateY(3px); box-shadow: none; }

.level-card b {
  display: block;
  font-size: 22px;
  font-weight: 900;
  color: #e2569f;
}

.level-card small {
  display: block;
  margin-top: 2px;
  font-size: 11px;
  color: #9c6a94;
}

.level-card .stars {
  margin-top: 5px;
  font-size: 13px;
  letter-spacing: 1px;
  color: #dfc9dc;
}

.level-card .stars i {
  font-style: normal;
  color: #ffc32e;
}

/* 当前该打的那一关, 打开关卡页时会自动滚到这里 */
.level-card.is-current {
  background: linear-gradient(180deg, #fff6fb, #ffd3ea);
  box-shadow: 0 4px 0 rgba(200, 130, 180, 0.45), 0 0 0 3px #ff74b3;
}

.level-card.is-locked {
  background: rgba(255, 255, 255, 0.4);
  box-shadow: none;
}

.level-card.is-locked b,
.level-card.is-locked small { color: #b48ea9; }

/* ---------- 游戏页 HUD ---------- */

#screen-game { padding-left: 10px; padding-right: 10px; }

.hud {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 8px 10px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.55);
  box-shadow: 0 3px 10px rgba(160, 90, 140, 0.18);
}

.hud-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.hud-level {
  font-size: 15px;
  font-weight: 800;
  color: #7a3a72;
}

.hud-level b { font-size: 19px; color: #e2569f; }

.hud-moves,
.hud-score {
  display: flex;
  align-items: baseline;
  gap: 5px;
}

.hud-moves i,
.hud-score i {
  font-style: normal;
  font-size: 11px;
  font-weight: 700;
  color: #9c6a94;
}

.hud-moves b,
.hud-score b {
  font-size: 20px;
  font-weight: 900;
  color: #7a3a72;
  font-variant-numeric: tabular-nums;
}

.hud-moves.is-low b { color: #f6425a; }

.star-bar {
  position: relative;
  flex: 1;
  height: 16px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.85);
  box-shadow: inset 0 2px 4px rgba(150, 80, 130, 0.2);
  overflow: visible;
}

.star-bar-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 0;
  border-radius: 999px;
  background: linear-gradient(90deg, #ffd36e, #ff85bd, #b184ff);
  transition: width 0.3s ease;
}

.star-node {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  font-size: 15px;
  line-height: 1;
  color: #e3cfe0;
  text-shadow: 0 1px 2px rgba(120, 60, 100, 0.25);
}

.star-node[data-index="0"] { left: 40%; }
.star-node[data-index="1"] { left: 66.6%; }
.star-node[data-index="2"] { left: 96%; }

.star-node.is-on {
  color: #ffc32e;
  transform: translate(-50%, -50%) scale(1.35);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.goals {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
}

.goal {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px 3px 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.85);
  box-shadow: 0 2px 0 rgba(190, 120, 170, 0.3);
}

.goal img { width: 26px; height: 26px; }

.goal span {
  font-size: 13px;
  font-weight: 800;
  color: #7a3a72;
  font-variant-numeric: tabular-nums;
}

.goal.is-done { background: rgba(111, 221, 138, 0.9); }
.goal.is-done span { color: #14603a; }

/* ---------- 棋盘 ---------- */

.board-wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 0;
}

#board {
  display: block;
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.18);
  box-shadow: 0 8px 24px rgba(140, 70, 130, 0.28), inset 0 0 0 3px rgba(255, 255, 255, 0.5);
  touch-action: none;
}

/* ---------- 道具栏 ---------- */

.props {
  display: flex;
  gap: 8px;
}

.prop {
  position: relative;
  flex: 1;
  border: 0;
  font: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding: 8px 4px 7px;
  border-radius: 16px;
  background: linear-gradient(180deg, #ffffff, #ffeaf6);
  box-shadow: 0 4px 0 rgba(200, 130, 180, 0.45);
}

.prop:active { transform: translateY(3px); box-shadow: none; }

.prop-icon { font-size: 20px; line-height: 1; }

.prop-name {
  font-size: 12px;
  font-weight: 800;
  color: #7a3a72;
}

.prop-count {
  position: absolute;
  top: -5px;
  right: -3px;
  min-width: 21px;
  padding: 1px 5px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 900;
  color: #fff;
  background: #f664a8;
  box-shadow: 0 2px 4px rgba(190, 50, 120, 0.4);
}

.prop.is-empty { opacity: 0.45; }
.prop.is-active {
  background: linear-gradient(180deg, #fff6b0, #ffd36e);
  box-shadow: 0 0 0 3px #ffb43d, 0 4px 0 rgba(200, 130, 180, 0.45);
}

/* ---------- 弹层 ---------- */

.overlay {
  position: absolute;
  inset: 0;
  top: 0; right: 0; bottom: 0; left: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(70, 30, 70, 0.55);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  z-index: 20;
}

.overlay.is-active { display: flex; }

.card {
  width: 100%;
  max-width: 320px;
  max-height: 100%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 22px 20px 20px;
  border-radius: 24px;
  text-align: center;
  background: linear-gradient(180deg, #ffffff, #ffeef7);
  box-shadow: 0 14px 34px rgba(90, 30, 80, 0.4);
  animation: pop-in 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes pop-in {
  from { transform: scale(0.8); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

.card h3 {
  font-size: 24px;
  font-weight: 900;
  color: #e2569f;
}

.card .card-sub {
  margin-top: 6px;
  font-size: 14px;
  font-weight: 600;
  color: #8a5484;
}

.card-stars {
  margin: 14px 0 6px;
  font-size: 40px;
  letter-spacing: 6px;
  color: #e3cfe0;
}

.card-stars i {
  font-style: normal;
  display: inline-block;
  color: #ffc32e;
  animation: star-pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

.card-stars i:nth-child(2) { animation-delay: 0.15s; }
.card-stars i:nth-child(3) { animation-delay: 0.3s; }

@keyframes star-pop {
  from { transform: scale(0) rotate(-40deg); }
  to   { transform: scale(1) rotate(0); }
}

.card-score {
  font-size: 30px;
  font-weight: 900;
  color: #7a3a72;
  font-variant-numeric: tabular-nums;
}

.card-actions {
  margin-top: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.card-help {
  text-align: left;
  font-size: 13.5px;
  line-height: 1.8;
  color: #6d4069;
}

.card-help h4 {
  margin: 12px 0 2px;
  font-size: 15px;
  color: #e2569f;
}

.card-help ul { padding-left: 18px; }
.card-help li { margin: 2px 0; }

.card-help .legend {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 6px 0;
}

.card-help .legend img { width: 34px; height: 34px; }

/* ---------- 提示条 ---------- */

.toast {
  position: absolute;
  left: 50%;
  top: 26%;
  transform: translate(-50%, -6px);
  max-width: 78%;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 800;
  color: #fff;
  background: rgba(90, 40, 90, 0.88);
  box-shadow: 0 6px 18px rgba(70, 20, 60, 0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 30;
}

.toast.is-show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ---------- 横屏提示 ---------- */

.rotate-hint {
  display: none;
  position: absolute;
  inset: 0;
  top: 0; right: 0; bottom: 0; left: 0;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 900;
  color: #fff;
  background: rgba(70, 30, 70, 0.92);
  z-index: 40;
}

@media (orientation: landscape) and (max-height: 500px) {
  .rotate-hint { display: flex; }
}

/* 小屏机型收紧一点间距 */
@media (max-height: 640px) {
  .loading-title, .game-title { font-size: 28px; }
  .loading-title em, .game-title em { font-size: 21px; }
  .home-pets img { max-width: 68px; }
  .btn { font-size: 16px; padding: 12px 16px; }
  .goal img { width: 22px; height: 22px; }
}

</style>
</head>

<div id="app">

  <!-- 加载中 -->
  <section class="screen is-active" id="screen-loading">
    <div class="loading-box">
      <div class="loading-title">奇妙萌可<em>消消乐</em></div>
      <div class="loading-bar"><i id="loadingFill"></i></div>
      <p class="loading-tip" id="loadingTip">正在召唤魔法萌宠…</p>
    </div>
  </section>

  <!-- 首页 -->
  <section class="screen" id="screen-home">
    <div class="home-top">
      <h1 class="game-title">奇妙萌可<em>消消乐</em></h1>
      <p class="game-sub">三只相同萌宠连成一线，就能施展魔法！</p>
    </div>
    <div class="home-pets" id="homePets"></div>
    <div class="home-actions">
      <button class="btn btn-primary" id="btnPlay">开始游戏</button>
      <button class="btn" id="btnLevels">选择关卡</button>
      <button class="btn btn-ghost" id="btnHowTo">玩法说明</button>
    </div>
    <div class="home-foot">
      <p class="home-progress" id="homeProgress"></p>
      <div class="chips">
        <button class="chip" id="btnSfx">音效</button>
        <button class="chip" id="btnBgm">音乐</button>
        <button class="chip" id="btnSkin">形象</button>
        <button class="chip" id="btnShare">分享</button>
      </div>
    </div>
  </section>

  <!-- 关卡选择 -->
  <section class="screen" id="screen-levels">
    <header class="page-head">
      <button class="icon-btn" data-nav="home">‹</button>
      <h2>选择关卡</h2>
      <span class="icon-btn is-ghost"></span>
    </header>
    <div class="level-grid scrollable" id="levelGrid"></div>
  </section>

  <!-- 游戏 -->
  <section class="screen" id="screen-game">
    <div class="hud">
      <div class="hud-line">
        <button class="icon-btn" id="btnPause">‖</button>
        <div class="hud-level">第 <b id="hudLevel">1</b> 关</div>
        <div class="hud-moves"><i>剩余步数</i><b id="hudMoves">0</b></div>
      </div>
      <div class="hud-line">
        <div class="hud-score"><i>分数</i><b id="hudScore">0</b></div>
        <div class="star-bar">
          <div class="star-bar-fill" id="starFill"></div>
          <span class="star-node" data-index="0">★</span>
          <span class="star-node" data-index="1">★</span>
          <span class="star-node" data-index="2">★</span>
        </div>
      </div>
      <div class="goals" id="hudGoals"></div>
    </div>

    <div class="board-wrap" id="boardWrap">
      <canvas id="board"></canvas>
    </div>

    <div class="props">
      <button class="prop" id="propHammer">
        <span class="prop-icon">🔨</span><span class="prop-name">魔法锤</span><b class="prop-count" id="countHammer">0</b>
      </button>
      <button class="prop" id="propShuffle">
        <span class="prop-icon">🔄</span><span class="prop-name">重新洗牌</span><b class="prop-count" id="countShuffle">0</b>
      </button>
      <button class="prop" id="propHint">
        <span class="prop-icon">💡</span><span class="prop-name">找一找</span>
      </button>
    </div>
  </section>

  <!-- 弹层 -->
  <div class="overlay" id="overlay">
    <div class="card" id="overlayCard"></div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="rotate-hint">请将手机竖屏使用 📱</div>
</div>

  /* ---------------- 关卡 ---------------- *
   *
   * 100 关分 10 章, 每章 10 关。关卡不是手写死的, 而是按下面几条曲线算出来:
   *
   *   types  本关出现几种角色。种类越少越容易凑三连。
   *   moves  可用步数, 随进度从 27 收到 18。
   *   collect 收集目标, 通关条件就是把它们全收齐(目标分只决定几颗星)。
   *   target 目标分, 达标 2 星, 1.5 倍 3 星。
   *
   * 数值是拿 tools/balance.js 跑机器对局配出来的, 改动后请重新跑一遍,
   * 确认通关率仍然是「从接近 100% 平缓下滑」而不是某关突然掉下去。
   */
  var LEVEL_COUNT = 100;
  var CHAPTER_SIZE = 10;

  // 每 10 关一章, 关卡选择页按章分组, 给小孩一个「又翻过一页」的盼头
  var CHAPTER_NAMES = [
    '初识萌可', '魔法森林', '星光草原', '云朵小镇', '彩虹湖畔',
    '糖果乐园', '月光城堡', '梦境花园', '极光雪原', '萌可王国'
  ];

  // 每章 10 关各自要收集几种角色, 写成图案方便一眼看出节奏。
  // 同章里穿插 1/2/3 种, 相邻关卡的感觉才不会雷同。
  var COLLECT_KINDS = [
    '1111211121',
    '1112112121',
    '1121221221',
    '2122122122',
    '2212232122',
    '2223222322',
    '2232232323',
    '3223232332',
    '3232333233',
    '3233233333'
  ];

  // 一步平均能消掉某个指定角色几个、能拿多少分。这两张表是
  // `node tools/balance.js --calibrate` 实测出来的, 不要凭感觉改。
  //
  // 角色种类少一个, 连锁会猛很多: 5 种时的速率是 6 种的近两倍,
  // 所以「喘息关」用 5 种, 但它的收集量和目标分都得按自己这档算,
  // 否则会变成白送的一关。(4 种更夸张, 一步能消 7 个多, 已经弃用。)
  var YIELD_PER_MOVE = { 5: 2.44, 6: 1.27 };
  var SCORE_PER_MOVE = { 5: 1095, 6: 587 };

  // 要收集的种类越多, 越要等最慢的那一种凑齐, 实际比「每种各算一遍」更难。
  // 不补这个系数的话, 3 种目标的关卡会比左右邻居低十几个百分点的通关率。
  var KIND_RELIEF = { 1: 1, 2: 0.97, 3: 0.90 };

  function buildLevels() {
    var levels = [];

    for (var i = 0; i < LEVEL_COUNT; i++) {
      var chapter = Math.floor(i / CHAPTER_SIZE);
      var step = i % CHAPTER_SIZE;
      var t = i / (LEVEL_COUNT - 1);          // 0~1 的总进度

      // 第一章全用 5 种当上手期; 之后每章第 5 关回落一档, 当作喘口气的关卡
      var types = (i < CHAPTER_SIZE || step === 4) ? 5 : 6;

      // 步数整体递减, 每章第一关多给两步, 让新章节开头不至于一上来就紧。
      // 注意收集量要按 baseMoves 算 —— 拿 moves 算的话, 多给的两步会同时
      // 把目标抬高, 白送的两步就没了, 开场关反而成了全章最难的。
      var baseMoves = Math.round(27 - 9 * t);
      var moves = baseMoves + (step === 0 ? 2 : 0);

      // pressure: 预计要用掉多少比例的步数, 也就是这一关有多紧
      var pressure = 0.45 + 0.31 * t;
      var budget = baseMoves * pressure;
      var kinds = parseInt(COLLECT_KINDS[chapter].charAt(step), 10);
      var count = Math.round(budget * YIELD_PER_MOVE[types] * KIND_RELIEF[kinds]);

      // 目标分按预计得分反推: 打得顺手就是 3 星, 勉强收齐是 2 星
      var target = Math.round(budget * SCORE_PER_MOVE[types] * (0.62 + 0.14 * t) / 100) * 100;

      // 起始角色按关卡号轮换, 免得整章都在收集同一只;
      // 同关的几个目标取连续下标, 保证互不重复
      var base = (i * 2 + chapter) % types;
      var collect = [];
      for (var k = 0; k < kinds; k++) {
        collect.push({ type: (base + k) % types, count: count });
      }

      levels.push({ types: types, moves: moves, target: target, collect: collect });
    }

    return levels;
  }

  var LEVELS = buildLevels();

  var SPECIAL_LABEL = {
    row: '横向闪电',
    col: '纵向闪电',
    bomb: '魔法炸弹',
    rainbow: '彩虹魔杖'
  };

  var Ease = {
    linear: function (t) { return t; },
    quadOut: function (t) { return 1 - (1 - t) * (1 - t); },
    quadIn: function (t) { return t * t; },
    cubicOut: function (t) { return 1 - Math.pow(1 - t, 3); },
    backOut: function (t) {
      var s = 1.9;
      var u = t - 1;
      return 1 + u * u * ((s + 1) * u + s);
    },
    bounceOut: function (t) {
      var n = 7.5625, d = 2.75;
      if (t < 1 / d) return n * t * t;
      if (t < 2 / d) { t -= 1.5 / d; return n * t * t + 0.75; }
      if (t < 2.5 / d) { t -= 2.25 / d; return n * t * t + 0.9375; }
      t -= 2.625 / d;
      return n * t * t + 0.984375;
    },
    // 下落: 先加速, 落地时冲过头一点再回弹
    drop: function (t) {
      if (t < 0.8) { var u = t / 0.8; return u * u; }
      return 1 + Math.sin((t - 0.8) / 0.2 * Math.PI) * 0.045;
    }
  };

  /**
   * 极简补间引擎。每个 to() 返回 Promise, 便于把消除流程串成链。
   * cancelAll() 会立即兑现所有未完成的 Promise, 调用方需要用 generation 令牌
   * 判断自己是否已经过期(见 Game.prototype.gen)。
   */
  var Anim = (function () {
    var active = [];

    function to(target, props, duration, easing) {
      return new Promise(function (resolve) {
        if (duration <= 0) {
          for (var k in props) target[k] = props[k];
          resolve();
          return;
        }
        var from = {};
        for (var key in props) from[key] = target[key];
        active.push({
          target: target, from: from, to: props,
          dur: duration, elapsed: 0,
          ease: easing || Ease.quadOut,
          resolve: resolve
        });
      });
    }

    function wait(ms) {
      return new Promise(function (resolve) {
        active.push({ target: {}, from: {}, to: {}, dur: ms, elapsed: 0, ease: Ease.linear, resolve: resolve });
      });
    }

    function update(dt) {
      if (!active.length) return;
      var done = [];
      for (var i = active.length - 1; i >= 0; i--) {
        var tw = active[i];
        tw.elapsed += dt;
        var p = tw.dur > 0 ? Math.min(1, tw.elapsed / tw.dur) : 1;
        var e = tw.ease(p);
        for (var k in tw.to) {
          tw.target[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
        }
        if (p >= 1) {
          for (var k2 in tw.to) tw.target[k2] = tw.to[k2];
          active.splice(i, 1);
          done.push(tw);
        }
      }
      for (var j = 0; j < done.length; j++) done[j].resolve();
    }

    function cancelAll() {
      var pending = active;
      active = [];
      for (var i = 0; i < pending.length; i++) pending[i].resolve();
    }

    function count() { return active.length; }

    return { to: to, wait: wait, update: update, cancelAll: cancelAll, count: count };
  })();

  var Util = {
    clamp: function (v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); },
    randInt: function (n) { return Math.floor(Math.random() * n); },
    shuffle: function (arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Util.randInt(i + 1);
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    },
    roundRect: function (ctx, x, y, w, h, r) {
      var rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    },
    formatNumber: function (n) {
      return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }
  };

  // 单文件版(tools/build_single.py 产出)会在本脚本之前塞一份 window.MK_INLINE,
  // 把 'assets/xxx.png' 映射成内联的 dataURL。普通版这里是空表, assetUrl 原样返回。
  var INLINE = global.MK_INLINE || {};

  function assetUrl(path) {
    return Object.prototype.hasOwnProperty.call(INLINE, path) ? INLINE[path] : path;
  }

  var Storage = {
    key: 'mengke-match3-v1',
    read: function () {
      try {
        var raw = global.localStorage.getItem(Storage.key);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    },
    write: function (data) {
      try {
        global.localStorage.setItem(Storage.key, JSON.stringify(data));
      } catch (e) { /* 隐私模式下忽略 */ }
    },
    get: function (name, fallback) {
      var data = Storage.read();
      return Object.prototype.hasOwnProperty.call(data, name) ? data[name] : fallback;
    },
    set: function (name, value) {
      var data = Storage.read();
      data[name] = value;
      Storage.write(data);
    }
  };

  global.MK = {
    CONFIG: CONFIG,
    CHARACTERS: CHARACTERS,
    LEVELS: LEVELS,
    CHAPTER_SIZE: CHAPTER_SIZE,
    CHAPTER_NAMES: CHAPTER_NAMES,
    SPECIAL_LABEL: SPECIAL_LABEL,
    Ease: Ease,
    Anim: Anim,
    Util: Util,
    Storage: Storage,
    assetUrl: assetUrl
  };
})(window);

</script>
<script>
/*

 *           图片托管在 Catch! Teenieping Wiki (Fandom) 的 CDN 上, 返回

 *

 *           在请求头有 Referer 时会被防盗链挡成 404, 而 404 响应本身是一张
 *           占位图, 浏览器会当成加载成功, 于是棋盘上画出一堆灰色破图图标。
 *           裸地址不受影响, 且 CDN 会按 Accept 自动转 WebP, 每张只 8~15KB。
 *
 * 想换成别的图: 把下面 images 里对应的地址替换掉即可, 键名不要改。

 */

      // 并且只挑正脸、无相框、背景透明的, 缩到棋盘格子里才认得出谁是谁。
      images: {

        // 盼盼萌可 Chachaping (绿, 四叶草)

        // 唱唱萌可 Lalaping (紫, 音符)
        unicorn: WIKI + 'a/af/Lalaping_Render_5.png',

<script>
/*
 * 素材加载。
 *
 * 两套形象:
 *   original — 仓库自带的原创萌宠 PNG, 离线可用, 永远作为兜底。
 *   official — 奇妙萌可官方角色, 在线加载(地址见 js/skins.js)。
 *
 * 在线图的处理流程: 先查本地缓存 -> 没有就下载 -> 按不透明像素裁掉四周空白并居中
 * 到正方形(这样各张图在棋盘上大小一致) -> 缓存成 dataURL 下次直接用。
 * 下载失败或超时会退回原创形象, 不会白屏。
 */
(function (global) {
  'use strict';

  var MK = global.MK;
  var CHARACTERS = MK.CHARACTERS;
  var Storage = MK.Storage;

  var SPRITE_SIZE = 256;
  var REMOTE_TIMEOUT = 9000;
  var CACHE_PREFIX = 'mengke-skin-v4-';
  // 有防盗链的图床常把 404 也回一张小占位图, 浏览器会当成加载成功。
  // 角色图都在 320px 以上, 所以小于这个尺寸的一律按失败处理, 免得棋盘上画出破图。
  var MIN_REMOTE_SIZE = 96;

  var Assets = {
    images: {},        // 原创形象, 也是兜底
    remote: {},        // 已就绪的在线形象
    skin: Storage.get('skin', 'official'),
    ready: false,
    missing: [],       // 本地缺失的文件名
    remoteFailed: []   // 在线加载失败的角色 id
  };

  function loadImage(src, crossOrigin) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      if (crossOrigin) img.crossOrigin = crossOrigin;
      img.onload = function () { resolve(img); };
      img.onerror = function () { reject(new Error('加载失败: ' + src)); };
      img.src = src;
    });
  }

  function withTimeout(promise, ms) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var timer = global.setTimeout(function () {
        if (!settled) { settled = true; reject(new Error('超时')); }
      }, ms);
      promise.then(function (v) {
        if (settled) return;
        settled = true;
        global.clearTimeout(timer);
        resolve(v);
      }, function (e) {
        if (settled) return;
        settled = true;
        global.clearTimeout(timer);
        reject(e);
      });
    });
  }

  /** 图片缺失时的兜底: 画一只简笔萌宠头像。 */
  function drawFallbackSprite(character) {
    var size = SPRITE_SIZE;
    var canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    var ctx = canvas.getContext('2d');
    var cx = size / 2;
    var cy = size / 2 + 6;
    var radius = size * 0.33;

    ctx.lineWidth = 10;
    ctx.strokeStyle = '#ffffff';
    ctx.fillStyle = character.color;

    // 耳朵
    for (var s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.ellipse(cx + s * radius * 0.72, cy - radius * 0.78, radius * 0.3, radius * 0.46,
        s * 0.45, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    // 脸
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 高光
    var grad = ctx.createRadialGradient(cx - radius * 0.35, cy - radius * 0.45, 2, cx, cy, radius);
    grad.addColorStop(0, 'rgba(255,255,255,0.55)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();

    // 眼睛
    for (var e = -1; e <= 1; e += 2) {
      ctx.fillStyle = '#2b2140';
      ctx.beginPath();
      ctx.ellipse(cx + e * radius * 0.36, cy - radius * 0.08, radius * 0.16, radius * 0.21, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(cx + e * radius * 0.36 + radius * 0.06, cy - radius * 0.16, radius * 0.06, 0, Math.PI * 2);
      ctx.fill();
    }

    // 腮红
    ctx.fillStyle = 'rgba(255,120,160,0.45)';
    for (var b = -1; b <= 1; b += 2) {
      ctx.beginPath();
      ctx.ellipse(cx + b * radius * 0.62, cy + radius * 0.22, radius * 0.14, radius * 0.09, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 嘴
    ctx.strokeStyle = character.dark;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(cx, cy + radius * 0.2, radius * 0.18, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();

    return canvas;
  }

  /**
   * 描一圈边。官方图是粉彩色又没有轮廓线, 贴到同色系底板上会糊成一团;
   * 用角色自己的深色描边, 既能和底板分开, 也顺手强化了"这是哪一只"的颜色识别
   * (爱心和唱唱本身就是浅粉/浅紫, 描白边只会更糊)。
   * 做法是先取纯色剪影, 沿一圈方向盖一遍, 再压上原图。
   */
  function addOutline(sprite, thickness, color) {
    var size = sprite.width;

    var silhouette = document.createElement('canvas');
    silhouette.width = silhouette.height = size;
    var sctx = silhouette.getContext('2d');
    sctx.drawImage(sprite, 0, 0);
    sctx.globalCompositeOperation = 'source-in';
    sctx.fillStyle = color;
    sctx.fillRect(0, 0, size, size);

    var out = document.createElement('canvas');
    out.width = out.height = size;
    var octx = out.getContext('2d');
    var steps = 20;
    for (var i = 0; i < steps; i++) {
      var angle = i / steps * Math.PI * 2;
      octx.drawImage(silhouette, Math.cos(angle) * thickness, Math.sin(angle) * thickness);
    }
    octx.drawImage(sprite, 0, 0);
    return out;
  }

  /**
   * 裁掉四周透明边并居中到 SPRITE_SIZE 的正方形, 再加白边。
   * 在线图尺寸和留白各不相同, 不归一化的话棋盘上大小会参差不齐。
   * 读像素需要图片允许跨域, 拿不到就原图返回。
   */
  function normalize(img, character) {
    var w = img.naturalWidth || img.width;
    var h = img.naturalHeight || img.height;
    if (!w || !h) return img;

    var probeW = Math.min(w, 320);
    var probeH = Math.max(1, Math.round(h * probeW / w));
    var data;
    try {
      var probe = document.createElement('canvas');
      probe.width = probeW;
      probe.height = probeH;
      var pctx = probe.getContext('2d');
      pctx.drawImage(img, 0, 0, probeW, probeH);
      data = pctx.getImageData(0, 0, probeW, probeH).data;
    } catch (e) {
      return img;
    }

    var minX = probeW, minY = probeH, maxX = -1, maxY = -1;
    for (var y = 0; y < probeH; y++) {
      for (var x = 0; x < probeW; x++) {
        if (data[(y * probeW + x) * 4 + 3] > 12) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return img;

    var scale = w / probeW;
    var sx = minX * scale;
    var sy = minY * scale;
    var sw = (maxX - minX + 1) * scale;
    var sh = (maxY - minY + 1) * scale;
    // 留白刚好放得下白边(白边 2.8%, 每侧留 4%), 再多角色就显小了
    var side = Math.max(sw, sh) * 1.08;
    var k = SPRITE_SIZE / side;

    var out = document.createElement('canvas');
    out.width = out.height = SPRITE_SIZE;
    var octx = out.getContext('2d');
    octx.drawImage(img, sx, sy, sw, sh,
      (SPRITE_SIZE - sw * k) / 2, (SPRITE_SIZE - sh * k) / 2, sw * k, sh * k);
    return addOutline(out, SPRITE_SIZE * 0.026, character.dark);
  }

  // 在线图缓存单独放 key, 避免把几百 KB 的 base64 塞进设置用的那份 JSON
  function cacheKey(skinId, id) { return CACHE_PREFIX + skinId + '-' + id; }

  function cacheGet(skinId, id) {
    try {
      return global.localStorage.getItem(cacheKey(skinId, id));
    } catch (e) {
      return null;
    }
  }

  function cacheSet(skinId, id, dataUrl) {
    if (!dataUrl) return;
    try {
      global.localStorage.setItem(cacheKey(skinId, id), dataUrl);
    } catch (e) { /* 配额满或隐私模式, 忽略 */ }
  }

  function cacheDrop(skinId, id) {
    try {
      global.localStorage.removeItem(cacheKey(skinId, id));
    } catch (e) { /* 忽略 */ }
  }

  Assets.clearSkinCache = function () {
    Object.keys(MK.SKINS).forEach(function (skinId) {
      CHARACTERS.forEach(function (ch) { cacheDrop(skinId, ch.id); });
    });
  };

  function toDataUrl(canvas) {
    try {
      return canvas.toDataURL('image/png');
    } catch (e) {
      return null;   // 画布被跨域污染
    }
  }

  function tooSmall(img) {
    var w = img.naturalWidth || img.width;
    var h = img.naturalHeight || img.height;
    return !w || !h || w < MIN_REMOTE_SIZE || h < MIN_REMOTE_SIZE;
  }

  function loadRealImage(url, crossOrigin) {
    return withTimeout(loadImage(url, crossOrigin), REMOTE_TIMEOUT).then(function (img) {
      if (tooSmall(img)) throw new Error('疑似占位图: ' + url);
      return img;
    });
  }

  /** 下载一张在线图并归一化, 顺带写缓存。 */
  function fetchRemote(skinId, ch, url) {
    return loadRealImage(url, 'anonymous')
      .then(function (img) {
        var sprite = normalize(img, ch);
        Assets.remote[ch.id] = sprite;
        if (sprite !== img) cacheSet(skinId, ch.id, toDataUrl(sprite));
      })
      .catch(function () {
        // 带 crossOrigin 失败时再裸试一次: 拿不到像素也就没法裁切和缓存, 但至少能显示
        return loadRealImage(url, null)
          .then(function (img) { Assets.remote[ch.id] = img; })
          .catch(function () { Assets.remoteFailed.push(ch.id); });
      });
  }

  function loadRemoteOne(skinId, ch, url) {
    var cached = cacheGet(skinId, ch.id);
    if (!cached) return fetchRemote(skinId, ch, url);
    return loadImage(cached, null)
      .then(function (img) { Assets.remote[ch.id] = img; })
      .catch(function () {
        cacheDrop(skinId, ch.id);
        return fetchRemote(skinId, ch, url);
      });
  }

  /**
   * 加载本地素材。onProgress(已完成, 总数) 用于进度条。
   * 单张图失败不会中断流程, 只会记录到 Assets.missing 并使用兜底精灵。
   */
  Assets.load = function (onProgress) {
    var tasks = [];
    var total = CHARACTERS.length + 1;
    var done = 0;

    function step() {
      done++;
      if (onProgress) onProgress(done, total);
    }

    CHARACTERS.forEach(function (character) {
      var task = loadImage(MK.assetUrl('assets/characters/' + character.sprite + '.png'))
        .then(function (img) {
          Assets.images[character.id] = img;
        })
        .catch(function () {
          Assets.missing.push(character.sprite + '.png');
          Assets.images[character.id] = drawFallbackSprite(character);
        })
        .then(step);
      tasks.push(task);
    });

    tasks.push(
      loadImage(MK.assetUrl('assets/ui/background.jpg'))
        .then(function (img) { Assets.images.background = img; })
        .catch(function () { Assets.missing.push('background.jpg'); })
        .then(step)
    );

    return Promise.all(tasks).then(function () {
      Assets.ready = true;
      return Assets;
    });
  };

  /**
   * 加载在线形象。失败的角色会留在 Assets.remoteFailed 里, 渲染时自动用原创形象顶上。
   * 解析结果为成功加载的张数。
   */
  Assets.loadSkin = function (skinId, onProgress) {
    var skin = MK.SKINS[skinId];
    if (!skin || skin.source !== 'remote') {
      Assets.remoteFailed = [];
      return Promise.resolve(0);
    }

    Assets.remote = {};
    Assets.remoteFailed = [];
    var list = CHARACTERS.filter(function (ch) { return skin.images[ch.id]; });
    var done = 0;

    var tasks = list.map(function (ch) {
      return loadRemoteOne(skinId, ch, skin.images[ch.id]).then(function () {
        done++;
        if (onProgress) onProgress(done, list.length);
      });
    });

    return Promise.all(tasks).then(function () {
      return Object.keys(Assets.remote).length;
    });
  };

  /** 切换形象, 需要时下载在线图。解析结果为成功加载的张数(原创形象为 -1)。 */
  Assets.setSkin = function (skinId, onProgress) {
    if (!MK.SKINS[skinId]) return Promise.resolve(-1);
    Assets.skin = skinId;
    Storage.set('skin', skinId);
    if (MK.SKINS[skinId].source !== 'remote') {
      Assets.remote = {};
      Assets.remoteFailed = [];
      return Promise.resolve(-1);
    }
    return Assets.loadSkin(skinId, onProgress);
  };

  Assets.spriteById = function (id) {
    if (Assets.skin !== 'original' && Assets.remote[id]) return Assets.remote[id];
    return Assets.images[id];
  };

  Assets.sprite = function (typeIndex) {
    return Assets.spriteById(CHARACTERS[typeIndex].id);
  };

  /** 当前形象下角色的显示名。 */
  Assets.displayName = function (character) {
    if (Assets.skin === 'official' && Assets.remote[character.id] && character.official) {
      return character.official;
    }
    return character.name;
  };

  MK.Assets = Assets;
})(window);

</script>
<script>
/* WebAudio 实时合成音效与背景音乐。不依赖任何音频文件, 首包体积为零。 */
(function (global) {
  'use strict';

  var MK = global.MK;
  var Storage = MK.Storage;

  // 五声音阶(C 大调宫调式), 连锁时逐级升高, 听感上就是"越连越爽"
  var PENTATONIC = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51, 1567.98];

  var Sound = {
    sfxOn: Storage.get('sfxOn', true),
    bgmOn: Storage.get('bgmOn', true),
    unlocked: false
  };

  var ctx = null;
  var master = null;
  var sfxBus = null;
  var bgmBus = null;
  var bgmTimer = null;
  var bgmStep = 0;

  function ensureContext() {
    if (ctx) return ctx;
    var AudioCtor = global.AudioContext || global.webkitAudioContext;
    if (!AudioCtor) return null;
    try {
      ctx = new AudioCtor();
    } catch (e) {
      return null;
    }
    master = ctx.createGain();
    master.gain.value = 0.9;
    master.connect(ctx.destination);

    sfxBus = ctx.createGain();
    sfxBus.gain.value = 0.32;
    sfxBus.connect(master);

    bgmBus = ctx.createGain();
    bgmBus.gain.value = 0.075;
    bgmBus.connect(master);
    return ctx;
  }

  /** iOS / 微信必须在用户手势里恢复音频上下文。 */
  Sound.unlock = function () {
    if (!ensureContext()) return;
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    Sound.unlocked = true;
    if (Sound.bgmOn) Sound.startBgm();
  };

  function note(opts) {
    if (!ensureContext()) return;
    var isBgm = opts.channel === 'bgm';
    if (isBgm ? !Sound.bgmOn : !Sound.sfxOn) return;

    var now = ctx.currentTime + (opts.delay || 0);
    var dur = opts.duration || 0.16;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();

    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(opts.freq, now);
    if (opts.toFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(20, opts.toFreq), now + dur);

    var peak = opts.gain === undefined ? 0.5 : opts.gain;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(peak, now + Math.min(0.02, dur * 0.25));
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    osc.connect(gain);
    gain.connect(isBgm ? bgmBus : sfxBus);
    osc.start(now);
    osc.stop(now + dur + 0.03);
  }

  function noise(opts) {
    if (!Sound.sfxOn || !ensureContext()) return;
    var dur = opts.duration || 0.2;
    var length = Math.floor(ctx.sampleRate * dur);
    var buffer = ctx.createBuffer(1, length, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2);
    }
    var src = ctx.createBufferSource();
    src.buffer = buffer;

    var filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = opts.freq || 1200;
    filter.Q.value = 0.9;

    var gain = ctx.createGain();
    gain.gain.value = opts.gain === undefined ? 0.35 : opts.gain;

    src.connect(filter);
    filter.connect(gain);
    gain.connect(sfxBus);
    src.start();
  }

  Sound.swap = function () {
    note({ type: 'sine', freq: 520, toFreq: 700, duration: 0.09, gain: 0.28 });
  };

  Sound.invalid = function () {
    note({ type: 'square', freq: 190, toFreq: 130, duration: 0.14, gain: 0.16 });
  };

  Sound.select = function () {
    note({ type: 'triangle', freq: 880, duration: 0.06, gain: 0.2 });
  };

  /** cascade 从 1 开始, 连锁越深音高越高。 */
  Sound.pop = function (cascade) {
    var idx = Math.min(PENTATONIC.length - 1, (cascade || 1) - 1);
    note({ type: 'triangle', freq: PENTATONIC[idx], duration: 0.16, gain: 0.36 });
    note({ type: 'sine', freq: PENTATONIC[idx] * 2, duration: 0.1, gain: 0.14, delay: 0.01 });
    noise({ freq: 2600, duration: 0.12, gain: 0.12 });
  };

  Sound.special = function (kind) {
    if (kind === 'rainbow') {
      for (var i = 0; i < 6; i++) {
        note({ type: 'sine', freq: PENTATONIC[i], duration: 0.3, gain: 0.24, delay: i * 0.045 });
      }
    } else if (kind === 'bomb') {
      note({ type: 'sawtooth', freq: 220, toFreq: 60, duration: 0.34, gain: 0.3 });
      noise({ freq: 500, duration: 0.36, gain: 0.3 });
    } else {
      note({ type: 'sawtooth', freq: 900, toFreq: 260, duration: 0.24, gain: 0.24 });
      noise({ freq: 1800, duration: 0.2, gain: 0.16 });
    }
  };

  Sound.create = function () {
    note({ type: 'sine', freq: 1046, duration: 0.22, gain: 0.3 });
    note({ type: 'sine', freq: 1568, duration: 0.26, gain: 0.18, delay: 0.06 });
  };

  Sound.win = function () {
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
      note({ type: 'triangle', freq: f, duration: 0.42, gain: 0.34, delay: i * 0.12 });
    });
  };

  Sound.lose = function () {
    [523.25, 466.16, 392.0, 311.13].forEach(function (f, i) {
      note({ type: 'triangle', freq: f, duration: 0.34, gain: 0.28, delay: i * 0.14 });
    });
  };

  Sound.star = function (index) {
    note({ type: 'sine', freq: 880 * Math.pow(1.26, index || 0), duration: 0.35, gain: 0.32 });
  };

  Sound.click = function () {
    note({ type: 'sine', freq: 660, toFreq: 880, duration: 0.07, gain: 0.22 });
  };

  // 缓慢的五声音阶琶音 + 低音垫, 循环 8 小节
  var BGM_PATTERN = [0, 2, 4, 2, 5, 4, 2, 0, 1, 3, 5, 3, 6, 5, 3, 1];
  var BGM_BASS = [130.81, 130.81, 174.61, 174.61, 196.0, 196.0, 146.83, 146.83];

  Sound.startBgm = function () {
    if (!Sound.bgmOn || bgmTimer || !ensureContext()) return;
    var beat = 340;
    bgmTimer = global.setInterval(function () {
      if (!ctx || ctx.state === 'suspended') return;
      var idx = bgmStep % BGM_PATTERN.length;
      note({
        channel: 'bgm',
        type: 'sine',
        freq: PENTATONIC[BGM_PATTERN[idx]],
        duration: 0.5,
        gain: 0.5
      });
      if (idx % 2 === 0) {
        note({
          channel: 'bgm',
          type: 'triangle',
          freq: BGM_BASS[(bgmStep / 2 | 0) % BGM_BASS.length],
          duration: 0.72,
          gain: 0.42
        });
      }
      bgmStep++;
    }, beat);
  };

  Sound.stopBgm = function () {
    if (bgmTimer) {
      global.clearInterval(bgmTimer);
      bgmTimer = null;
    }
  };

  Sound.setSfx = function (on) {
    Sound.sfxOn = !!on;
    Storage.set('sfxOn', Sound.sfxOn);
  };

  Sound.setBgm = function (on) {
    Sound.bgmOn = !!on;
    Storage.set('bgmOn', Sound.bgmOn);
    if (Sound.bgmOn) Sound.startBgm(); else Sound.stopBgm();
  };

  // 切到后台时静音, 回到前台恢复
  global.document.addEventListener('visibilitychange', function () {
    if (!ctx) return;
    if (global.document.hidden) {
      Sound.stopBgm();
      if (ctx.suspend) ctx.suspend();
    } else {
      if (ctx.resume) ctx.resume();
      if (Sound.bgmOn && Sound.unlocked) Sound.startBgm();
    }
  });

  MK.Sound = Sound;
})(window);

</script>
<script>
/* 棋盘与消除规则(纯逻辑, 不涉及渲染) */
(function (global) {
  'use strict';

  var Util = global.MK.Util;

  var DIRS = [{ dr: 0, dc: 1 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: -1, dc: 0 }];

  function key(r, c) { return r * 100 + c; }

  /** 棋子。渲染需要的 x/y/scale/alpha 也挂在同一个对象上, 保证逻辑与画面单一数据源。 */
  function Tile(type, r, c) {
    this.type = type;
    this.special = null;   // null | 'row' | 'col' | 'bomb' | 'rainbow'
    this.r = r;
    this.c = c;
    this.x = 0;
    this.y = 0;
    this.scale = 1;
    this.alpha = 1;
    this.spin = 0;
  }

  function Board(rows, cols, typeCount) {
    this.rows = rows;
    this.cols = cols;
    this.typeCount = typeCount;
    this.cells = [];
    this.reset();
  }

  Board.prototype.reset = function () {
    this.cells = [];
    for (var r = 0; r < this.rows; r++) {
      var row = [];
      for (var c = 0; c < this.cols; c++) row.push(null);
      this.cells.push(row);
    }
  };

  Board.prototype.inside = function (r, c) {
    return r >= 0 && r < this.rows && c >= 0 && c < this.cols;
  };

  Board.prototype.get = function (r, c) {
    return this.inside(r, c) ? this.cells[r][c] : null;
  };

  Board.prototype.set = function (r, c, tile) {
    this.cells[r][c] = tile;
    if (tile) { tile.r = r; tile.c = c; }
  };

  Board.prototype.forEach = function (fn) {
    for (var r = 0; r < this.rows; r++) {
      for (var c = 0; c < this.cols; c++) {
        if (this.cells[r][c]) fn(this.cells[r][c], r, c);
      }
    }
  };

  Board.prototype.randomType = function () {
    return Util.randInt(this.typeCount);
  };

  /** 生成一个初始无三连、且至少存在一个可行走法的棋盘。 */
  Board.prototype.generate = function () {
    for (var attempt = 0; attempt < 60; attempt++) {
      this.reset();
      for (var r = 0; r < this.rows; r++) {
        for (var c = 0; c < this.cols; c++) {
          var banned = {};
          var left = this.get(r, c - 1), left2 = this.get(r, c - 2);
          if (left && left2 && left.type === left2.type) banned[left.type] = true;
          var up = this.get(r - 1, c), up2 = this.get(r - 2, c);
          if (up && up2 && up.type === up2.type) banned[up.type] = true;

          var pool = [];
          for (var t = 0; t < this.typeCount; t++) if (!banned[t]) pool.push(t);
          var picked = pool.length ? pool[Util.randInt(pool.length)] : this.randomType();
          this.set(r, c, new Tile(picked, r, c));
        }
      }
      if (!this.findRuns().length && this.findMove()) return;
    }
  };

  /** 找出所有横向/纵向长度 >= 3 的连续段。 */
  Board.prototype.findRuns = function () {
    var runs = [];
    var r, c, end, tile;

    for (r = 0; r < this.rows; r++) {
      c = 0;
      while (c < this.cols) {
        tile = this.cells[r][c];
        if (!tile) { c++; continue; }
        end = c;
        while (end + 1 < this.cols && this.cells[r][end + 1] && this.cells[r][end + 1].type === tile.type) end++;
        if (end - c + 1 >= 3) runs.push({ dir: 'h', r: r, c: c, len: end - c + 1, type: tile.type });
        c = end + 1;
      }
    }

    for (c = 0; c < this.cols; c++) {
      r = 0;
      while (r < this.rows) {
        tile = this.cells[r][c];
        if (!tile) { r++; continue; }
        end = r;
        while (end + 1 < this.rows && this.cells[end + 1][c] && this.cells[end + 1][c].type === tile.type) end++;
        if (end - r + 1 >= 3) runs.push({ dir: 'v', r: r, c: c, len: end - r + 1, type: tile.type });
        r = end + 1;
      }
    }
    return runs;
  };

  function runCells(run) {
    var cells = [];
    for (var i = 0; i < run.len; i++) {
      cells.push(run.dir === 'h' ? { r: run.r, c: run.c + i } : { r: run.r + i, c: run.c });
    }
    return cells;
  }

  /**
   * 把相交的连续段合并成一个消除组, 并判定该组应该产出什么特殊棋子:
   * 5 连 -> 彩虹魔杖, L/T 形 -> 魔法炸弹, 4 连 -> 对应方向的闪电。
   */
  Board.prototype.findMatches = function () {
    var runs = this.findRuns();
    if (!runs.length) return [];

    var groups = [];
    var cellOwner = {};

    for (var i = 0; i < runs.length; i++) {
      var run = runs[i];
      var cells = runCells(run);
      var merged = null;

      for (var j = 0; j < cells.length; j++) {
        var owner = cellOwner[key(cells[j].r, cells[j].c)];
        if (owner !== undefined && groups[owner]) { merged = owner; break; }
      }

      if (merged === null) {
        groups.push({ type: run.type, runs: [run], cells: cells.slice() });
        merged = groups.length - 1;
      } else {
        var g = groups[merged];
        g.runs.push(run);
        for (var k = 0; k < cells.length; k++) {
          if (cellOwner[key(cells[k].r, cells[k].c)] === undefined) g.cells.push(cells[k]);
        }
      }
      for (var m = 0; m < cells.length; m++) cellOwner[key(cells[m].r, cells[m].c)] = merged;
    }

    for (var gi = 0; gi < groups.length; gi++) {
      var group = groups[gi];
      var maxLen = 0, hasH = false, hasV = false, longest = group.runs[0];
      for (var ri = 0; ri < group.runs.length; ri++) {
        var rr = group.runs[ri];
        if (rr.dir === 'h') hasH = true; else hasV = true;
        if (rr.len > maxLen) { maxLen = rr.len; longest = rr; }
      }
      group.maxLen = maxLen;

      if (maxLen >= 5) group.special = 'rainbow';
      else if (hasH && hasV) group.special = 'bomb';
      else if (maxLen === 4) group.special = longest.dir === 'h' ? 'row' : 'col';
      else group.special = null;

      group.longest = longest;
    }
    return groups;
  };

  /** 某个位置放上指定 type 后是否会形成三连(用于试算走法)。 */
  Board.prototype.wouldMatchAt = function (r, c, type) {
    var dirs = [[0, 1], [1, 0]];
    for (var d = 0; d < dirs.length; d++) {
      var count = 1;
      for (var sign = -1; sign <= 1; sign += 2) {
        var step = 1;
        while (true) {
          var nr = r + dirs[d][0] * step * sign;
          var nc = c + dirs[d][1] * step * sign;
          var tile = this.get(nr, nc);
          if (!tile || tile.type !== type) break;
          count++;
          step++;
        }
      }
      if (count >= 3) return true;
    }
    return false;
  };

  Board.prototype.swapTiles = function (a, b) {
    var ta = this.get(a.r, a.c);
    var tb = this.get(b.r, b.c);
    this.set(a.r, a.c, tb);
    this.set(b.r, b.c, ta);
  };

  /** 交换后是否产生消除(特殊棋子参与交换时永远有效)。 */
  Board.prototype.isValidSwap = function (a, b) {
    var ta = this.get(a.r, a.c);
    var tb = this.get(b.r, b.c);
    if (!ta || !tb) return false;
    if (ta.special || tb.special) return true;

    this.swapTiles(a, b);
    var ok = this.wouldMatchAt(a.r, a.c, this.get(a.r, a.c).type) ||
             this.wouldMatchAt(b.r, b.c, this.get(b.r, b.c).type);
    this.swapTiles(a, b);
    return ok;
  };

  /** 返回任意一个可行走法 {a, b}, 没有则返回 null。 */
  Board.prototype.findMove = function () {
    var candidates = [];
    for (var r = 0; r < this.rows; r++) {
      for (var c = 0; c < this.cols; c++) {
        if (c + 1 < this.cols) candidates.push([{ r: r, c: c }, { r: r, c: c + 1 }]);
        if (r + 1 < this.rows) candidates.push([{ r: r, c: c }, { r: r + 1, c: c }]);
      }
    }
    Util.shuffle(candidates);
    for (var i = 0; i < candidates.length; i++) {
      if (this.isValidSwap(candidates[i][0], candidates[i][1])) {
        return { a: candidates[i][0], b: candidates[i][1] };
      }
    }
    return null;
  };

  /** 原地重排现有棋子, 直到无三连且有解。 */
  Board.prototype.shuffleBoard = function () {
    var tiles = [];
    this.forEach(function (tile) { tiles.push(tile); });

    for (var attempt = 0; attempt < 80; attempt++) {
      Util.shuffle(tiles);
      var i = 0;
      for (var r = 0; r < this.rows; r++) {
        for (var c = 0; c < this.cols; c++) {
          if (i < tiles.length) this.set(r, c, tiles[i++]);
        }
      }
      if (!this.findRuns().length && this.findMove()) return true;
    }
    return false;
  };

  /**
   * 以 seeds 为起点向外展开消除范围, 逐个引爆遇到的特殊棋子(可连锁)。
   * partnerType: 彩虹魔杖被交换触发时, 指定要清除的角色种类。
   */
  Board.prototype.expandClears = function (seeds, partnerType) {
    var self = this;
    var marked = {};
    var queue = [];
    var cleared = [];
    var effects = [];

    function push(r, c) {
      if (!self.inside(r, c)) return;
      if (marked[key(r, c)]) return;
      var tile = self.get(r, c);
      if (!tile) return;
      marked[key(r, c)] = true;
      cleared.push({ r: r, c: c, tile: tile });
      queue.push({ r: r, c: c, tile: tile });
    }

    for (var i = 0; i < seeds.length; i++) push(seeds[i].r, seeds[i].c);

    while (queue.length) {
      var cur = queue.shift();
      var special = cur.tile.special;
      if (!special) continue;

      effects.push({ r: cur.r, c: cur.c, special: special, type: cur.tile.type });

      if (special === 'row') {
        for (var c1 = 0; c1 < this.cols; c1++) push(cur.r, c1);
      } else if (special === 'col') {
        for (var r1 = 0; r1 < this.rows; r1++) push(r1, cur.c);
      } else if (special === 'bomb') {
        for (var dr = -1; dr <= 1; dr++) {
          for (var dc = -1; dc <= 1; dc++) push(cur.r + dr, cur.c + dc);
        }
      } else if (special === 'rainbow') {
        var target = (partnerType === null || partnerType === undefined) ? cur.tile.type : partnerType;
        partnerType = null; // 只对首个彩虹生效, 连锁的彩虹用自身颜色
        for (var r2 = 0; r2 < this.rows; r2++) {
          for (var c2 = 0; c2 < this.cols; c2++) {
            var t = this.get(r2, c2);
            if (t && t.type === target) push(r2, c2);
          }
        }
      }
    }

    return { cleared: cleared, effects: effects };
  };

  /** 让棋子下落并在顶部补充新棋子。返回本次的移动与新生成列表, 交给渲染层做动画。 */
  Board.prototype.collapse = function () {
    var moves = [];
    var spawns = [];

    for (var c = 0; c < this.cols; c++) {
      var writeRow = this.rows - 1;
      for (var r = this.rows - 1; r >= 0; r--) {
        var tile = this.cells[r][c];
        if (!tile) continue;
        if (r !== writeRow) {
          this.cells[r][c] = null;
          this.set(writeRow, c, tile);
          moves.push({ tile: tile, fromRow: r, toRow: writeRow, distance: writeRow - r });
        }
        writeRow--;
      }
      var spawnIndex = 0;
      for (var nr = writeRow; nr >= 0; nr--) {
        var fresh = new Tile(this.randomType(), nr, c);
        this.set(nr, c, fresh);
        spawns.push({ tile: fresh, row: nr, col: c, offset: spawnIndex + 1 });
        spawnIndex++;
      }
    }
    return { moves: moves, spawns: spawns };
  };

  Board.prototype.remove = function (r, c) {
    this.cells[r][c] = null;
  };

  global.MK.Board = Board;
  global.MK.Tile = Tile;
})(window);
